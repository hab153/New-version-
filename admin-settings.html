<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Settings | Skyline AA-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg-void: #060608; --bg-surface: #111318; --accent: #c8ff57; --text-1: #e8eaf0; --text-2: #8c909e; --font-mono: 'IBM Plex Mono', monospace; --font-sans: 'Syne', sans-serif; }
    body { background: var(--bg-void); color: var(--text-1); font-family: var(--font-sans); margin: 0; padding: 40px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }
    h1 { font-size: 24px; margin-bottom: 30px; }
    .section { background: var(--bg-surface); padding: 24px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.06); }
    h2 { font-size: 16px; margin-bottom: 15px; color: var(--accent); font-family: var(--font-mono); }
    label { display: block; font-size: 11px; color: var(--text-2); margin-bottom: 5px; text-transform: uppercase; }
    input { width: 100%; background: #0b0c0f; border: 1px solid rgba(255,255,255,0.1); color: var(--text-1); padding: 10px; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; }
    button { background: var(--accent); color: #060608; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; width: 100%; }
    .back-link { color: var(--text-2); text-decoration: none; display: inline-block; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <a href="admin-dashboard.html" class="back-link">← Back to Dashboard</a>
    <h1>Admin Security Settings</h1>
    
    <div class="section">
      <h2>Update Crypto Password</h2>
      <label>Current 32-Char Password</label>
      <input type="password" id="currPass">
      <label>New 32-Char Password</label>
      <input type="password" id="newPass">
      <button onclick="updatePass()">Update Password</button>
    </div>

    <div class="section">
      <h2>Update Security Questions</h2>
      <label>Current Password (Required)</label>
      <input type="password" id="authPass">
      <!-- Add inputs for your 8 questions here -->
      <p style="color:var(--text-2); font-size:12px;">To update questions, use the initAdmin.js script for maximum security.</p>
    </div>
  </div>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = "login.html";
    
    async function updatePass() {
      const curr = document.getElementById('currPass').value;
      const newP = document.getElementById('newPass').value;
      if(newP.length !== 32) { alert("New password must be 32 chars"); return; }
      
      const res = await fetch('https://skylineapp-backend-file.onrender.com/api/auth/change-password', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ currentPassword: curr, newPassword: newP })
      });
      const data = await res.json();
      alert(data.message);
    }
  </script>
</body>
</html>
