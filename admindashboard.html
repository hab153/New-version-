<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyline Admin Dashboard</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; color: #66dd99; }
        .user-info { font-size: 14px; color: #888; margin-top: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); border-color: rgba(102,221,153,0.3); }
        .card h3 { margin-top: 0; color: #aaa; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .stat { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .btn-action { 
            width: 100%; background: #66dd99; color: #000; border: none; 
            padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; 
            font-size: 14px; margin-top: 10px; transition: opacity 0.2s; 
        }
        .btn-action:hover { opacity: 0.9; }
        .btn-logout { background: transparent; border: 1px solid #ff5555; color: #ff5555; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .btn-logout:hover { background: #ff5555; color: #fff; }
        .loading { text-align: center; padding: 50px; color: #666; font-size: 18px; }
    </style>
</head>
<body>
    <div id="dashboardContent" style="display: none;">
        <div class="header">
            <div>
                <h1>🛡️ Skyline Admin Dashboard</h1>
                <div class="user-info" id="adminEmail">Admin Panel</div>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Total Users</h3>
                <div class="stat" id="totalUsers">--</div>
            </div>
            <div class="card">
                <h3>Active Leads</h3>
                <div class="stat" id="activeLeads">--</div>
            </div>
            <div class="card">
                <h3>System Status</h3>
                <div class="stat" style="color: #66dd99; font-size: 20px;">● Online</div>
            </div>
            <!-- ✅ VIEW ALL USERS BUTTON -->
            <div class="card" style="display: flex; flex-direction: column; justify-content: center;">
                <h3>User Management</h3>
                <p style="color: #888; font-size: 13px; margin: 5px 0 15px;">View, search, and manage all registered users.</p>
                <button class="btn-action" onclick="window.location.href='/users.html'">👥 View All Users</button>
            </div>
        </div>
    </div>

    <div id="loadingMsg" class="loading">Verifying admin access...</div>

    <script>
        const API_BASE = 'https://skylineapp-backend-file.onrender.com';

        async function initDashboard() {
            const token = localStorage.getItem('adminToken');
            
            // ✅ FIX: Only check if token exists, don't validate against user endpoint yet
            if (!token) {
                window.location.href = '/admin-signup.html';
                return;
            }

            try {
                // Optional: Verify token is still valid using a safe endpoint
                const res = await fetch(`${API_BASE}/api/health`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Server unreachable');

                document.getElementById('adminEmail').textContent = 'Authenticated Admin';
                
                // Fetch real stats if available
                try {
                    const usersRes = await fetch(`${API_BASE}/api/admin/users`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (usersRes.ok) {
                        const usersData = await usersRes.json();
                        document.getElementById('totalUsers').textContent = Array.isArray(usersData) ? usersData.length : 0;
                    }
                } catch(e) { console.log('Stats fetch skipped'); }

                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
                
            } catch (err) {
                console.error('Auth failed:', err);
                // Only redirect on actual auth failure, not server errors
                if (err.message.includes('Invalid') || err.message.includes('Unauthorized')) {
                    localStorage.removeItem('adminToken');
                    window.location.href = '/admin-signup.html';
                } else {
                    // Show dashboard anyway if it's just a network blip
                    document.getElementById('loadingMsg').style.display = 'none';
                    document.getElementById('dashboardContent').style.display = 'block';
                }
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = '/admin-signup.html';
        }

        initDashboard();
    </script>
</body>
</html>
