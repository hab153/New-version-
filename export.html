<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Export Data · Skyline AA-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --void: #0a0a0a; --base: #121212; --surface: #1a1a1a;
            --raised: #242424; --hover: #2d2d2d; --card: #1a1a1a;
            --br-dim: rgba(255,255,255,0.06); --br-md: rgba(255,255,255,0.12);
            --gold: #ffffff; --gold-bright: #f0f0f0;
            --accent: #c8ff57; --success: #66dd99; --danger: #ff5555; --warning: #ffbb44;
            --t1: #f5f5f5; --t2: #b0b0b0; --t3: #707070;
            --mono: 'IBM Plex Mono', 'Monaco', monospace;
            --display: 'Syne', 'Segoe UI', sans-serif;
            --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        body {
            background: var(--void); color: var(--t1); font-family: var(--ui);
            font-size: 14px; line-height: 1.6; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse 60% 40% at 10% 0%, rgba(201,168,76,0.055) 0%, transparent 60%),
                        radial-gradient(ellipse 40% 60% at 90% 100%, rgba(94,154,184,0.03) 0%, transparent 55%);
            pointer-events: none;
        }

        .container {
            max-width: 680px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--br-md);
            border-radius: 20px;
            padding: 40px 32px;
            position: relative;
            z-index: 1;
            box-shadow: 0 24px 80px rgba(0,0,0,0.7);
            animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            display: flex; align-items: center; gap: 14px; margin-bottom: 8px;
        }
        .header-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, #a0d040 100%);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            font-size: 22px;
        }
        .header h1 {
            font-family: var(--display); font-size: 26px; font-weight: 600;
            color: var(--t1); letter-spacing: -0.5px;
        }
        .header h1 span { color: var(--accent); }
        .sub {
            color: var(--t2); font-size: 13px; margin-bottom: 28px;
            padding-left: 58px;
        }

        .format-selector {
            display: flex; gap: 12px; margin-bottom: 24px;
            background: var(--base); padding: 6px; border-radius: 12px;
            border: 1px solid var(--br-dim);
        }
        .format-btn {
            flex: 1; padding: 12px 16px; border: none; border-radius: 8px;
            background: transparent; color: var(--t3); font-family: var(--mono);
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all 0.25s ease;
        }
        .format-btn:hover { color: var(--t1); background: var(--hover); }
        .format-btn.active {
            background: var(--raised); color: var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .format-btn .badge {
            font-size: 8px; background: rgba(255,255,255,0.06);
            padding: 2px 8px; border-radius: 10px; margin-left: 6px;
            color: var(--t3);
        }
        .format-btn.active .badge { background: rgba(200,255,87,0.12); color: var(--accent); }

        .export-btn {
            width: 100%; padding: 16px; background: var(--accent); color: #0d0a04;
            border: none; border-radius: 12px; font-family: var(--display);
            font-weight: 700; font-size: 15px; cursor: pointer;
            transition: all 0.25s ease; display: flex; align-items: center;
            justify-content: center; gap: 10px;
            box-shadow: 0 4px 20px rgba(200,255,87,0.15);
        }
        .export-btn:hover:not(:disabled) {
            transform: translateY(-2px); box-shadow: 0 8px 32px rgba(200,255,87,0.25);
            background: #d4ff70;
        }
        .export-btn:disabled {
            opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none;
        }
        .export-btn .spinner {
            width: 18px; height: 18px; border: 2px solid transparent;
            border-top-color: #0d0a04; border-radius: 50%;
            animation: spin 0.7s linear infinite; display: none;
        }
        .export-btn.loading .spinner { display: inline-block; }
        .export-btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .divider {
            margin: 32px 0; border: 0; border-top: 1px solid var(--br-dim);
        }

        .section-title {
            font-family: var(--mono); font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.15em; color: var(--t3); margin-bottom: 16px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title .count {
            background: var(--raised); padding: 0 10px; border-radius: 10px;
            font-size: 9px; color: var(--t2);
        }

        .export-list {
            display: flex; flex-direction: column; gap: 12px;
            min-height: 60px;
        }
        .export-item {
            background: var(--base); border: 1px solid var(--br-dim);
            border-radius: 12px; padding: 16px 18px;
            display: flex; align-items: center; justify-content: space-between;
            transition: all 0.2s ease; animation: fadeInUp 0.3s ease both;
        }
        .export-item:hover { border-color: var(--br-md); }
        .export-item .info { display: flex; flex-direction: column; gap: 3px; flex: 1; }
        .export-item .info .name {
            font-family: var(--mono); font-size: 13px; color: var(--t1);
            display: flex; align-items: center; gap: 8px;
        }
        .export-item .info .meta {
            font-size: 11px; color: var(--t3); font-family: var(--mono);
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .export-item .info .meta .size { color: var(--t2); }
        .status-badge {
            font-size: 9px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; padding: 3px 10px; border-radius: 10px;
            font-family: var(--mono);
        }
        .status-badge.ready { background: rgba(102,221,153,0.12); color: var(--success); }
        .status-badge.processing { background: rgba(255,187,68,0.12); color: var(--warning); }
        .status-badge.expired { background: rgba(255,85,85,0.08); color: var(--danger); }
        .status-badge.failed { background: rgba(255,85,85,0.12); color: var(--danger); }

        .export-item .actions {
            display: flex; gap: 6px; align-items: center;
        }
        .action-btn {
            padding: 6px 14px; border: 1px solid var(--br-dim); border-radius: 6px;
            background: transparent; color: var(--t2); font-family: var(--mono);
            font-size: 10px; cursor: pointer; transition: all 0.2s ease;
            text-decoration: none; display: inline-flex; align-items: center;
            gap: 4px;
        }
        .action-btn:hover:not(:disabled) {
            background: var(--hover); border-color: var(--br-md); color: var(--t1);
        }
        .action-btn.download {
            border-color: rgba(200,255,87,0.2); color: var(--accent);
        }
        .action-btn.download:hover {
            background: rgba(200,255,87,0.08); border-color: var(--accent);
        }
        .action-btn.delete {
            border-color: rgba(255,85,85,0.15); color: var(--danger);
        }
        .action-btn.delete:hover {
            background: rgba(255,85,85,0.08); border-color: var(--danger);
        }
        .action-btn:disabled {
            opacity: 0.4; cursor: not-allowed;
        }

        .empty-state {
            text-align: center; padding: 40px 20px; color: var(--t3);
        }
        .empty-state .icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }
        .empty-state .text { font-size: 13px; }
        .empty-state .hint { font-size: 11px; font-family: var(--mono); color: var(--t3); margin-top: 4px; }

        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; border-radius: 10px; font-family: var(--mono);
            font-size: 13px; font-weight: 500; z-index: 9999; display: none;
            animation: slideDown 0.3s ease; backdrop-filter: blur(12px);
        }
        .toast.success { background: rgba(102,221,153,0.12); border: 1px solid var(--success); color: var(--success); }
        .toast.error { background: rgba(255,85,85,0.12); border: 1px solid var(--danger); color: var(--danger); }
        .toast.info { background: rgba(200,255,87,0.08); border: 1px solid var(--accent); color: var(--accent); }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .back-link {
            display: block; text-align: center; margin-top: 24px;
            color: var(--t3); text-decoration: none; font-size: 13px;
            transition: color 0.2s; font-family: var(--mono);
        }
        .back-link:hover { color: var(--accent); }

        .progress-bar {
            width: 100px; height: 4px; background: var(--raised);
            border-radius: 2px; overflow: hidden; display: inline-block;
            vertical-align: middle;
        }
        .progress-bar .fill {
            height: 100%; background: var(--accent); border-radius: 2px;
            transition: width 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .container { padding: 24px 16px; }
            .header h1 { font-size: 20px; }
            .sub { padding-left: 0; font-size: 12px; }
            .export-item { flex-wrap: wrap; gap: 10px; }
            .export-item .actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">📤</div>
            <div>
                <h1>Export Your <span>Data</span></h1>
            </div>
        </div>
        <p class="sub">
            Download all your data in a machine-readable format (JSON or CSV).
            Exports expire after 24 hours.
        </p>

        <!-- Format Selector -->
        <div class="format-selector">
            <button class="format-btn active" data-format="json" onclick="selectFormat('json')">
                JSON <span class="badge">Structured</span>
            </button>
            <button class="format-btn" data-format="csv" onclick="selectFormat('csv')">
                CSV <span class="badge">Spreadsheet</span>
            </button>
        </div>

        <!-- Export Button -->
        <button class="export-btn" id="exportBtn" onclick="requestExport()">
            <span class="spinner"></span>
            <span class="btn-text">📥 Request Export</span>
        </button>

        <hr class="divider">

        <!-- Export List -->
        <div class="section-title">
            Your Exports
            <span class="count" id="exportCount">0</span>
        </div>
        <div class="export-list" id="exportList">
            <div class="empty-state">
                <div class="icon">📂</div>
                <div class="text">No exports yet</div>
                <div class="hint">Request your first export above</div>
            </div>
        </div>

        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>

    <script>
        // ──────────────────────────────────────────────────────────────
        //  GLOBAL CSRF FETCH INTERCEPTOR
        // ──────────────────────────────────────────────────────────────
        (function() {
            const originalFetch = window.fetch;
            window.fetch = function(url, options = {}) {
                const csrfToken = localStorage.getItem('csrfToken');
                const method = (options.method || 'GET').toUpperCase();
                const safeMethods = ['GET', 'HEAD', 'OPTIONS'];

                if (!safeMethods.includes(method) && csrfToken) {
                    options.headers = options.headers || {};
                    options.headers['X-CSRF-Token'] = csrfToken;
                }

                return originalFetch.call(this, url, options);
            };
        })();

        // ──────────────────────────────────────────────────────────────
        //  XSS ESCAPE
        // ──────────────────────────────────────────────────────────────
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ──────────────────────────────────────────────────────────────
        //  CONSTANTS & STATE
        // ──────────────────────────────────────────────────────────────
        const BACKEND = 'https://skylineapp-backend-file.onrender.com';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        let selectedFormat = 'json';
        let isLoading = false;
        let refreshInterval = null;

        // ──────────────────────────────────────────────────────────────
        //  TOAST
        // ──────────────────────────────────────────────────────────────
        function showToast(message, type = 'success', duration = 4000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }

        // ──────────────────────────────────────────────────────────────
        //  FORMAT SELECTOR
        // ──────────────────────────────────────────────────────────────
        function selectFormat(format) {
            selectedFormat = format;
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.format === format);
            });
        }

        // ──────────────────────────────────────────────────────────────
        //  REQUEST EXPORT
        // ──────────────────────────────────────────────────────────────
        async function requestExport() {
            if (isLoading) return;
            isLoading = true;

            const btn = document.getElementById('exportBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch(`${BACKEND}/api/data/export`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ format: selectedFormat })
                });

                const data = await res.json();

                if (res.status === 429) {
                    showToast(`⏳ ${data.error || 'Rate limit exceeded. Please wait 1 hour.'}`, 'error', 5000);
                    return;
                }

                if (!res.ok) {
                    throw new Error(data.error || 'Failed to create export');
                }

                showToast(`✅ ${data.message || 'Export created successfully!'}`, 'success', 4000);
                await loadExports();

            } catch (error) {
                console.error('Export error:', error);
                showToast(`❌ ${error.message || 'Failed to create export'}`, 'error', 5000);
            } finally {
                isLoading = false;
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // ──────────────────────────────────────────────────────────────
        //  LOAD EXPORTS
        // ──────────────────────────────────────────────────────────────
        async function loadExports() {
            const list = document.getElementById('exportList');
            const count = document.getElementById('exportCount');

            try {
                const res = await fetch(`${BACKEND}/api/data/exports`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Failed to load exports');

                const data = await res.json();
                const exports = data.data || [];

                count.textContent = exports.length;

                if (exports.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📂</div>
                            <div class="text">No exports yet</div>
                            <div class="hint">Request your first export above</div>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = exports.map((exp, index) => {
                    const isReady = exp.status === 'completed' && exp.fileExists;
                    const isProcessing = exp.status === 'processing' || exp.status === 'pending';
                    const isExpired = exp.status === 'expired' || (exp.expiresAt && new Date(exp.expiresAt) < new Date());
                    const isFailed = exp.status === 'failed';

                    let statusText = 'Ready';
                    let statusClass = 'ready';
                    if (isProcessing) { statusText = 'Processing'; statusClass = 'processing'; }
                    else if (isExpired) { statusText = 'Expired'; statusClass = 'expired'; }
                    else if (isFailed) { statusText = 'Failed'; statusClass = 'failed'; }

                    const sizeText = exp.fileSize ? (exp.fileSize / 1024).toFixed(1) + ' KB' : '—';
                    const dateText = exp.createdAt ? new Date(exp.createdAt).toLocaleDateString('en-US', {
                        month: 'short', day: 'numeric', year: 'numeric'
                    }) : '—';

                    // Progress bar for processing
                    let progressHtml = '';
                    if (isProcessing && exp.progress !== undefined) {
                        progressHtml = `
                            <div class="progress-bar" style="width:60px;">
                                <div class="fill" style="width:${Math.min(exp.progress || 0, 100)}%"></div>
                            </div>
                        `;
                    }

                    const formatLabel = exp.format ? exp.format.toUpperCase() : 'JSON';

                    return `
                        <div class="export-item" style="animation-delay: ${index * 50}ms">
                            <div class="info">
                                <div class="name">
                                    📄 ${escapeHtml(exp.fileName || exp.exportId)}
                                    <span class="status-badge ${statusClass}">${statusText}</span>
                                    <span style="font-size:10px;color:var(--t3);font-family:var(--mono);">
                                        ${formatLabel}
                                    </span>
                                </div>
                                <div class="meta">
                                    <span>${dateText}</span>
                                    <span class="size">${sizeText}</span>
                                    ${progressHtml}
                                    ${exp.expiresAt && !isExpired ? `<span style="font-size:10px;color:var(--t3);">Expires: ${new Date(exp.expiresAt).toLocaleDateString('en-US', { month:'short', day:'numeric' })}</span>` : ''}
                                </div>
                            </div>
                            <div class="actions">
                                ${isReady ? `<a href="${BACKEND}${exp.downloadUrl}" class="action-btn download" onclick="event.stopPropagation();">⬇ Download</a>` : ''}
                                ${!isReady && !isExpired && !isFailed ? `<span style="font-size:10px;color:var(--t3);font-family:var(--mono);">${isProcessing ? '⏳' : '⏳'}</span>` : ''}
                                <button class="action-btn delete" onclick="deleteExport('${exp.exportId}')" ${isProcessing ? 'disabled' : ''}>🗑</button>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Load exports error:', error);
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <div class="text">Could not load exports</div>
                        <div class="hint">${escapeHtml(error.message)}</div>
                    </div>
                `;
            }
        }

        // ──────────────────────────────────────────────────────────────
        //  DELETE EXPORT
        // ──────────────────────────────────────────────────────────────
        async function deleteExport(exportId) {
            if (!confirm('Are you sure you want to delete this export?')) return;

            try {
                const res = await fetch(`${BACKEND}/api/data/export/${exportId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await res.json();

                if (res.ok) {
                    showToast('✅ Export deleted', 'success');
                    await loadExports();
                } else {
                    showToast(`❌ ${data.error || 'Failed to delete'}`, 'error');
                }
            } catch (error) {
                console.error('Delete error:', error);
                showToast('❌ Network error', 'error');
            }
        }

        // ──────────────────────────────────────────────────────────────
        //  AUTO-REFRESH
        // ──────────────────────────────────────────────────────────────
        function startAutoRefresh() {
            // Clear any existing interval
            if (refreshInterval) clearInterval(refreshInterval);
            
            // Refresh every 10 seconds if there are processing exports
            refreshInterval = setInterval(async () => {
                const items = document.querySelectorAll('.export-item');
                const hasProcessing = Array.from(items).some(item => 
                    item.textContent.includes('Processing')
                );
                if (hasProcessing) {
                    await loadExports();
                }
            }, 10000);
        }

        // ──────────────────────────────────────────────────────────────
        //  INIT
        // ──────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async function() {
            await loadExports();
            startAutoRefresh();

            // Also refresh on visibility change (user comes back to tab)
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    loadExports();
                }
            });
        });
    </script>
</body>
              </html>
