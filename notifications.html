<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyline AA-1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ─── TOP LEFT LOGO ─── */
        .brand {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            z-index: 10;
        }

        .brand-mark {
            width: 24px;
            height: 24px;
            border-radius: 5px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-mark svg {
            width: 14px;
            height: 14px;
            stroke: #0a0a0a;
            stroke-width: 2.5;
            fill: none;
        }

        .brand-name {
            font-size: 11px;
            font-weight: 500;
            color: #f5f5f5;
            letter-spacing: 0.04em;
            line-height: 1;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .brand-name span {
            color: #ffffff;
            font-weight: 400;
        }

        .brand-sub {
            font-size: 7px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #707070;
            font-weight: 400;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        /* ─── SEARCH BAR ─── */
        .search-container {
            padding: 68px 16px 12px 16px;
            background: #0a0a0a;
            flex-shrink: 0;
        }

        .search-wrap {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        .search-icon svg {
            width: 16px;
            height: 16px;
            stroke: #505050;
            fill: none;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: #141414;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #f5f5f5;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .search-input::placeholder {
            color: #505050;
        }

        .search-input:focus {
            border-color: rgba(255,255,255,0.15);
            background: #1a1a1a;
        }

        /* ─── LOADING SCREEN ─── */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.06);
            border-top-color: #ffffff;
            animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 11px;
            color: #707070;
            letter-spacing: 0.12em;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            animation: pulse-text 1.4s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ─── CONTACT LIST ─── */
        .contact-list {
            flex: 1;
            overflow-y: auto;
            display: none;
        }

        .contact-list.active {
            display: block;
        }

        .contact-item {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contact-item:hover {
            background: rgba(255,255,255,0.03);
        }

        .contact-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            text-transform: uppercase;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-size: 13px;
            font-weight: 500;
            color: #f5f5f5;
            margin-bottom: 2px;
        }

        .contact-preview {
            font-size: 11px;
            color: #707070;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-time {
            font-size: 10px;
            color: #505050;
            flex-shrink: 0;
        }

        /* ─── EMPTY STATE ─── */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 20px;
            color: #505050;
            text-align: center;
        }

        .empty-state.active {
            display: flex;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: #505050;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 14px;
            font-weight: 500;
            color: #707070;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 12px;
            color: #505050;
        }
    </style>
</head>
<body>

    <!-- ─── TOP LEFT LOGO ─── -->
    <div class="brand">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
        </div>
        <span class="brand-name">Sky<span>line</span></span>
        <span class="brand-sub">AA-1</span>
    </div>

    <!-- ─── LOADING SCREEN ─── -->
    <div class="loading-container" id="loadingScreen">
        <div class="spinner"></div>
        <div class="loading-text">Loading conversations...</div>
    </div>

    <!-- ─── SEARCH BAR ─── -->
    <div class="search-container">
        <div class="search-wrap">
            <div class="search-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </div>
            <input class="search-input" type="text" placeholder="Search conversations..." id="searchInput" />
        </div>
    </div>

    <!-- ─── CONTACT LIST ─── -->
    <div class="contact-list" id="contactList">
        <!-- Contacts will be rendered here -->
    </div>

    <!-- ─── EMPTY STATE ─── -->
    <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <h3>No conversations yet</h3>
        <p>Send your first message to get started.</p>
    </div>

    <script>
        // ─── CONFIG ───
        const BACKEND = 'https://skylineapp-backend-file.onrender.com';
        const token = localStorage.getItem('token');

        // ─── DOM ELEMENTS ───
        const loadingScreen = document.getElementById('loadingScreen');
        const contactList = document.getElementById('contactList');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');

        // ─── STATE ───
        let allContacts = [];

        // ─── CHECK AUTH ───
        if (!token) {
            window.location.href = 'login.html';
        }

        // ─── LOAD CONTACTS ───
        async function loadContacts() {
            try {
                const res = await fetch(`${BACKEND}/api/conversations`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        localStorage.removeItem('token');
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error(`HTTP ${res.status}`);
                }

                allContacts = await res.json();
                renderContacts(allContacts);

            } catch (err) {
                console.error('❌ Failed to load contacts:', err);
                showEmptyState();
            } finally {
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 1500);
            }
        }

        // ─── RENDER CONTACTS ───
        function renderContacts(contacts) {
            if (!contacts || contacts.length === 0) {
                showEmptyState();
                return;
            }

            contactList.classList.add('active');
            emptyState.classList.remove('active');

            contactList.innerHTML = contacts.map(c => {
                const initials = (c.name || '?').charAt(0).toUpperCase();
                const preview = c.lastMessage || 'No messages yet';
                const time = c.lastDate ? new Date(c.lastDate).toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                }) : '';

                return `
                    <div class="contact-item" data-id="${c.id}">
                        <div class="contact-avatar">${initials}</div>
                        <div class="contact-info">
                            <div class="contact-name">${escapeHtml(c.name || 'Unknown')}</div>
                            <div class="contact-preview">${escapeHtml(preview)}</div>
                        </div>
                        ${time ? `<div class="contact-time">${time}</div>` : ''}
                    </div>
                `;
            }).join('');

            // Click handler
            document.querySelectorAll('.contact-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const name = el.querySelector('.contact-name')?.textContent || 'Unknown';
                    console.log(`📬 Opening chat with ${name} (${id})`);
                    // We'll add chat view later
                });
            });
        }

        // ─── SEARCH / FILTER ───
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (!query) {
                renderContacts(allContacts);
                return;
            }
            const filtered = allContacts.filter(c =>
                (c.name || '').toLowerCase().includes(query) ||
                (c.company || '').toLowerCase().includes(query) ||
                (c.email || '').toLowerCase().includes(query)
            );
            renderContacts(filtered);
        });

        // ─── EMPTY STATE ───
        function showEmptyState() {
            contactList.classList.remove('active');
            emptyState.classList.add('active');
        }

        // ─── UTILITY ───
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ─── START ───
        loadContacts();
    </script>

</body>
    </html>
