<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications | Skyline AA-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #060608;
      --bg-base: #0b0c0f;
      --bg-surface: #111318;
      --bg-raised: #181b22;
      --border: rgba(255,255,255,0.06);
      --accent: #c8ff57;
      --accent-go: #00d2ff;
      --text-1: #e8eaf0;
      --text-2: #8c909e;
      --text-3: #52566a;
      --danger: #ff4d4d;
      --success: #00e676;
      --warning: #ffaa00;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-void);
      color: var(--text-1);
      font-family: var(--font-sans);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Topbar ── */
    .topbar {
      height: 58px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 14px;
      flex-shrink: 0;
      position: relative;
    }
    .back-btn {
      width: 36px; height: 36px;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      text-decoration: none;
    }
    .back-btn:hover {
      border-color: var(--accent);
      background: rgba(200,255,87,0.06);
    }
    .back-btn svg {
      width: 16px; height: 16px;
      stroke: var(--text-2);
      transition: stroke 0.2s;
    }
    .back-btn:hover svg { stroke: var(--accent); }

    .topbar-title {
      flex: 1;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.3px;
    }
    .mark-all-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }
    .mark-all-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Filter Tabs ── */
    .filter-strip {
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      gap: 0;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-strip::-webkit-scrollbar { display: none; }
    .filter-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      padding: 12px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .filter-tab:hover:not(.active) { color: var(--text-2); }
    .filter-count {
      background: rgba(200,255,87,0.12);
      color: var(--accent);
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      min-width: 16px;
      text-align: center;
    }
    .filter-tab:not(.active) .filter-count {
      background: rgba(255,255,255,0.05);
      color: var(--text-3);
    }

    /* ── Notification Feed ── */
    .feed {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
    }
    .feed::-webkit-scrollbar { width: 4px; }
    .feed::-webkit-scrollbar-track { background: transparent; }
    .feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Date Separator ── */
    .date-sep {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 8px;
    }
    .date-sep-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .date-sep-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text-3);
      text-transform: uppercase;
    }

    /* ── Notification Card ── */
    .notif-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
      animation: slideIn 0.3s ease both;
    }
    .notif-card:hover { background: rgba(255,255,255,0.02); }
    .notif-card.unread { background: rgba(200,255,87,0.025); }
    .notif-card.unread::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Avatar ── */
    .avatar {
      width: 44px; height: 44px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      position: relative;
    }
    .avatar.reply    { background: rgba(200,255,87,0.1);  border: 1px solid rgba(200,255,87,0.2); }
    .avatar.system   { background: rgba(0,210,255,0.1);   border: 1px solid rgba(0,210,255,0.15); }
    .avatar.payment  { background: rgba(0,230,118,0.1);   border: 1px solid rgba(0,230,118,0.2); }
    .avatar.warning  { background: rgba(255,170,0,0.1);   border: 1px solid rgba(255,170,0,0.2); }
    .avatar.danger   { background: rgba(255,77,77,0.1);   border: 1px solid rgba(255,77,77,0.15); }

    /* Avatar SVG icon */
    .avatar svg {
      width: 20px; height: 20px;
    }
    .avatar.reply svg   { stroke: var(--accent); }
    .avatar.system svg  { stroke: var(--accent-go); }
    .avatar.payment svg { stroke: var(--success); }
    .avatar.warning svg { stroke: var(--warning); }
    .avatar.danger svg  { stroke: var(--danger); }

    /* Unread dot on avatar */
    .avatar-dot {
      position: absolute;
      top: -3px; right: -3px;
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 50%;
      border: 2px solid var(--bg-void);
      display: none;
    }
    .unread .avatar-dot { display: block; }

    /* ── Notif Body ── */
    .notif-body { flex: 1; min-width: 0; }
    .notif-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .notif-sender {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .notif-time {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-3);
      flex-shrink: 0;
    }
    .notif-text {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .notif-card.unread .notif-sender { color: var(--text-1); }
    .notif-card.unread .notif-text { color: var(--text-2); }

    /* ── Type tag ── */
    .notif-tag {
      display: inline-block;
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .tag-reply   { background: rgba(200,255,87,0.1);  color: var(--accent); }
    .tag-system  { background: rgba(0,210,255,0.1);   color: var(--accent-go); }
    .tag-payment { background: rgba(0,230,118,0.1);   color: var(--success); }
    .tag-warning { background: rgba(255,170,0,0.1);   color: var(--warning); }
    .tag-danger  { background: rgba(255,77,77,0.1);   color: var(--danger); }

    /* ── Swipe action hint (visual only) ── */
    .notif-chevron {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .notif-card:hover .notif-chevron { opacity: 1; }
    .notif-chevron svg {
      width: 14px; height: 14px;
      stroke: var(--text-3);
    }

    /* ── Empty State ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      padding: 40px 20px;
    }
    .empty-icon {
      width: 64px; height: 64px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .empty-icon svg { width: 28px; height: 28px; stroke: var(--text-3); }
    .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text-2); }
    .empty-state p  { font-size: 13px; color: var(--text-3); text-align: center; line-height: 1.5; }

    /* ── Loading skeleton ── */
    .skeleton-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .skel {
      background: var(--bg-raised);
      border-radius: 6px;
      animation: shimmer 1.4s infinite;
    }
    .skel-avatar { width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0; }
    .skel-lines  { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
    .skel-title  { height: 12px; width: 55%; }
    .skel-body   { height: 10px; width: 85%; }
    .skel-body2  { height: 10px; width: 65%; }
    @keyframes shimmer {
      0%   { opacity: 0.5; }
      50%  { opacity: 1; }
      100% { opacity: 0.5; }
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text-1);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px 20px;
      border-radius: 8px;
      z-index: 9999;
      opacity: 0;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <a href="dashboard.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <span class="topbar-title">Notifications</span>
    <button class="mark-all-btn" onclick="markAllRead()">Mark all read</button>
  </header>

  <!-- Filter Tabs -->
  <nav class="filter-strip">
    <button class="filter-tab active" onclick="setFilter('all', this)">
      All <span class="filter-count" id="countAll">0</span>
    </button>
    <button class="filter-tab" onclick="setFilter('reply', this)">
      Replies <span class="filter-count" id="countReply">0</span>
    </button>
    <button class="filter-tab" onclick="setFilter('system', this)">
      System <span class="filter-count" id="countSystem">0</span>
    </button>
    <button class="filter-tab" onclick="setFilter('payment', this)">
      Payments <span class="filter-count" id="countPayment">0</span>
    </button>
  </nav>

  <!-- Feed -->
  <main class="feed" id="feed">
    <!-- Skeleton loading state -->
    <div id="skeletons">
      ${[1,2,3,4,5].map(() => `
        <div class="skeleton-card">
          <div class="skel skel-avatar"></div>
          <div class="skel-lines">
            <div class="skel skel-title"></div>
            <div class="skel skel-body"></div>
            <div class="skel skel-body2"></div>
          </div>
        </div>
      `).join('')}
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const BACKEND = 'https://skylineapp-backend-file.onrender.com';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    let allNotifications = [];
    let currentFilter = 'all';
    let readSet = new Set(JSON.parse(localStorage.getItem('readNotifs') || '[]'));

    // ── Helpers ──────────────────────────────────────────────────────────────
    function saveRead() {
      localStorage.setItem('readNotifs', JSON.stringify([...readSet]));
    }

    function relativeTime(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const s = Math.floor(diff / 1000);
      if (s < 60) return 'just now';
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      const d = Math.floor(h / 24);
      if (d === 1) return 'yesterday';
      if (d < 7) return `${d}d ago`;
      return new Date(dateStr).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function dateGroup(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const d = Math.floor(diff / 86400000);
      if (d === 0) return 'Today';
      if (d === 1) return 'Yesterday';
      if (d < 7) return 'This Week';
      return 'Earlier';
    }

    function getTypeInfo(type) {
      switch(type) {
        case 'reply':
          return {
            cls: 'reply', tag: 'Reply', tagCls: 'tag-reply',
            icon: `<svg viewBox="0 0 24 24" fill="none"><path d="M3 10h10a8 8 0 0 1 8 8v2M3 10l6 6M3 10l6-6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
          };
        case 'payment':
          return {
            cls: 'payment', tag: 'Payment', tagCls: 'tag-payment',
            icon: `<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2" stroke-width="1.8"/><path d="M2 10h20" stroke-width="1.8"/></svg>`
          };
        case 'warning':
          return {
            cls: 'warning', tag: 'Warning', tagCls: 'tag-warning',
            icon: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
          };
        case 'danger':
          return {
            cls: 'danger', tag: 'Alert', tagCls: 'tag-danger',
            icon: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke-width="1.8"/><path d="M12 8v4M12 16h.01" stroke-width="1.8" stroke-linecap="round"/></svg>`
          };
        default: // system
          return {
            cls: 'system', tag: 'System', tagCls: 'tag-system',
            icon: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke-width="1.8"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14" stroke-width="1.8" stroke-linecap="round"/></svg>`
          };
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(str));
      return d.innerHTML;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function render(notifications) {
      const feed = document.getElementById('feed');
      document.getElementById('skeletons')?.remove();

      const filtered = currentFilter === 'all'
        ? notifications
        : notifications.filter(n => n.type === currentFilter);

      if (filtered.length === 0) {
        feed.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h3>All caught up</h3>
            <p>No notifications in this category yet.<br>New activity will show up here.</p>
          </div>`;
        return;
      }

      // Group by date
      const groups = {};
      filtered.forEach(n => {
        const g = dateGroup(n.date || n.createdAt || new Date());
        if (!groups[g]) groups[g] = [];
        groups[g].push(n);
      });

      const order = ['Today', 'Yesterday', 'This Week', 'Earlier'];
      let html = '';
      order.forEach(label => {
        if (!groups[label]) return;
        html += `<div class="date-sep">
          <div class="date-sep-line"></div>
          <span class="date-sep-label">${label}</span>
          <div class="date-sep-line"></div>
        </div>`;
        groups[label].forEach((n, idx) => {
          const isUnread = !readSet.has(n._id || n.id);
          const info = getTypeInfo(n.type || 'system');
          const delay = idx * 40;
          html += `
            <div class="notif-card ${isUnread ? 'unread' : ''}"
                 style="animation-delay:${delay}ms"
                 onclick="handleNotifClick('${n._id || n.id}', '${n.type || 'system'}', '${escapeHtml(n.leadId || '')}')">
              <div class="avatar ${info.cls}">
                ${info.icon}
                <div class="avatar-dot"></div>
              </div>
              <div class="notif-body">
                <div class="notif-top">
                  <span class="notif-sender">${escapeHtml(n.title || n.senderName || 'Skyline AA-1')}</span>
                  <span class="notif-time">${relativeTime(n.date || n.createdAt || new Date())}</span>
                </div>
                <div class="notif-text">${escapeHtml(n.message || n.body || n.preview || '')}</div>
                <span class="notif-tag ${info.tagCls}">${info.tag}</span>
              </div>
              <div class="notif-chevron">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M9 18l6-6-6-6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>`;
        });
      });

      feed.innerHTML = html;
    }

    function updateCounts(notifications) {
      document.getElementById('countAll').textContent    = notifications.length;
      document.getElementById('countReply').textContent  = notifications.filter(n => n.type === 'reply').length;
      document.getElementById('countSystem').textContent = notifications.filter(n => n.type === 'system' || !n.type).length;
      document.getElementById('countPayment').textContent= notifications.filter(n => n.type === 'payment').length;
    }

    // ── Actions ──────────────────────────────────────────────────────────────
    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      render(allNotifications);
    }

    function handleNotifClick(id, type, leadId) {
      // Mark as read
      readSet.add(id);
      saveRead();

      // Mark read on backend (fire and forget)
      fetch(`${BACKEND}/api/notifications/${id}/read`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      }).catch(() => {});

      // Navigate based on type
      if (type === 'reply' && leadId) {
        window.location.href = `inbox.html?lead=${leadId}`;
      } else if (type === 'payment') {
        window.location.href = 'dashboard.html#subscription';
      } else {
        // Re-render to update read state visually
        render(allNotifications);
        showToast('Marked as read');
      }
    }

    function markAllRead() {
      allNotifications.forEach(n => readSet.add(n._id || n.id));
      saveRead();

      // Tell backend
      fetch(`${BACKEND}/api/notifications/mark-all-read`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      }).catch(() => {});

      // Update dashboard badge
      localStorage.setItem('lastNotifViewTime', new Date().toISOString());

      render(allNotifications);
      showToast('All notifications marked as read');
    }

    // ── Load ─────────────────────────────────────────────────────────────────
    async function loadNotifications() {
      try {
        // Try primary notifications endpoint
        const res = await fetch(`${BACKEND}/api/notifications`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.ok) {
          const data = await res.json();
          // Normalise: backend may return array or { notifications: [] }
          allNotifications = Array.isArray(data) ? data : (data.notifications || []);
        } else {
          // Fallback: build notifications from leads replies
          const leadsRes = await fetch(`${BACKEND}/api/leads`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (leadsRes.ok) {
            const leads = await leadsRes.json();
            allNotifications = [];
            leads.forEach(lead => {
              if (lead.replies && lead.replies.length > 0) {
                lead.replies.forEach(reply => {
                  if (reply.from === 'lead') {
                    allNotifications.push({
                      _id: `${lead._id}-${reply._id || Math.random()}`,
                      type: 'reply',
                      title: lead.name || 'Unknown Lead',
                      message: reply.content || reply.body || 'Sent you a reply',
                      date: reply.date || new Date().toISOString(),
                      leadId: lead._id
                    });
                  }
                });
              }
            });
            // Sort newest first
            allNotifications.sort((a, b) => new Date(b.date) - new Date(a.date));
          }
        }

        updateCounts(allNotifications);
        render(allNotifications);

        // Mark visit time for bell badge reset on dashboard
        localStorage.setItem('lastNotifViewTime', new Date().toISOString());

      } catch (err) {
        console.error('Failed to load notifications:', err);
        document.getElementById('skeletons')?.remove();
        document.getElementById('feed').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke-width="1.8"/>
                <path d="M12 8v4M12 16h.01" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
            <h3>Could not load</h3>
            <p>Check your connection and try again.</p>
          </div>`;
      }
    }

    loadNotifications();
  </script>
</body>
  </html>
