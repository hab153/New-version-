<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Inbox | Skyline AA-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Clash+Display:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-void: #05060a;
      --bg-base: #090b10;
      --bg-surface: #0f1119;
      --bg-raised: #161925;
      --bg-hover: #1c2030;
      --border: rgba(255, 255, 255, 0.05);
      --border-mid: rgba(255, 255, 255, 0.09);
      --accent: #c8ff57;
      --accent-dim: rgba(200, 255, 87, 0.12);
      --accent-go: #00d2ff;
      --accent-go-dim: rgba(0, 210, 255, 0.12);
      --text-1: #eceef5;
      --text-2: #8c909e;
      --text-3: #434659;
      --red: #ff4d6d;
      --amber: #ffb347;
      --green: #2ecc71;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }

    body {
      background: var(--bg-void);
      color: var(--text-1);
      font-family: var(--font-display);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ========= TOP NAV (unchanged, premium) ========= */
    .top-nav {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 56px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
      position: relative;
      z-index: 15;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-logo-mark {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .nav-logo-mark svg { width: 16px; height: 16px; }
    .nav-logo-text {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .nav-logo-text span { color: var(--accent); }

    .nav-divider {
      width: 1px;
      height: 22px;
      background: var(--border-mid);
      flex-shrink: 0;
    }

    .tab-group {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }
    .tab-pill {
      height: 30px;
      padding: 0 14px;
      background: none;
      border: none;
      border-radius: 7px;
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .tab-pill.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
    }
    .tab-pill:hover:not(.active) {
      color: var(--text-2);
      background: var(--bg-raised);
    }
    .tab-badge {
      background: var(--red);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
    }
    .nav-spacer { flex: 1; }
    .nav-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-3);
      flex-shrink: 0;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* main container */
    .main-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* view list (inbox) */
    .view-list {
      position: absolute;
      inset: 0;
      background: var(--bg-void);
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }
    .view-list.hidden { transform: translateX(-100%); pointer-events: none; }

    /* search bar */
    .search-section {
      padding: 12px 16px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-wrap { position: relative; }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      pointer-events: none;
    }
    .search-icon svg { width: 15px; height: 15px; stroke: var(--text-3); }
    .search-input {
      width: 100%;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px 9px 36px;
      color: var(--text-1);
      font-family: var(--font-display);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-input:focus {
      border-color: rgba(200, 255, 87, 0.3);
      background: var(--bg-hover);
    }

    /* stats row */
    .stats-row {
      display: flex;
      padding: 10px 16px;
      gap: 8px;
      background: var(--bg-void);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .stat-chip {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-chip-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stat-chip-val {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1;
    }
    .stat-chip-val.green { color: var(--green); }
    .stat-chip-val.amber { color: var(--amber); }
    .stat-chip-val.red   { color: var(--red); }
    .stat-chip-val.accent { color: var(--accent); }

    /* contact list with padding for fixed nav */
    .contact-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: 70px;  /* ensures content is not hidden behind fixed bottom nav */
    }
    .contact-list::-webkit-scrollbar { display: none; }

    .contact-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }
    .contact-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: transparent;
      transition: background 0.2s;
      border-radius: 0 2px 2px 0;
    }
    .contact-item.unread::before { background: var(--accent); }
    .contact-item:hover { background: var(--bg-surface); }
    .contact-item:active { background: var(--bg-raised); }

    .contact-avatar {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--bg-raised);
      border: 1px solid var(--border-mid);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      font-family: var(--font-display);
      text-transform: uppercase;
    }
    .contact-body { flex: 1; min-width: 0; }
    .contact-row1 {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .contact-name {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }
    .contact-item.unread .contact-name { color: var(--text-1); }
    .contact-time {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-3);
    }
    .contact-preview {
      font-size: 12px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .contact-item.unread .contact-preview { color: var(--text-2); }
    .contact-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .unread-badge {
      background: var(--accent);
      color: #000;
      font-size: 9px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      font-family: var(--font-mono);
    }
    .conf-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .conf-badge.high { background: rgba(46,204,113,0.12); color: var(--green); border: 1px solid rgba(46,204,113,0.25); }
    .conf-badge.med  { background: rgba(255,179,71,0.12); color: var(--amber); border: 1px solid rgba(255,179,71,0.25); }
    .conf-badge.low  { background: rgba(255,77,109,0.12); color: var(--red);   border: 1px solid rgba(255,77,109,0.25); }
    .company-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-3);
      background: var(--bg-raised);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT VIEW */
    .view-chat {
      position: absolute; inset: 0;
      background: var(--bg-void);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      z-index: 20;
    }
    .view-chat.active { transform: translateX(0); }

    .chat-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-base);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      min-height: 60px;
    }
    .back-btn {
      width: 36px; height: 36px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    }
    .back-btn svg { width: 15px; height: 15px; stroke: var(--text-2); }
    .back-btn:hover { border-color: rgba(200,255,87,0.35); background: var(--accent-dim); }
    .chat-avatar-wrap { position: relative; flex-shrink: 0; }
    .chat-avatar {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--bg-raised);
      border: 1px solid rgba(200,255,87,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--accent);
      text-transform: uppercase;
    }
    .chat-online-dot {
      position: absolute; bottom: -2px; right: -2px;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--green);
      border: 2px solid var(--bg-base);
    }
    .chat-info { flex: 1; min-width: 0; }
    .chat-info h3 {
      font-size: 14px; font-weight: 700; color: var(--text-1);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 8px; margin: 0;
    }
    .chat-info p { font-size: 10.5px; color: var(--text-3); font-family: var(--font-mono); margin: 2px 0 0; }

    .ai-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      cursor: pointer;
      transition: all 0.25s;
      flex-shrink: 0;
    }
    .ai-toggle.active { background: var(--accent-go-dim); border-color: rgba(0,210,255,0.35); box-shadow: 0 0 16px rgba(0,210,255,0.12); }
    .ai-icon svg { width: 18px; height: 18px; }
    .ai-toggle-text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .ai-toggle.active .ai-toggle-text { color: var(--accent-go); }
    .ai-toggle-indicator {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-3);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .ai-toggle.active .ai-toggle-indicator { background: var(--accent-go); box-shadow: 0 0 6px var(--accent-go); }

    .chat-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
    .icon-btn {
      width: 34px; height: 34px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-3);
    }
    .icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; }
    .edit-details-btn {
      height: 34px;
      padding: 0 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-2);
      letter-spacing: 0.05em;
      transition: all 0.2s;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .edit-details-btn:hover { border-color: var(--accent); color: var(--accent); }
    .messages-container {
      flex: 1; padding: 16px 16px 70px;  /* bottom padding for fixed nav */
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
      scrollbar-width: none;
    }
    .messages-container::-webkit-scrollbar { display: none; }
    .message-bubble {
      max-width: 76%;
      padding: 10px 14px;
      font-size: 13.5px;
      line-height: 1.55;
      border-radius: 14px;
    }
    .message-bubble.lead { background: var(--bg-surface); border: 1px solid var(--border-mid); border-bottom-left-radius: 3px; color: var(--text-1); }
    .message-bubble.ai { background: linear-gradient(135deg, rgba(200,255,87,0.10) 0%, rgba(200,255,87,0.06) 100%); border: 1px solid rgba(200,255,87,0.18); border-bottom-right-radius: 3px; color: var(--text-1); }
    .message-time { font-size: 9px; color: var(--text-3); margin-top: 4px; text-align: right; font-family: var(--font-mono); }

    .reply-input-area {
      padding: 10px 14px 14px;
      background: var(--bg-base);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      margin-bottom: 0;
    }
    .reply-input-area.hidden { display: none; }
    .reply-wrap {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .reply-input-area textarea {
      flex: 1;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text-1);
      padding: 10px 14px;
      border-radius: 12px;
      resize: none;
      height: 42px;
      max-height: 120px;
      font-family: var(--font-display);
      font-size: 13.5px;
      outline: none;
    }
    .send-btn {
      width: 42px; height: 42px;
      background: var(--accent);
      color: #000;
      border: none; border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .send-btn:hover { background: #d4ff6a; transform: scale(1.05); }
    .send-btn svg { width: 17px; height: 17px; stroke: #000; fill: none; }

    .view-admin {
      position: absolute; inset: 0;
      background: var(--bg-void);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .view-admin.active { display: flex; }
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: var(--text-3);
      text-align: center; gap: 10px; padding: 40px 20px;
    }
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
      z-index: 1000;
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-radius: 18px;
      padding: 24px;
      width: 92%;
      max-width: 480px;
    }

    /* ========= BOTTOM NAVIGATION (FIXED, GLASS, DOT INDICATOR) ========= */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(9, 11, 16, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      text-decoration: none;
      transition: all 0.2s ease;
      position: relative;
      cursor: pointer;
      height: 100%;
      gap: 2px;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    /* hover effect: scale + color change */
    .nav-item:hover {
      color: var(--text-1);
    }
    .nav-item:hover svg {
      transform: scale(1.1);
    }

    /* active page styling */
    .nav-item.active {
      color: var(--accent);
    }

    /* glow dot indicator (active) */
    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      transition: all 0.2s ease;
    }

    /* extra helpers */
    .btn-ghost, .btn-primary { font-family: var(--font-mono); }
  </style>
</head>
<body>

  <!-- TOP NAV (unchanged from original) -->
  <div class="top-nav">
    <div class="nav-logo"><div class="nav-logo-mark"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="9" width="2" height="5" rx="0.5" fill="#000"/><rect x="4" y="6" width="2" height="8" rx="0.5" fill="#000"/><rect x="7" y="3" width="2" height="11" rx="0.5" fill="#000"/><rect x="10" y="6" width="2" height="8" rx="0.5" fill="#000"/><rect x="13" y="8" width="2" height="6" rx="0.5" fill="#000"/></svg></div><span class="nav-logo-text">Skyline <span>AA-1</span></span></div>
    <div class="nav-divider"></div>
    <div class="tab-group">
      <button class="tab-pill active" id="tabLeads" onclick="switchTab('leads', this)">Leads <span class="tab-badge" id="leadsTabBadge" style="display:none">0</span></button>
      <button class="tab-pill" id="tabTeam" onclick="switchTab('team', this)">Team</button>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-status"><div class="status-dot"></div>Live</div>
  </div>

  <div class="main-container">
    <div id="viewList" class="view-list">
      <div class="search-section"><div class="search-wrap"><div class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5" stroke-width="1.8"/><path d="M21 21l-4-4" stroke-width="1.8"/></svg></div><input class="search-input" placeholder="Search leads..." oninput="filterContacts(this.value)" /></div></div>
      <div class="stats-row" id="statsRow"><div class="stat-chip"><div class="stat-chip-label">Total</div><div class="stat-chip-val accent" id="statTotal">—</div></div><div class="stat-chip"><div class="stat-chip-label">Unread</div><div class="stat-chip-val red" id="statUnread">—</div></div><div class="stat-chip"><div class="stat-chip-label">High</div><div class="stat-chip-val green" id="statHigh">—</div></div><div class="stat-chip"><div class="stat-chip-label">Med</div><div class="stat-chip-val amber" id="statMed">—</div></div></div>
      <div class="contact-list" id="contactList"><div style="padding:28px; text-align:center;">LOADING CONTACTS…</div></div>
    </div>

    <div id="viewChat" class="view-chat">
      <div class="chat-header"><button class="back-btn" onclick="closeChat()"><svg viewBox="0 0 24 24"><path d="M19 12H5M5 12l7 7M5 12l7-7" stroke-width="1.8"/></svg></button><div class="chat-avatar-wrap"><div class="chat-avatar" id="chatAvatar">?</div><div class="chat-online-dot"></div></div><div class="chat-info"><h3 id="chatName">Customer</h3><p id="chatEmail">email@example.com</p></div><button class="ai-toggle" id="aiToggle" onclick="toggleAutoReply()"><div class="ai-icon"><svg viewBox="0 0 20 20"><rect x="4" y="5" width="12" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 5V2.5" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="2" r="1" fill="currentColor"/><rect x="6.5" y="8" width="2.2" height="2" rx="0.6" fill="currentColor"/><rect x="11.3" y="8" width="2.2" height="2" rx="0.6" fill="currentColor"/><path d="M7 12h6" stroke="currentColor" stroke-width="1.2"/><path d="M7 14v1.5a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1V14" stroke="currentColor" stroke-width="1.5"/><path d="M4 8.5H2.5a.5.5 0 0 0-.5.5v2a.5.5 0 0 0 .5.5H4" stroke="currentColor" stroke-width="1.3"/><path d="M16 8.5h1.5a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5H16" stroke="currentColor" stroke-width="1.3"/></svg></div><span class="ai-toggle-text">AI Reply</span><div class="ai-toggle-indicator"></div></button><div class="chat-actions"><button class="edit-details-btn" id="editDetailsBtn" onclick="openInstructionsModal()"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke-width="1.8"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke-width="1.8"/></svg>Edit</button><button class="icon-btn" onclick="renameCustomer()"><svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" stroke-width="1.8"/></svg></button></div></div>
      <div id="messagesContainer" class="messages-container"><div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke-width="1.8"/></svg></div><h3>No chat open</h3><p>Select a lead to view conversation.</p></div></div>
      <div class="reply-input-area" id="replyInputArea"><div class="reply-wrap"><textarea id="replyText" placeholder="Type a reply…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendReply()}"></textarea><button class="send-btn" onclick="sendReply()"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke-width="1.8"/></svg></button></div></div>
    </div>
    <div id="viewAdmin" class="view-admin"><div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke-width="1.8"/><circle cx="9" cy="7" r="4" stroke-width="1.8"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke-width="1.8"/></svg></div><h3>Skyline AA-1 Team</h3><p>Admin notifications and team<br>messages will appear here.</p></div></div>

  <div class="modal-overlay" id="instructionsModal"><div class="modal-content"><div class="modal-header"><div><h3>AI Auto-Reply Setup</h3><p>AI · AUTO-REPLY INSTRUCTIONS</p></div><button class="modal-close" onclick="closeInstructionsModal()">×</button></div><div class="modal-field"><label>Instructions for AI</label><textarea id="instructionsText" placeholder="Be concise, professional, offer discounts if needed."></textarea></div><div class="modal-footer"><button class="btn-ghost" onclick="closeInstructionsModal()">Cancel</button><button class="btn-primary" onclick="saveAutoReplyInstructions()">Activate AI Reply</button></div></div></div>

  <script>
    const BACKEND = 'https://skylineapp-backend-file.onrender.com';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = "login.html";
    let currentLeadId = null, currentLeadName = "", currentLeadEmail = "", allContacts = [], isAutoReplyEnabled = false, autoReplyInstructions = "";

    document.addEventListener('DOMContentLoaded', async () => { try { await fetch(`${BACKEND}/api/notifications/count`,{headers:{'Authorization':`Bearer ${token}`}}); } catch(e){} loadContacts(); });
    function getInitials(n) { return n ? n.trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase() : '?'; }
    function escapeHtml(s) { if(!s) return ''; const d=document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }
    function switchTab(tab,btn){ document.querySelectorAll('.tab-pill').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); if(tab==='leads'){ document.getElementById('viewList').classList.remove('hidden'); document.getElementById('viewAdmin').classList.remove('active'); closeChat(); } else { document.getElementById('viewList').classList.add('hidden'); document.getElementById('viewAdmin').classList.add('active'); closeChat(); } }
    async function loadContacts(){ try{ const res=await fetch(`${BACKEND}/api/conversations`,{headers:{'Authorization':`Bearer ${token}`}}); allContacts=await res.json(); updateStats(allContacts); renderContacts(allContacts); } catch(e){ document.getElementById('contactList').innerHTML='<div style="padding:28px;text-align:center;">FAILED TO LOAD</div>'; } }
    function updateStats(contacts){ const total=contacts.length, unread=contacts.filter(c=>(c.unreadCount||0)>0).length, high=contacts.filter(c=>c.confidenceTier==='High').length, med=contacts.filter(c=>c.confidenceTier==='Medium').length; document.getElementById('statTotal').innerText=total; document.getElementById('statUnread').innerText=unread; document.getElementById('statHigh').innerText=high; document.getElementById('statMed').innerText=med; const badge=document.getElementById('leadsTabBadge'); if(unread>0){ badge.innerText=unread>99?'99+':unread; badge.style.display='flex'; } else badge.style.display='none'; }
    function renderContacts(contacts){ const list=document.getElementById('contactList'); if(!contacts.length){ list.innerHTML='<div style="padding:36px 20px;text-align:center;">NO CONVERSATIONS</div>'; return; } const sorted=[...contacts].sort((a,b)=>{ const aU=(a.unreadCount||0)>0, bU=(b.unreadCount||0)>0; if(aU&&!bU) return -1; if(!aU&&bU) return 1; return new Date(b.lastDate||0)-new Date(a.lastDate||0); }); list.innerHTML=sorted.map(c=>{ const unread=c.unreadCount||0, confClass=c.confidenceTier==='High'?'high':c.confidenceTier==='Medium'?'med':'low', confLabel=c.confidenceTier||'Low'; return `<div class="contact-item ${unread>0?'unread':''}" onclick="openChat('${c.id}','${escapeHtml(c.name)}','${escapeHtml(c.email)}')"><div class="contact-avatar">${getInitials(c.name)}</div><div class="contact-body"><div class="contact-row1"><span class="contact-name">${escapeHtml(c.name)}</span><span class="contact-time">${c.lastDate?new Date(c.lastDate).toLocaleDateString(undefined,{month:'short',day:'numeric'}):''}</span></div><div class="contact-row2"><span class="contact-preview">${escapeHtml(c.lastMessage||'')}</span><div class="contact-meta">${unread>0?`<span class="unread-badge">${unread>99?'99+':unread}</span>`:''}<span class="conf-badge ${confClass}">${confLabel}</span>${c.company?`<span class="company-tag">${escapeHtml(c.company)}</span>`:''}</div></div></div></div>`; }).join(''); }
    function filterContacts(q){ if(!q.trim()) return renderContacts(allContacts); const query=q.toLowerCase(); renderContacts(allContacts.filter(c=>(c.name||'').toLowerCase().includes(query)||(c.company||'').toLowerCase().includes(query)||(c.email||'').toLowerCase().includes(query))); }
    async function openChat(id,name,email){ currentLeadId=id; currentLeadName=name; currentLeadEmail=email; const leadData=allContacts.find(l=>l.id===id); let badgeHtml=''; if(leadData){ const cls=leadData.confidenceTier==='High'?'high':leadData.confidenceTier==='Medium'?'med':'low'; badgeHtml=`<span class="conf-badge ${cls}" style="margin-left:8px;">${leadData.confidenceTier}</span>`; } document.getElementById('chatName').innerHTML=`${escapeHtml(name)} ${badgeHtml}`; document.getElementById('chatEmail').innerText=email; document.getElementById('chatAvatar').innerText=getInitials(name); document.getElementById('replyText').value=''; document.getElementById('viewChat').classList.add('active'); const contact=allContacts.find(c=>c.id===id); if(contact&&contact.unreadCount>0){ contact.unreadCount=0; updateStats(allContacts); renderContacts(allContacts); fetch(`${BACKEND}/api/conversations/${id}/read`,{method:'POST',headers:{'Authorization':`Bearer ${token}`}}).catch(()=>{}); } const container=document.getElementById('messagesContainer'); container.innerHTML='<div style="text-align:center;padding:24px;">LOADING MESSAGES…</div>'; try{ const res=await fetch(`${BACKEND}/api/conversations/${id}`,{headers:{'Authorization':`Bearer ${token}`}}); const data=await res.json(); isAutoReplyEnabled=data.lead.autoReplyEnabled||false; autoReplyInstructions=data.lead.autoReplyInstructions||""; updateAutoReplyUI(); if(!data.messages||!data.messages.length){ container.innerHTML=`<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke-width="1.8"/></svg></div><h3>No messages yet</h3><p>Send first message.</p></div>`; return; } container.innerHTML=data.messages.map(msg=>`<div class="msg-group ${msg.from==='lead'?'from-lead':'from-ai'}"><div class="message-bubble ${msg.from==='lead'?'lead':'ai'}">${escapeHtml(msg.content)}<div class="message-time">${new Date(msg.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join(''); container.scrollTop=container.scrollHeight; } catch(e){ container.innerHTML='<div style="text-align:center;padding:20px;">Error loading messages.</div>'; } }
    function closeChat(){ document.getElementById('viewChat').classList.remove('active'); currentLeadId=null; }
    function toggleAutoReply(){ if(isAutoReplyEnabled){ isAutoReplyEnabled=false; saveAutoReplyStatus(); } else openInstructionsModal(); }
    function openInstructionsModal(){ document.getElementById('instructionsText').value=autoReplyInstructions; document.getElementById('instructionsModal').classList.add('active'); }
    function closeInstructionsModal(){ document.getElementById('instructionsModal').classList.remove('active'); updateAutoReplyUI(); }
    async function saveAutoReplyInstructions(){ const instructions=document.getElementById('instructionsText').value.trim(); if(!instructions){ alert("Please enter AI instructions."); return; } try{ const res=await fetch(`${BACKEND}/api/leads/${currentLeadId}/auto-reply`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({enabled:true,instructions})}); if(res.ok){ isAutoReplyEnabled=true; autoReplyInstructions=instructions; closeInstructionsModal(); updateAutoReplyUI(); } else alert("Failed to save."); } catch(e){ alert("Connection error."); } }
    async function saveAutoReplyStatus(){ try{ await fetch(`${BACKEND}/api/leads/${currentLeadId}/auto-reply`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({enabled:isAutoReplyEnabled})}); updateAutoReplyUI(); } catch(e){} }
    function updateAutoReplyUI(){ const toggle=document.getElementById('aiToggle'), editBtn=document.getElementById('editDetailsBtn'), inputArea=document.getElementById('replyInputArea'); if(isAutoReplyEnabled){ toggle.classList.add('active'); editBtn.style.display='flex'; inputArea.classList.add('hidden'); } else { toggle.classList.remove('active'); editBtn.style.display='none'; inputArea.classList.remove('hidden'); } }
    async function sendReply(){ const text=document.getElementById('replyText').value.trim(); if(!text||!currentLeadId) return; const btn=document.getElementById('sendBtn'); btn.disabled=true; const payload={ leads:[{ name:currentLeadName, email:currentLeadEmail, company:'', messages:[{ subject:"Re: Conversation", body:text }] }] }; try{ const res=await fetch(`${BACKEND}/api/leads/batch-send`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify(payload)}); const data=await res.json(); if(res.status===401||data.error==='NYLAS_DISCONNECTED'){ localStorage.setItem('pendingEmailPayload',JSON.stringify(payload)); alert("Email session expired. Please reconnect."); window.location.href='dashboard.html?connect=true'; return; } if(data.success){ document.getElementById('replyText').value=''; openChat(currentLeadId,currentLeadName,currentLeadEmail); } else alert("Failed to send."); } catch(err){ localStorage.setItem('pendingEmailPayload',JSON.stringify(payload)); alert("Connection error. Message saved."); window.location.href='dashboard.html?connect=true'; } finally{ btn.disabled=false; } }
    async function renameCustomer(){ const newName=prompt("Enter new name:", currentLeadName); if(newName&&newName!==currentLeadName){ try{ await fetch(`${BACKEND}/api/leads/${currentLeadId}/rename`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({newName})}); currentLeadName=newName; document.getElementById('chatName').innerHTML=newName; document.getElementById('chatAvatar').innerText=getInitials(newName); loadContacts(); } catch(e){ alert("Failed to rename."); } } }
  </script>
