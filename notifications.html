<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyline AA-1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ─── TOP LEFT LOGO ─── */
        .brand {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            z-index: 10;
        }

        .brand-mark {
            width: 24px;
            height: 24px;
            border-radius: 5px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-mark svg {
            width: 14px;
            height: 14px;
            stroke: #0a0a0a;
            stroke-width: 2.5;
            fill: none;
        }

        .brand-name {
            font-size: 11px;
            font-weight: 500;
            color: #f5f5f5;
            letter-spacing: 0.04em;
            line-height: 1;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .brand-name span {
            color: #ffffff;
            font-weight: 400;
        }

        .brand-sub {
            font-size: 7px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #707070;
            font-weight: 400;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        /* ─── TOP RIGHT 3-DOT MENU ─── */
        .menu-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
        }

        .menu-btn {
            width: 32px;
            height: 32px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #b0b0b0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
        }

        .menu-btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.12);
        }

        .menu-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
        }

        /* ─── DROPDOWN ─── */
        .menu-dropdown {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            min-width: 170px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            overflow: hidden;
            z-index: 30;
        }

        .menu-dropdown.show {
            display: block;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: #b0b0b0;
            font-size: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.04);
            color: #f5f5f5;
        }

        .menu-item svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            flex-shrink: 0;
        }

        .menu-divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 4px 12px;
        }

        /* ─── SEARCH BAR ─── */
        .search-container {
            padding: 68px 16px 12px 16px;
            background: #0a0a0a;
            flex-shrink: 0;
        }

        .search-wrap {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        .search-icon svg {
            width: 16px;
            height: 16px;
            stroke: #505050;
            fill: none;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: #141414;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #f5f5f5;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .search-input::placeholder {
            color: #505050;
        }

        .search-input:focus {
            border-color: rgba(255,255,255,0.15);
            background: #1a1a1a;
        }

        /* ─── LOADING SCREEN ─── */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.06);
            border-top-color: #ffffff;
            animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 11px;
            color: #707070;
            letter-spacing: 0.12em;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            animation: pulse-text 1.4s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ─── CONTACT LIST ─── */
        .contact-list {
            flex: 1;
            overflow-y: auto;
            display: none;
        }

        .contact-list.active {
            display: block;
        }

        .contact-item {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contact-item:hover {
            background: rgba(255,255,255,0.03);
        }

        .contact-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            text-transform: uppercase;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-size: 13px;
            font-weight: 500;
            color: #f5f5f5;
            margin-bottom: 2px;
        }

        .contact-preview {
            font-size: 11px;
            color: #707070;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-time {
            font-size: 10px;
            color: #505050;
            flex-shrink: 0;
        }

        /* ─── EMPTY STATE ─── */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 20px;
            color: #505050;
            text-align: center;
        }

        .empty-state.active {
            display: flex;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: #505050;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 14px;
            font-weight: 500;
            color: #707070;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 12px;
            color: #505050;
        }

        /* ─── NO RESULTS ─── */
        .no-results {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #505050;
            text-align: center;
        }

        .no-results.active {
            display: flex;
        }

        .no-results svg {
            width: 36px;
            height: 36px;
            stroke: #505050;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .no-results p {
            font-size: 12px;
            color: #505050;
        }

        /* ─── TOAST NOTIFICATION ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            color: #b0b0b0;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- ─── TOP LEFT LOGO ─── -->
    <div class="brand">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
        </div>
        <span class="brand-name">Sky<span>line</span></span>
        <span class="brand-sub">AA-1</span>
    </div>

    <!-- ─── TOP RIGHT 3-DOT MENU ─── -->
    <div class="menu-container">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="1"/>
                <circle cx="12" cy="5" r="1"/>
                <circle cx="12" cy="19" r="1"/>
            </svg>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
            <button class="menu-item" data-action="followup">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
                Follow-up
            </button>
            <button class="menu-item" data-action="revenue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                Revenue Tracker
            </button>
            <div class="menu-divider"></div>
            <button class="menu-item" data-action="hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
                AI Hint
            </button>
            <button class="menu-item" data-action="autoreply">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="5" width="16" height="14" rx="2"/>
                    <polyline points="8 10 12 14 16 10"/>
                </svg>
                Auto Reply
            </button>
        </div>
    </div>

    <!-- ─── LOADING SCREEN ─── -->
    <div class="loading-container" id="loadingScreen">
        <div class="spinner"></div>
        <div class="loading-text">Loading conversations...</div>
    </div>

    <!-- ─── SEARCH BAR ─── -->
    <div class="search-container">
        <div class="search-wrap">
            <div class="search-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </div>
            <input class="search-input" type="text" placeholder="Search conversations..." id="searchInput" />
        </div>
    </div>

    <!-- ─── CONTACT LIST ─── -->
    <div class="contact-list" id="contactList">
        <!-- Contacts will be rendered here -->
    </div>

    <!-- ─── EMPTY STATE ─── -->
    <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <h3>No conversations yet</h3>
        <p>Send your first message to get started.</p>
    </div>

    <!-- ─── NO RESULTS ─── -->
    <div class="no-results" id="noResults">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
        </svg>
        <p>No contacts found</p>
    </div>

    <!-- ─── TOAST ─── -->
    <div class="toast" id="toast">Please open a chat to access this feature.</div>

    <script>
        // ─── CONFIG ───
        const BACKEND = 'https://skylineapp-backend-file.onrender.com';
        const token = localStorage.getItem('token');

        // ─── DOM ELEMENTS ───
        const loadingScreen = document.getElementById('loadingScreen');
        const contactList = document.getElementById('contactList');
        const emptyState = document.getElementById('emptyState');
        const noResults = document.getElementById('noResults');
        const searchInput = document.getElementById('searchInput');
        const menuBtn = document.getElementById('menuBtn');
        const menuDropdown = document.getElementById('menuDropdown');
        const toast = document.getElementById('toast');

        // ─── STATE ───
        let allContacts = [];
        let toastTimeout = null;

        // ─── CHECK AUTH ───
        if (!token) {
            window.location.href = 'login.html';
        }

        // ─── MENU TOGGLE ───
        menuBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            menuDropdown.classList.toggle('show');
        });

        // ─── CLOSE MENU ON OUTSIDE CLICK ───
        document.addEventListener('click', function() {
            menuDropdown.classList.remove('show');
        });

        // ─── MENU ITEM CLICK ───
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                menuDropdown.classList.remove('show');
                showToast('Please open a chat to access this feature.');
            });
        });

        // ─── TOAST ───
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ─── LOAD CONTACTS ───
        async function loadContacts() {
            try {
                const res = await fetch(`${BACKEND}/api/conversations`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        localStorage.removeItem('token');
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error(`HTTP ${res.status}`);
                }

                allContacts = await res.json();
                renderContacts(allContacts);

            } catch (err) {
                console.error('❌ Failed to load contacts:', err);
                showEmptyState();
            } finally {
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 1500);
            }
        }

        // ─── RENDER CONTACTS ───
        function renderContacts(contacts) {
            if (!contacts || contacts.length === 0) {
                if (searchInput.value.trim() !== '') {
                    contactList.classList.remove('active');
                    emptyState.classList.remove('active');
                    noResults.classList.add('active');
                } else {
                    showEmptyState();
                }
                return;
            }

            contactList.classList.add('active');
            emptyState.classList.remove('active');
            noResults.classList.remove('active');

            contactList.innerHTML = contacts.map(c => {
                const initials = (c.name || '?').charAt(0).toUpperCase();
                const preview = c.lastMessage || 'No messages yet';
                const time = c.lastDate ? new Date(c.lastDate).toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                }) : '';

                return `
                    <div class="contact-item" data-id="${c.id}">
                        <div class="contact-avatar">${initials}</div>
                        <div class="contact-info">
                            <div class="contact-name">${escapeHtml(c.name || 'Unknown')}</div>
                            <div class="contact-preview">${escapeHtml(preview)}</div>
                        </div>
                        ${time ? `<div class="contact-time">${time}</div>` : ''}
                    </div>
                `;
            }).join('');

            // Click handler
            document.querySelectorAll('.contact-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const name = el.querySelector('.contact-name')?.textContent || 'Unknown';
                    console.log(`📬 Opening chat with ${name} (${id})`);
                    // We'll add chat view later
                });
            });
        }

        // ─── SEARCH / FILTER ───
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();

            if (!query) {
                renderContacts(allContacts);
                return;
            }

            const filtered = allContacts.filter(c =>
                (c.name || '').toLowerCase().includes(query) ||
                (c.company || '').toLowerCase().includes(query) ||
                (c.email || '').toLowerCase().includes(query)
            );

            renderContacts(filtered);
        });

        // ─── EMPTY STATE ───
        function showEmptyState() {
            contactList.classList.remove('active');
            emptyState.classList.add('active');
            noResults.classList.remove('active');
        }

        // ─── UTILITY ───
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ─── START ───
        loadContacts();
    </script>

</body>
            </html>
