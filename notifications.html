<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyline AA-1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ─── TOP LEFT LOGO ─── */
        .brand {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .brand-mark {
            width: 24px;
            height: 24px;
            border-radius: 5px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-mark svg {
            width: 14px;
            height: 14px;
            stroke: #0a0a0a;
            stroke-width: 2.5;
            fill: none;
        }

        .brand-name {
            font-size: 11px;
            font-weight: 500;
            color: #f5f5f5;
            letter-spacing: 0.04em;
            line-height: 1;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .brand-name span {
            color: #ffffff;
            font-weight: 400;
        }

        .brand-sub {
            font-size: 7px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #707070;
            font-weight: 400;
            font-family: 'Monaco', 'Menlo', monospace;
        }
    </style>
</head>
<body>

    <!-- ─── TOP LEFT LOGO ─── -->
    <div class="brand">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
        </div>
        <span class="brand-name">Sky<span>line</span></span>
        <span class="brand-sub">AA-1</span>
    </div>

</body>
</html>
