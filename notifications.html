<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox | Skyline AA-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #060608;
      --bg-base: #0b0c0f;
      --bg-surface: #111318;
      --bg-raised: #181b22;
      --border: rgba(255,255,255,0.06);
      --accent: #c8ff57;
      --accent-go: #00d2ff;
      --text-1: #e8eaf0;
      --text-2: #8c909e;
      --text-3: #52566a;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'Syne', sans-serif;
    }
    body {
      background: var(--bg-void);
      color: var(--text-1);
      font-family: var(--font-sans);
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation */
    .top-nav {
      height: 58px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--text-2);      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand .dot {
      width: 6px; height: 6px; background: var(--accent);
      border-radius: 50%; box-shadow: 0 0 8px var(--accent);
    }
    .nav-tabs {
      display: flex;
      gap: 20px;
    }
    .nav-tab {
      background: none;
      border: none;
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .nav-tab.active {
      background: var(--bg-raised);
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .nav-tab:hover:not(.active) {
      color: var(--text-1);
    }

    /* Main Container */
    .main-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* VIEW 1: Lead List (Full Screen) */
    .view-list {
      position: absolute;
      inset: 0;
      background: var(--bg-void);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 10;
    }
    .view-list.hidden {      transform: translateX(-100%);
      pointer-events: none;
    }
    .list-header {
      padding: 20px 24px;
      font-weight: 600;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-base);
    }
    .contact-list {
      flex: 1;
      overflow-y: auto;
    }
    .contact-item {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .contact-item:hover {
      background: var(--bg-surface);
    }
    .contact-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-1);
    }
    .contact-preview {
      font-size: 12px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .contact-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-3);
      font-family: var(--font-mono);
      margin-top: 4px;
    }

    /* VIEW 2: Chat Interface (Full Screen) */
    .view-chat {
      position: absolute;      inset: 0;
      background: var(--bg-void);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 20;
    }
    .view-chat.active {
      transform: translateX(0);
    }
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-base);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .chat-info h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .chat-info p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--text-3);
    }
    .chat-actions {
      margin-left: auto;
      display: flex;
      gap: 10px;
    }
    .action-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;      font-size: 11px;
      font-family: var(--font-mono);
    }
    .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .messages-container {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message-bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
      word-wrap: break-word;
    }
    .message-bubble.lead {
      align-self: flex-start;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }
    .message-bubble.ai {
      align-self: flex-end;
      background: rgba(200, 255, 87, 0.1);
      border: 1px solid rgba(200, 255, 87, 0.2);
      border-bottom-right-radius: 2px;
    }
    .message-time {
      font-size: 9px;
      color: var(--text-3);
      margin-top: 4px;
      text-align: right;
      font-family: var(--font-mono);
    }

    .reply-input-area {
      padding: 20px;
      background: var(--bg-base);
      border-top: 1px solid var(--border);
      display: flex;      gap: 12px;
    }
    .reply-input-area textarea {
      flex: 1;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text-1);
      padding: 12px;
      border-radius: 8px;
      resize: none;
      height: 50px;
      font-family: var(--font-sans);
    }
    .send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .send-btn:hover { background: #d4ff70; }
    .send-btn:disabled { background: var(--text-3); cursor: not-allowed; }

    /* Admin/Team View Placeholder */
    .view-admin {
      position: absolute;
      inset: 0;
      background: var(--bg-void);
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      z-index: 5;
    }
    .view-admin.active {
      display: flex;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-3);
      text-align: center;
    }  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="top-nav">
    <div class="brand"><span class="dot"></span> SKYLINE AA-1</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('leads')">Leads</button>
      <button class="nav-tab" onclick="switchTab('team')">Skyline AA-1 Team</button>
    </div>
    <div style="width: 100px;"></div> <!-- Spacer for balance -->
  </header>

  <div class="main-container">
    
    <!-- VIEW 1: Lead List (Full Screen) -->
    <div id="viewList" class="view-list">
      <div class="list-header">Conversations</div>
      <div class="contact-list" id="contactList">
        <div style="padding:20px; text-align:center; color:var(--text-3);">Loading...</div>
      </div>
    </div>

    <!-- VIEW 2: Chat Interface (Full Screen) -->
    <div id="viewChat" class="view-chat">
      <div class="chat-header">
        <button class="back-btn" onclick="closeChat()">←</button>
        <div class="chat-info">
          <h3 id="chatName">Customer Name</h3>
          <p id="chatEmail">email@example.com</p>
        </div>
        <div class="chat-actions">
          <button class="action-btn" onclick="renameCustomer()">✎ Rename</button>
        </div>
      </div>

      <div id="messagesContainer" class="messages-container">
        <div class="empty-state">
          <h3>Select a conversation</h3>
        </div>
      </div>

      <div class="reply-input-area">
        <textarea id="replyText" placeholder="Type a reply..."></textarea>
        <button class="send-btn" onclick="sendReply()">Send</button>
      </div>
    </div>

    <!-- VIEW 3: Admin/Team (Placeholder) -->    <div id="viewAdmin" class="view-admin">
      <div class="empty-state">
        <h3>Skyline AA-1 Team</h3>
        <p>Admin notifications and team messages will appear here.</p>
      </div>
    </div>

  </div>

  <script>
    const BACKEND = 'https://skylineapp-backend-file.onrender.com';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = "login.html";

    let currentLeadId = null;
    let currentLeadName = "";
    let currentLeadEmail = "";

    // Load Contact List on Startup
    document.addEventListener('DOMContentLoaded', loadContacts);

    function switchTab(tab) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      if (tab === 'leads') {
        document.getElementById('viewList').classList.remove('hidden');
        document.getElementById('viewAdmin').classList.remove('active');
        closeChat(); // Ensure chat is closed when switching tabs
      } else {
        document.getElementById('viewList').classList.add('hidden');
        document.getElementById('viewAdmin').classList.add('active');
        closeChat();
      }
    }

    async function loadContacts() {
      try {
        const res = await fetch(`${BACKEND}/api/conversations`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const contacts = await res.json();
        
        const list = document.getElementById('contactList');
        if (contacts.length === 0) {
          list.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-3);">No conversations yet.</div>';
          return;
        }

        list.innerHTML = contacts.map(c => `          <div class="contact-item" onclick="openChat('${c.id}', '${escapeHtml(c.name)}', '${escapeHtml(c.email)}')">
            <div class="contact-name">${escapeHtml(c.name)}</div>
            <div class="contact-preview">${escapeHtml(c.lastMessage)}</div>
            <div class="contact-meta">
              <span>${c.company || 'Unknown Company'}</span>
              <span>${new Date(c.lastDate).toLocaleDateString()}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function openChat(leadId, name, email) {
      currentLeadId = leadId;
      currentLeadName = name;
      currentLeadEmail = email;

      // Update UI
      document.getElementById('chatName').innerText = name;
      document.getElementById('chatEmail').innerText = email;
      document.getElementById('replyText').value = '';

      // Show Chat View
      document.getElementById('viewChat').classList.add('active');

      // Fetch Messages
      try {
        const res = await fetch(`${BACKEND}/api/conversations/${leadId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        const container = document.getElementById('messagesContainer');
        container.innerHTML = data.messages.map(msg => `
          <div class="message-bubble ${msg.from === 'lead' ? 'lead' : 'ai'}">
            ${escapeHtml(msg.content)}
            <div class="message-time">${new Date(msg.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
          </div>
        `).join('');
        
        // Scroll to bottom
        container.scrollTop = container.scrollHeight;
      } catch (err) {
        console.error(err);
      }
    }

    function closeChat() {      document.getElementById('viewChat').classList.remove('active');
      currentLeadId = null;
    }

    async function sendReply() {
      const text = document.getElementById('replyText').value.trim();
      if (!text || !currentLeadId) return;

      const btn = document.querySelector('.send-btn');
      btn.disabled = true;
      btn.innerText = "Sending...";

      try {
        const res = await fetch(`${BACKEND}/api/leads/batch-send`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            leads: [{
              name: currentLeadName,
              email: currentLeadEmail,
              company: '',
              messages: [{ subject: "Re: Conversation", body: text }]
            }]
          })
        });
        
        const data = await res.json();
        
        if (res.status === 401 && data.error === 'NYLAS_DISCONNECTED') {
          alert("Your email session has expired. Redirecting to reconnect...");
          window.location.href = 'dashboard.html?connect=true';
          return;
        }

        if (data.success) {
          document.getElementById('replyText').value = '';
          openChat(currentLeadId, currentLeadName, currentLeadEmail); // Refresh chat
        } else {
          alert("Failed to send: " + JSON.stringify(data.errors));
        }
      } catch (err) {
        alert("Connection error");
      } finally {
        btn.disabled = false;
        btn.innerText = "Send";
      }
    }
    async function renameCustomer() {
      const newName = prompt("Enter new name for this customer:", currentLeadName);
      if (newName && newName !== currentLeadName) {
        try {
          await fetch(`${BACKEND}/api/leads/${currentLeadId}/rename`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ newName })
          });
          
          // Update UI locally
          currentLeadName = newName;
          document.getElementById('chatName').innerText = newName;
          loadContacts(); // Refresh sidebar
        } catch (err) {
          alert("Failed to rename");
        }
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }
  </script>
</body>
            </html>
