<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox | Skyline AA-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        /* ────────────────────────────────────────────────
           RESET & VARIABLES
           ──────────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-void: #0a0a0a;
            --bg-base: #111318;
            --bg-surface: #181b22;
            --bg-raised: #1e2229;
            --bg-hover: #262b34;
            --border: rgba(255, 255, 255, 0.06);
            --border-mid: rgba(255, 255, 255, 0.12);
            --accent: #c8ff57;
            --accent-dim: rgba(200, 255, 87, 0.08);
            --green: #00e676;
            --red: #ff4d4d;
            --amber: #ffaa00;
            --text-1: #e8eaf0;
            --text-2: #8c909e;
            --text-3: #52566a;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-void);
            color: var(--text-1);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ────────────────────────────────────────────────
           TOP NAV
           ──────────────────────────────────────────────── */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 56px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo-mark {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-logo-mark svg {
            width: 14px;
            height: 14px;
        }

        .nav-logo-text {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-1);
        }

        .nav-logo-text span {
            color: var(--accent);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-3);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ────────────────────────────────────────────────
           MAIN CONTAINER
           ──────────────────────────────────────────────── */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 16px;
            gap: 0;
        }

        /* ────────────────────────────────────────────────
           CONVERSATION LIST
           ──────────────────────────────────────────────── */
        .conversation-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .conversation-list.chat-open {
            max-width: 480px;
            border-right: none;
            border-radius: 16px 0 0 16px;
        }

        .search-section {
            padding: 14px 18px 10px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }

        .search-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
        }

        .search-wrap:focus-within {
            border-color: var(--border-mid);
        }

        .search-wrap svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-3);
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-1);
            padding: 10px 0;
            font-size: 13px;
            outline: none;
            font-family: var(--font-sans);
        }

        .search-input::placeholder {
            color: var(--text-3);
        }

        .stats-row {
            display: flex;
            gap: 6px;
            padding: 8px 18px 12px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .stat-chip {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-chip-label {
            font-family: var(--font-mono);
            font-size: 8px;
            text-transform: uppercase;
            color: var(--text-3);
            letter-spacing: 0.06em;
        }

        .stat-chip-val {
            font-weight: 600;
            font-size: 14px;
        }

        .stat-chip-val.accent { color: var(--accent); }
        .stat-chip-val.green { color: var(--green); }
        .stat-chip-val.red { color: var(--red); }
        .stat-chip-val.amber { color: var(--amber); }

        .contact-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 16px 12px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .contact-list::-webkit-scrollbar {
            width: 4px;
        }

        .contact-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .contact-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            border: 1px solid transparent;
            margin-bottom: 2px;
            transform: translateZ(0);
            will-change: transform;
            user-select: none;
        }

        .contact-item:hover {
            background: var(--bg-surface);
            border-color: var(--border);
        }

        .contact-item:active {
            background: var(--bg-hover);
            transform: scale(0.98);
        }

        .contact-item.unread {
            background: var(--accent-dim);
            border-left: 3px solid var(--accent);
        }

        .contact-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-raised);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-2);
            flex-shrink: 0;
            border: 1px solid var(--border);
            font-family: var(--font-mono);
            transform: translateZ(0);
        }

        .contact-item.unread .contact-avatar {
            border-color: var(--accent);
        }

        .contact-body {
            flex: 1;
            min-width: 0;
        }

        .contact-row1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .contact-row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
        }

        .contact-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-item.unread .contact-name {
            font-weight: 700;
        }

        .contact-preview {
            font-size: 12px;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .contact-item.unread .contact-preview {
            color: var(--text-2);
            font-weight: 500;
        }

        .contact-time {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-3);
            flex-shrink: 0;
        }

        .contact-item.unread .contact-time {
            color: var(--accent);
        }

        .unread-badge {
            background: var(--accent);
            color: #000;
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .unread-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-left: 6px;
            flex-shrink: 0;
        }

        .company-tag {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--text-3);
            background: var(--bg-raised);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3);
        }

        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: var(--text-2);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 13px;
        }

        .skeleton-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 2px;
            animation: pulse-skeleton 1.5s ease-in-out infinite;
        }

        .skeleton-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-raised);
            flex-shrink: 0;
        }

        .skeleton-body {
            flex: 1;
        }

        .skeleton-line {
            height: 10px;
            background: var(--bg-raised);
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .skeleton-line.short {
            width: 60%;
        }

        .skeleton-line.long {
            width: 80%;
        }

        @keyframes pulse-skeleton {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ────────────────────────────────────────────────
           CHAT VIEW
           ──────────────────────────────────────────────── */
        .chat-view {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--bg-void);
            min-width: 0;
            border-left: 1px solid var(--border);
            margin-left: -1px;
            border-radius: 0 16px 16px 0;
        }

        .chat-view.active {
            display: flex;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-3);
            text-align: center;
            padding: 40px;
        }

        .chat-empty .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .chat-empty h3 {
            color: var(--text-2);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .chat-empty p {
            font-size: 13px;
        }

        .chat-header {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg-base);
            border-radius: 0 16px 0 0;
        }

        .chat-header.active {
            display: flex;
        }

        .chat-back {
            display: none;
            background: none;
            border: none;
            color: var(--text-2);
            cursor: pointer;
            padding: 4px;
        }

        .chat-back svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
        }

        .chat-avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-raised);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-2);
            border: 1px solid var(--border);
            flex-shrink: 0;
            font-family: var(--font-mono);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-info h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-1);
        }

        .chat-info p {
            font-size: 11px;
            color: var(--text-3);
            font-family: var(--font-mono);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .msg-group {
            display: flex;
            flex-direction: column;
        }

        .msg-group.from-lead {
            align-items: flex-start;
        }

        .msg-group.from-ai {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message-bubble.lead {
            background: var(--bg-raised);
            color: var(--text-1);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .message-bubble.ai {
            background: var(--accent);
            color: #0a0a0a;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--text-3);
            margin-top: 4px;
            opacity: 0.7;
        }

        .message-bubble.ai .message-time {
            color: rgba(10, 10, 10, 0.6);
        }

        .msg-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-3);
        }

        .msg-empty .icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .reply-area {
            display: none;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-base);
            flex-shrink: 0;
            border-radius: 0 0 16px 0;
        }

        .reply-area.active {
            display: block;
        }

        .reply-wrap {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 8px 8px 14px;
        }

        .reply-wrap:focus-within {
            border-color: var(--border-mid);
        }

        .reply-wrap textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-1);
            font-family: var(--font-sans);
            font-size: 13px;
            outline: none;
            resize: none;
            min-height: 36px;
            max-height: 100px;
            line-height: 1.5;
        }

        .reply-wrap textarea::placeholder {
            color: var(--text-3);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #0a0a0a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
        }

        .spin-icon {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ────────────────────────────────────────────────
           RESPONSIVE
           ──────────────────────────────────────────────── */
        @media (max-width: 640px) {
            .main-container {
                padding: 0;
                background: var(--bg-void);
            }

            .conversation-list {
                max-width: 100%;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .conversation-list.chat-open {
                display: none;
            }

            .chat-view {
                border-radius: 0;
                border-left: none;
                margin-left: 0;
            }

            .chat-view.active {
                display: flex;
                position: fixed;
                inset: 0;
                z-index: 60;
                background: var(--bg-void);
                border-radius: 0;
            }

            .chat-back {
                display: block;
            }

            .chat-header {
                border-radius: 0;
            }

            .reply-area {
                border-radius: 0;
            }

            .bottom-nav {
                display: flex;
            }
        }

        @media (min-width: 641px) {
            .bottom-nav {
                display: none;
            }

            .chat-back {
                display: none !important;
            }
        }

        .bottom-nav {
            display: none;
            height: 56px;
            background: var(--bg-base);
            border-top: 1px solid var(--border);
            align-items: center;
            justify-content: space-around;
            flex-shrink: 0;
            padding: 0 8px;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-3);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 4px 12px;
            border-radius: 8px;
        }

        .bottom-nav .nav-item svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
        }

        .bottom-nav .nav-item:hover {
            color: var(--text-1);
        }

        .bottom-nav .nav-item.active {
            color: var(--accent);
        }

        @media (max-width: 640px) {
            .bottom-nav {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- TOP NAV -->
    <header class="top-nav">
        <div class="nav-logo">
            <div class="nav-logo-mark">
                <svg viewBox="0 0 16 16" fill="none">
                    <rect x="1" y="9" width="2" height="5" rx="0.5" fill="#0a0a0a"/>
                    <rect x="4" y="6" width="2" height="8" rx="0.5" fill="#0a0a0a"/>
                    <rect x="7" y="3" width="2" height="11" rx="0.5" fill="#0a0a0a"/>
                    <rect x="10" y="6" width="2" height="8" rx="0.5" fill="#0a0a0a"/>
                    <rect x="13" y="8" width="2" height="6" rx="0.5" fill="#0a0a0a"/>
                </svg>
            </div>
            <span class="nav-logo-text">Skyline <span>AA-1</span></span>
        </div>
        <div class="nav-status">
            <div class="status-dot"></div>
            <span id="statusText">Live</span>
        </div>
    </header>

    <!-- MAIN -->
    <div class="main-container">

        <!-- CONVERSATION LIST -->
        <div class="conversation-list" id="conversationList">
            <div class="search-section">
                <div class="search-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7.5"/>
                        <path d="M21 21l-4-4"/>
                    </svg>
                    <input class="search-input" type="text" placeholder="Search conversations…" id="searchInput" autocomplete="off" />
                </div>
            </div>

            <div class="stats-row" id="statsRow">
                <div class="stat-chip">
                    <span class="stat-chip-label">Total</span>
                    <span class="stat-chip-val accent" id="statTotal">—</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-chip-label">Unread</span>
                    <span class="stat-chip-val red" id="statUnread">—</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-chip-label">Active</span>
                    <span class="stat-chip-val green" id="statActive">—</span>
                </div>
            </div>

            <div class="contact-list" id="contactList">
                <div id="skeletonLoader">
                    <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line short"></div></div></div>
                    <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line short"></div></div></div>
                    <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line short"></div></div></div>
                    <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line short"></div></div></div>
                    <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line short"></div></div></div>
                </div>
            </div>
        </div>

        <!-- CHAT VIEW -->
        <div class="chat-view" id="chatView">
            <div class="chat-empty" id="chatEmpty">
                <div>
                    <span class="icon">💬</span>
                    <h3>Select a conversation</h3>
                    <p>Choose a lead from the list to start chatting.</p>
                </div>
            </div>

            <div class="chat-header" id="chatHeader">
                <button class="chat-back" id="chatBackBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
                    </svg>
                </button>
                <div class="chat-avatar-small" id="chatAvatar">?</div>
                <div class="chat-info">
                    <h3 id="chatName">Customer Name</h3>
                    <p id="chatEmail">email@example.com</p>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
