<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox | Skyline AA-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        /* ────────────────────────────────────────────────
           RESET & VARIABLES
           ──────────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-void: #0a0a0a;
            --bg-base: #111318;
            --bg-surface: #181b22;
            --bg-raised: #1e2229;
            --bg-hover: #262b34;
            --border: rgba(255, 255, 255, 0.06);
            --border-mid: rgba(255, 255, 255, 0.12);
            --accent: #c8ff57;
            --accent-dim: rgba(200, 255, 87, 0.08);
            --green: #00e676;
            --red: #ff4d4d;
            --amber: #ffaa00;
            --text-1: #e8eaf0;
            --text-2: #8c909e;
            --text-3: #52566a;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-void);
            color: var(--text-1);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ────────────────────────────────────────────────
           TOP NAV
           ──────────────────────────────────────────────── */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 56px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo-mark {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-logo-mark svg {
            width: 14px;
            height: 14px;
        }

        .nav-logo-text {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-1);
        }

        .nav-logo-text span {
            color: var(--accent);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-3);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ────────────────────────────────────────────────
           MAIN CONTAINER
           ──────────────────────────────────────────────── */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 16px;
            gap: 0;
        }

        /* ────────────────────────────────────────────────
           CONVERSATION LIST (WhatsApp style)
           ──────────────────────────────────────────────── */
        .conversation-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .conversation-list.chat-open {
            max-width: 480px;
            border-right: none;
            border-radius: 16px 0 0 16px;
        }

        /* Search */
        .search-section {
            padding: 14px 18px 10px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }

        .search-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
        }

        .search-wrap:focus-within {
            border-color: var(--border-mid);
        }

        .search-wrap svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-3);
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-1);
            padding: 10px 0;
            font-size: 13px;
            outline: none;
            font-family: var(--font-sans);
        }

        .search-input::placeholder {
            color: var(--text-3);
        }

        /* Stats */
        .stats-row {
            display: flex;
            gap: 6px;
            padding: 8px 18px 12px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .stat-chip {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-chip-label {
            font-family: var(--font-mono);
            font-size: 8px;
            text-transform: uppercase;
            color: var(--text-3);
            letter-spacing: 0.06em;
        }

        .stat-chip-val {
            font-weight: 600;
            font-size: 14px;
        }

        .stat-chip-val.accent { color: var(--accent); }
        .stat-chip-val.green { color: var(--green); }
        .stat-chip-val.red { color: var(--red); }
        .stat-chip-val.amber { color: var(--amber); }

        /* Contact List */
        .contact-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 16px 12px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .contact-list::-webkit-scrollbar {
            width: 4px;
        }

        .contact-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .contact-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* Contact Items - Clickable */
        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            border: 1px solid transparent;
            margin-bottom: 2px;
            transform: translateZ(0);
            will-change: transform;
            user-select: none;
        }

        .contact-item:hover {
            background: var(--bg-surface);
            border-color: var(--border);
        }

        .contact-item:active {
            background: var(--bg-hover);
            transform: scale(0.98);
        }

        .contact-item.unread {
            background: var(--accent-dim);
            border-left: 3px solid var(--accent);
        }

        .contact-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-raised);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-2);
            flex-shrink: 0;
            border: 1px solid var(--border);
            font-family: var(--font-mono);
            transform: translateZ(0);
        }

        .contact-item.unread .contact-avatar {
            border-color: var(--accent);
        }

        .contact-body {
            flex: 1;
            min-width: 0;
        }

        .contact-row1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .contact-row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
        }

        .contact-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-item.unread .contact-name {
            font-weight: 700;
        }

        .contact-preview {
            font-size: 12px;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .contact-item.unread .contact-preview {
            color: var(--text-2);
            font-weight: 500;
        }

        .contact-time {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-3);
            flex-shrink: 0;
        }

        .contact-item.unread .contact-time {
            color: var(--accent);
        }

        .unread-badge {
            background: var(--accent);
            color: #000;
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .unread-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-left: 6px;
            flex-shrink: 0;
        }

        .company-tag {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--text-3);
            background: var(--bg-raised);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Empty & Loading States */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3);
        }

        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: var(--text-2);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 13px;
        }

        /* Skeleton */
        .skeleton-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 2px;
            animation: pulse-skeleton 1.5s ease-in-out infinite;
        }

        .skeleton-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-raised);
            flex-shrink: 0;
        }

        .skeleton-body {
            flex: 1;
        }

        .skeleton-line {
            height: 10px;
            background: var(--bg-raised);
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .skeleton-line.short {
            width: 60%;
        }

        .skeleton-line.long {
            width: 80%;
        }

        @keyframes pulse-skeleton {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ────────────────────────────────────────────────
           CHAT VIEW (WhatsApp Style)
           ──────────────────────────────────────────────── */
        .chat-view {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--bg-void);
            min-width: 0;
            border-left: 1px solid var(--border);
            margin-left: -1px;
            border-radius: 0 16px 16px 0;
        }

        .chat-view.active {
            display: flex;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-3);
            text-align: center;
            padding: 40px;
        }

        .chat-empty .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .chat-empty h3 {
            color: var(--text-2);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .chat-empty p {
            font-size: 13px;
        }

        /* Chat Header */
        .chat-header {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg-base);
            border-radius: 0 16px 0 0;
        }

        .chat-header.active {
            display: flex;
        }

        .chat-back {
            display: none;
            background: none;
            border: none;
            color: var(--text-2);
            cursor: pointer;
            padding: 4px;
        }

        .chat-back svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
        }

        .chat-avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-raised);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-2);
            border: 1px solid var(--border);
            flex-shrink: 0;
            font-family: var(--font-mono);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-info h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-1);
        }

        .chat-info p {
            font-size: 11px;
            color: var(--text-3);
            font-family: var(--font-mono);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .msg-group {
            display: flex;
            flex-direction: column;
        }

        .msg-group.from-lead {
            align-items: flex-start;
        }

        .msg-group.from-ai {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message-bubble.lead {
            background: var(--bg-raised);
            color: var(--text-1);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .message-bubble.ai {
            background: var(--accent);
            color: #0a0a0a;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--text-3);
            margin-top: 4px;
            opacity: 0.7;
        }

        .message-bubble.ai .message-time {
            color: rgba(10, 10, 10, 0.6);
        }

        .msg-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-3);
        }

        .msg-empty .icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        /* Reply Area */
        .reply-area {
            display: none;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-base);
            flex-shrink: 0;
            border-radius: 0 0 16px 0;
        }

        .reply-area.active {
            display: block;
        }

        .reply-wrap {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 8px 8px 14px;
        }

        .reply-wrap:focus-within {
            border-color: var(--border-mid);
        }

        .reply-wrap textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-1);
            font-family: var(--font-sans);
            font-size: 13px;
            outline: none;
            resize: none;
            min-height: 36px;
            max-height: 100px;
            line-height: 1.5;
        }

        .reply-wrap textarea::placeholder {
            color: var(--text-3);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #0a0a0a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
        }

        .spin-icon {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ────────────────────────────────────────────────
           RESPONSIVE - WhatsApp style mobile
           ──────────────────────────────────────────────── */
        @media (max-width: 640px) {
            .main-container {
                padding: 0;
                background: var(--bg-void);
            }

            .conversation-list {
                max-width: 100%;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .conversation-list.chat-open {
                display: none;
            }

            .chat-view {
                border-radius: 0;
                border-left: none;
                margin-left: 0;
            }

            .chat-view.active {
                display: flex;
                position: fixed;
                inset: 0;
                z-index: 60;
                background: var(--bg-void);
                border-radius: 0;
            }

            .chat-back {
                display: block;
            }

            .chat-header {
                border-radius: 0;
            }

            .reply-area {
                border-radius: 0;
            }

            .search-section {
                padding: 10px 14px 8px;
            }

            .stats-row {
                padding: 6px 14px 10px;
                gap: 4px;
            }

            .stat-chip {
                padding: 3px 8px;
            }

            .stat-chip-val {
                font-size: 12px;
            }

            .contact-list {
                padding: 4px 10px 10px;
            }

            .contact-item {
                padding: 10px 10px;
                gap: 10px;
            }

            .contact-avatar {
                width: 38px;
                height: 38px;
                font-size: 13px;
            }

            .contact-name {
                font-size: 13px;
            }

            .bottom-nav {
                display: flex;
            }

            .chat-view .bottom-nav {
                display: none !important;
            }
        }

        @media (min-width: 641px) {
            .bottom-nav {
                display: none;
            }

            .chat-back {
                display: none !important;
            }
        }

        /* ────────────────────────────────────────────────
           BOTTOM NAV (Mobile)
           ──────────────────────────────────────────────── */
        .bottom-nav {
            display: none;
            height: 56px;
            background: var(--bg-base);
            border-top: 1px solid var(--border);
            align-items: center;
            justify-content: space-around;
            flex-shrink: 0;
            padding: 0 8px;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-3);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 4px 12px;
            border-radius: 8px;
        }

        .bottom-nav .nav-item svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
        }

        .bottom-nav .nav-item:hover {
            color: var(--text-1);
        }

        .bottom-nav .nav-item.active {
            color: var(--accent);
        }

        @media (max-width: 640px) {
            .bottom-nav {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- TOP NAV -->
    <header class="top-nav">
        <div class="nav-logo">
            <div class="nav-logo-mark">
                <svg viewBox="0 0 16 16" fill="none">
                    <rect x="1" y="9" width="2" height="5" rx="0.5" fill="#0a0a0a"/>
                    <rect x="4" y="6" width="2" height="8" rx="0.5" fill="#0a0a0a"/>
                    <rect x="7" y="3" width="2" height="11" rx="0.5" fill="#0a0a0a"/>
                    <rect x="10" y="6" width="2" height="8" rx="0.5" fill="#0a0a0a"/>
                    <rect x="13" y="8" width="2" height="6" rx="0.5" fill="#0a0a0a"/>
                </svg>
            </div>
            <span class="nav-logo-text">Skyline <span>AA-1</span></span>
        </div>
        <div class="nav-status">
            <div class="status-dot"></div>
            <span id="statusText">Live</span>
        </div>
    </header>

    <!-- MAIN -->
    <div class="main-container">

        <!-- CONVERSATION LIST -->
        <div class="conversation-list" id="conversationList">
            <!-- Search -->
            <div class="search-section">
                <div class="search-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7.5"/>
                        <path d="M21 21l-4-4"/>
                    </svg>
                    <input class="search-input" type="text" placeholder="Search conversations…" id="searchInput" autocomplete="off" />
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-row" id="statsRow">
                <div class="stat-chip">
                    <span class="stat-chip-label">Total</span>
                    <span class="stat-chip-val accent" id="statTotal">—</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-chip-label">Unread</span>
                    <span class="stat-chip-val red" id="statUnread">—</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-chip-label">Active</span>
                    <span class="stat-chip-val green" id="statActive">—</span>
                </div>
            </div>

            <!-- Contact List -->
            <div class="contact-list" id="contactList">
                <div id="skeletonLoader">
                    <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line short"></div></div></div>
                    <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line short"></div></div></div>
                    <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line short"></div></div></div>
                    <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line short"></div></div></div>
                    <div class="skeleton-item"><div class="skeleton-avatar"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line short"></div></div></div>
                </div>
            </div>
        </div>

        <!-- CHAT VIEW -->
        <div class="chat-view" id="chatView">
            <!-- Empty State -->
            <div class="chat-empty" id="chatEmpty">
                <div>
                    <span class="icon">💬</span>
                    <h3>Select a conversation</h3>
                    <p>Choose a lead from the list to start chatting.</p>
                </div>
            </div>

            <!-- Chat Header -->
            <div class="chat-header" id="chatHeader">
                <button class="chat-back" id="chatBackBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
                    </svg>
                </button>
                <div class="chat-avatar-small" id="chatAvatar">?</div>
                <div class="chat-info">
                    <h3 id="chatName">Customer Name</h3>
                    <p id="chatEmail">email@example.com</p>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages-container" id="messagesContainer">
                <div class="msg-empty">
                    <span class="icon">📭</span>
                    <p>No messages yet</p>
                </div>
            </div>

            <!-- Reply Area -->
            <div class="reply-area" id="replyArea">
                <div class="reply-wrap">
                    <textarea id="replyInput" rows="1" placeholder="Type a reply…" onkeydown="handleKey(event)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendReply()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV (Mobile) -->
    <nav class="bottom-nav">
        <a href="page.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Home
        </a>
        <a href="notifications.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            Inbox
        </a>
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
            </svg>
            Dashboard
        </a>

    <!-- ─── JAVASCRIPT ─── -->
    <script>
        (function() {
            'use strict';

            const BACKEND = 'https://skylineapp-backend-file.onrender.com';
            const token = localStorage.getItem('token');

            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            // ─── DOM REFS ───
            const contactList = document.getElementById('contactList');
            const skeletonLoader = document.getElementById('skeletonLoader');
            const searchInput = document.getElementById('searchInput');
            const statTotal = document.getElementById('statTotal');
            const statUnread = document.getElementById('statUnread');
            const statActive = document.getElementById('statActive');
            const chatView = document.getElementById('chatView');
            const chatEmpty = document.getElementById('chatEmpty');
            const chatHeader = document.getElementById('chatHeader');
            const chatAvatar = document.getElementById('chatAvatar');
            const chatName = document.getElementById('chatName');
            const chatEmail = document.getElementById('chatEmail');
            const messagesContainer = document.getElementById('messagesContainer');
            const replyArea = document.getElementById('replyArea');
            const replyInput = document.getElementById('replyInput');
            const sendBtn = document.getElementById('sendBtn');
            const conversationList = document.getElementById('conversationList');

            // ─── STATE ───
            let allConversations = [];
            let currentLeadId = null;
            let currentLeadName = '';
            let currentLeadEmail = '';
            let isLoading = false;

            // ─── CACHE ───
            const CACHE_KEY = 'skyline_conversations_cache';

            // ─── LOAD FROM CACHE ───
            function loadFromCache() {
                try {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        const data = JSON.parse(cached);
                        if (data && data.length > 0) {
                            console.log('📦 [Cache] Loaded', data.length, 'conversations');
                            allConversations = data;
                            renderConversations(data);
                            updateStats(data);
                            return true;
                        }
                    }
                } catch (e) {}
                return false;
            }

            function saveToCache(conversations) {
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(conversations));
                } catch (e) {}
            }

            // ─── UTILITY ───
            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function formatTime(dateStr) {
                if (!dateStr) return '';
                try {
                    const d = new Date(dateStr);
                    if (isNaN(d.getTime())) return '';
                    const now = Date.now();
                    const diff = now - d.getTime();
                    if (diff < 60000) return 'Just now';
                    if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
                    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h';
                    if (diff < 604800000) return Math.floor(diff / 86400000) + 'd';
                    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                } catch {
                    return '';
                }
            }

            // ─── RENDER CONVERSATIONS (Clickable) ───
            function renderConversations(conversations) {
                if (skeletonLoader) skeletonLoader.style.display = 'none';

                if (!conversations || conversations.length === 0) {
                    contactList.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">📭</span>
                            <h3>No conversations yet</h3>
                            <p>Send your first email to start a conversation.</p>
                        </div>
                    `;
                    return;
                }

                const sorted = conversations.slice().sort((a, b) => {
                    const aUnread = a.unreadCount || a.unread || 0;
                    const bUnread = b.unreadCount || b.unread || 0;
                    if (aUnread > 0 && bUnread === 0) return -1;
                    if (aUnread === 0 && bUnread > 0) return 1;
                    return new Date(b.lastDate || b.lastContactDate || 0) - new Date(a.lastDate || a.lastContactDate || 0);
                });

                const items = sorted.map(c => {
                    const id = c.id || c._id || '';
                    const name = c.name || c.fullName || 'Unknown';
                    const lastMessage = c.lastMessage || c.message || 'No messages yet';
                    const lastDate = c.lastDate || c.lastContactDate || null;
                    const unreadCount = c.unreadCount || c.unread || 0;
                    const isUnread = unreadCount > 0;
                    const company = c.company || c.leadCompany || '';

                    const initials = (name || '?').charAt(0).toUpperCase();
                    const safeName = escapeHtml(name);
                    const safePreview = escapeHtml(lastMessage);
                    const time = lastDate ? formatTime(lastDate) : '';
                    const safeCompany = escapeHtml(company);

                    return `
                        <div class="contact-item ${isUnread ? 'unread' : ''}" 
                             data-lead-id="${id}"
                             data-lead-name="${safeName}"
                             data-lead-email="${escapeHtml(c.email || '')}"
                             onclick="window.openChat('${id}')">
                            <div class="contact-avatar">${initials}</div>
                            <div class="contact-body">
                                <div class="contact-row1">
                                    <span class="contact-name">${safeName} ${isUnread ? '<span class="unread-dot"></span>' : ''}</span>
                                    <span class="contact-time">${time}</span>
                                </div>
                                <div class="contact-row2">
                                    <span class="contact-preview">${safePreview}</span>
                                    <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
                                        ${safeCompany ? `<span class="company-tag">${safeCompany}</span>` : ''}
                                        ${isUnread ? `<span class="unread-badge">${unreadCount > 99 ? '99+' : unreadCount}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                contactList.innerHTML = items;
            }

            // ─── UPDATE STATS ───
            function updateStats(conversations) {
                const total = conversations.length;
                const unread = conversations.filter(c => (c.unreadCount || c.unread || 0) > 0).length;
                const active = conversations.filter(c => c.status === 'Replied' || c.status === 'Contacted').length;
                statTotal.textContent = total;
                statUnread.textContent = unread;
                statActive.textContent = active;
            }

            // ─── OPEN CHAT (WhatsApp Style) ───
            window.openChat = async function(leadId) {
                console.log('💬 [openChat] Opening:', leadId);

                const conv = allConversations.find(c => (c.id || c._id) === leadId);
                if (!conv) {
                    console.error('❌ Conversation not found');
                    return;
                }

                currentLeadId = leadId;
                currentLeadName = conv.name || 'Unknown';
                currentLeadEmail = conv.email || '';

                // Show chat view
                chatEmpty.style.display = 'none';
                chatHeader.classList.add('active');
                replyArea.classList.add('active');
                chatView.classList.add('active');

                // Update header
                chatName.textContent = currentLeadName;
                chatEmail.textContent = currentLeadEmail || 'No email';
                chatAvatar.textContent = (currentLeadName || '?').charAt(0).toUpperCase();

                // Mobile: hide list, show chat
                if (window.innerWidth <= 640) {
                    conversationList.classList.add('chat-open');
                }

                // Show loading
                messagesContainer.innerHTML = `
                    <div class="msg-empty">
                        <span class="icon">⏳</span>
                        <p>Loading messages...</p>
                    </div>
                `;

                // Fetch messages
                try {
                    const res = await fetch(`${BACKEND}/api/conversations/${leadId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const data = await res.json();
                    const messages = data.messages || [];

                    if (messages.length === 0) {
                        messagesContainer.innerHTML = `
                            <div class="msg-empty">
                                <span class="icon">📭</span>
                                <p>No messages yet. Send the first message!</p>
                            </div>
                        `;
                        return;
                    }

                    messagesContainer.innerHTML = messages.map(msg => {
                        const isLead = msg.from === 'lead';
                        const groupClass = isLead ? 'from-lead' : 'from-ai';
                        const bubbleClass = isLead ? 'lead' : 'ai';
                        const safeContent = escapeHtml(msg.content || '');
                        const time = msg.date ? formatTime(msg.date) : '';

                        return `
                            <div class="msg-group ${groupClass}">
                                <div class="message-bubble ${bubbleClass}">
                                    ${safeContent}
                                    <div class="message-time">${time}</div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    messagesContainer.scrollTop = messagesContainer.scrollHeight;

                    // Mark as read
                    if (conv.unreadCount > 0) {
                        try {
                            await fetch(`${BACKEND}/api/conversations/${leadId}/read`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            conv.unreadCount = 0;
                            conv.unread = false;
                            renderConversations(allConversations);
                            updateStats(allConversations);
                        } catch (readErr) {
                            console.warn('⚠️ Mark as read failed:', readErr);
                        }
                    }

                } catch (err) {
                    console.error('❌ [openChat] Error:', err);
                    messagesContainer.innerHTML = `
                        <div class="msg-empty">
                            <span class="icon">⚠️</span>
                            <p>Failed to load messages: ${err.message}</p>
                        </div>
                    `;
                }
            };

            // ─── SEND REPLY ───
            window.sendReply = async function() {
                const text = replyInput.value.trim();
                if (!text || !currentLeadId) return;

                const conv = allConversations.find(c => (c.id || c._id) === currentLeadId);
                if (!conv) {
                    alert('Conversation not found');
                    return;
                }

                sendBtn.disabled = true;
                sendBtn.innerHTML = `<svg class="spin-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;

                const payload = {
                    leadId: currentLeadId,
                    leads: [{
                        name: currentLeadName || 'Lead',
                        email: currentLeadEmail,
                        company: conv.company || '',
                        messages: [{
                            subject: "Re: Conversation",
                            body: text
                        }]
                    }]
                };

                try {
                    const res = await fetch(`${BACKEND}/api/leads/batch-send`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();

                    if (data.success) {
                        replyInput.value = '';
                        replyInput.style.height = 'auto';

                        // Add message to UI
                        const msgDiv = document.createElement('div');
                        msgDiv.className = 'msg-group from-ai';
                        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        msgDiv.innerHTML = `
                            <div class="message-bubble ai">
                                ${escapeHtml(text)}
                                <div class="message-time">${time}</div>
                            </div>
                        `;
                        messagesContainer.appendChild(msgDiv);
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;

                        // Update conversation list
                        conv.lastMessage = text;
                        conv.lastDate = new Date().toISOString();
                        renderConversations(allConversations);

                    } else {
                        alert('❌ Failed to send: ' + (data.message || data.error || 'Unknown error'));
                    }
                } catch (err) {
                    console.error('❌ [sendReply] Error:', err);
                    alert('⚠️ Connection error. Please try again.');
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>`;
                }
            };

            // ─── HANDLE KEY ───
            window.handleKey = function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    window.sendReply();
                }
            };

            // ─── AUTO-RESIZE ───
            replyInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });

            // ─── SEARCH ───
            let searchTimeout = null;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    const q = this.value.toLowerCase().trim();
                    if (!q) {
                        renderConversations(allConversations);
                        return;
                    }
                    const filtered = allConversations.filter(c =>
                        (c.name || '').toLowerCase().includes(q) ||
                        (c.email || '').toLowerCase().includes(q) ||
                        (c.company || '').toLowerCase().includes(q)
                    );
                    renderConversations(filtered);
                }, 150);
            });

            // ─── BACK BUTTON (Mobile) ───
            document.getElementById('chatBackBtn').addEventListener('click', function() {
                chatView.classList.remove('active');
                chatHeader.classList.remove('active');
                replyArea.classList.remove('active');
                chatEmpty.style.display = 'flex';
                conversationList.classList.remove('chat-open');
                currentLeadId = null;
            });

            // ─── FETCH IN BACKGROUND ───
            async function fetchInBackground() {
                if (isLoading) return;
                isLoading = true;
                try {
                    const res = await fetch(`${BACKEND}/api/conversations`, {
                        headers: { 'Authorization': `Bearer ${token}` },
                        cache: 'no-cache'
                    });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    if (JSON.stringify(data) !== JSON.stringify(allConversations)) {
                        allConversations = data;
                        saveToCache(data);
                        renderConversations(data);
                        updateStats(data);
                    }
                } catch (err) {
                    console.warn('⚠️ Background refresh failed:', err.message);
                } finally {
                    isLoading = false;
                }
            }

            // ─── EXPOSE FOR RETRY ───
            window.loadConversations = fetchInBackground;

            // ─── INIT ───
            document.addEventListener('DOMContentLoaded', function() {
                console.log('🚀 Initializing...');

                const hasCache = loadFromCache();
                if (!hasCache) {
                    skeletonLoader.style.display = 'block';
                } else {
                    skeletonLoader.style.display = 'none';
                }

                setTimeout(() => {
                    fetchInBackground();
                }, 100);

                setInterval(() => {
                    if (document.visibilityState === 'visible') {
                        fetchInBackground();
                    }
                }, 30000);
            });

        })();
    </script>
