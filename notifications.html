<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox | Skyline AA-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        /* ────────────────────────────────────────────────
           RESET & VARIABLES
           ──────────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-void: #0a0a0a;
            --bg-base: #111318;
            --bg-surface: #181b22;
            --bg-raised: #1e2229;
            --bg-hover: #262b34;
            --border: rgba(255, 255, 255, 0.06);
            --border-mid: rgba(255, 255, 255, 0.12);
            --accent: #c8ff57;
            --accent-dim: rgba(200, 255, 87, 0.08);
            --green: #00e676;
            --red: #ff4d4d;
            --amber: #ffaa00;
            --text-1: #e8eaf0;
            --text-2: #8c909e;
            --text-3: #52566a;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-void);
            color: var(--text-1);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ────────────────────────────────────────────────
           TOP NAV
           ──────────────────────────────────────────────── */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 56px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo-mark {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-logo-mark svg {
            width: 14px;
            height: 14px;
        }

        .nav-logo-text {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-1);
        }

        .nav-logo-text span {
            color: var(--accent);
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-3);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ────────────────────────────────────────────────
           MAIN CONTAINER
           ──────────────────────────────────────────────── */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            justify-content: center;
            padding: 20px;
        }

        /* ────────────────────────────────────────────────
           CONVERSATION LIST
           ──────────────────────────────────────────────── */
        .conversation-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 720px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        /* Search */
        .search-section {
            padding: 16px 20px 12px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }

        .search-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
            transition: border-color 0.2s;
        }

        .search-wrap:focus-within {
            border-color: var(--border-mid);
        }

        .search-wrap svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-3);
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-1);
            padding: 10px 0;
            font-size: 13px;
            outline: none;
            font-family: var(--font-sans);
        }

        .search-input::placeholder {
            color: var(--text-3);
        }

        /* Stats */
        .stats-row {
            display: flex;
            gap: 8px;
            padding: 10px 20px 14px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .stat-chip {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-chip-label {
            font-family: var(--font-mono);
            font-size: 8px;
            text-transform: uppercase;
            color: var(--text-3);
            letter-spacing: 0.06em;
        }

        .stat-chip-val {
            font-weight: 600;
            font-size: 14px;
        }

        .stat-chip-val.accent { color: var(--accent); }
        .stat-chip-val.green { color: var(--green); }
        .stat-chip-val.red { color: var(--red); }
        .stat-chip-val.amber { color: var(--amber); }

        /* Contact List */
        .contact-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 16px 16px;
        }

        .contact-list::-webkit-scrollbar {
            width: 3px;
        }

        .contact-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .contact-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            margin-bottom: 2px;
        }

        .contact-item:hover {
            background: var(--bg-surface);
            border-color: var(--border);
        }

        .contact-item.unread {
            background: var(--accent-dim);
            border-left: 3px solid var(--accent);
        }

        .contact-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-raised);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-2);
            flex-shrink: 0;
            border: 1px solid var(--border);
            font-family: var(--font-mono);
        }

        .contact-item.unread .contact-avatar {
            border-color: var(--accent);
        }

        .contact-body {
            flex: 1;
            min-width: 0;
        }

        .contact-row1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .contact-row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
        }

        .contact-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-1);
        }

        .contact-item.unread .contact-name {
            font-weight: 700;
            color: var(--text-1);
        }

        .contact-preview {
            font-size: 12px;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .contact-item.unread .contact-preview {
            color: var(--text-2);
            font-weight: 500;
        }

        .contact-time {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-3);
            flex-shrink: 0;
        }

        .contact-item.unread .contact-time {
            color: var(--accent);
        }

        .unread-badge {
            background: var(--accent);
            color: #000;
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .unread-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-left: 6px;
            flex-shrink: 0;
        }

        .company-tag {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--text-3);
            background: var(--bg-raised);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-item.unread .company-tag {
            color: var(--text-2);
        }

        /* Empty & Loading States */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3);
        }

        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: var(--text-2);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 13px;
        }

        .empty-state .retry-btn {
            margin-top: 16px;
            padding: 8px 20px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
        }

        .empty-state .retry-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(200, 255, 87, 0.2);
        }

        .loading-text {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-3);
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.06em;
        }

        /* ────────────────────────────────────────────────
           RESPONSIVE
           ──────────────────────────────────────────────── */
        @media (max-width: 640px) {
            .main-container {
                padding: 12px;
            }

            .conversation-list {
                max-width: 100%;
                border-radius: 12px;
            }

            .search-section {
                padding: 12px 16px 10px;
            }

            .stats-row {
                padding: 8px 16px 10px;
                gap: 6px;
            }

            .stat-chip {
                padding: 4px 10px;
            }

            .stat-chip-val {
                font-size: 12px;
            }

            .contact-list {
                padding: 4px 12px 12px;
            }

            .contact-item {
                padding: 10px 12px;
                gap: 10px;
            }

            .contact-avatar {
                width: 38px;
                height: 38px;
                font-size: 13px;
            }

            .contact-name {
                font-size: 13px;
            }

            .bottom-nav {
                display: flex;
            }
        }

        @media (min-width: 641px) {
            .bottom-nav {
                display: none;
            }
        }

        /* ────────────────────────────────────────────────
           BOTTOM NAV (Mobile)
           ──────────────────────────────────────────────── */
        .bottom-nav {
            display: none;
            height: 56px;
            background: var(--bg-base);
            border-top: 1px solid var(--border);
            align-items: center;
            justify-content: space-around;
            flex-shrink: 0;
            padding: 0 8px;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-3);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            transition: color 0.2s;
            padding: 4px 12px;
            border-radius: 8px;
        }

        .bottom-nav .nav-item svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
        }

        .bottom-nav .nav-item:hover {
            color: var(--text-1);
        }

        .bottom-nav .nav-item.active {
            color: var(--accent);
        }

        @media (max-width: 640px) {
            .bottom-nav {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- TOP NAV -->
    <header class="top-nav">
        <div class="nav-logo">
            <div class="nav-logo-mark">
                <svg viewBox="0 0 16 16" fill="none">
                    <rect x="1" y="9" width="2" height="5" rx="0.5" fill="#0a0a0a"/>
                    <rect x="4" y="6" width="2" height="8" rx="0.5" fill="#0a0a0a"/>
                    <rect x="7" y="3" width="2" height="11" rx="0.5" fill="#0a0a0a"/>
                    <rect x="10" y="6" width="2" height="8" rx="0.5" fill="#0a0a0a"/>
                    <rect x="13" y="8" width="2" height="6" rx="0.5" fill="#0a0a0a"/>
                </svg>
            </div>
            <span class="nav-logo-text">Skyline <span>AA-1</span></span>
        </div>
        <div class="nav-status">
            <div class="status-dot"></div>
            <span id="statusText">Live</span>
        </div>
    </header>

    <!-- MAIN -->
    <div class="main-container">

        <!-- CONVERSATION LIST -->
        <div class="conversation-list">
            <!-- Search -->
            <div class="search-section">
                <div class="search-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7.5"/>
                        <path d="M21 21l-4-4"/>
                    </svg>
                    <input class="search-input" type="text" placeholder="Search conversations…" id="searchInput" />
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-row" id="statsRow">
                <div class="stat-chip">
                    <span class="stat-chip-label">Total</span>
                    <span class="stat-chip-val accent" id="statTotal">—</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-chip-label">Unread</span>
                    <span class="stat-chip-val red" id="statUnread">—</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-chip-label">Active</span>
                    <span class="stat-chip-val green" id="statActive">—</span>
                </div>
            </div>

            <!-- Contact List -->
            <div class="contact-list" id="contactList">
                <div class="loading-text">Loading conversations…</div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV (Mobile) -->
    <nav class="bottom-nav">
        <a href="page.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Home
        </a>
        <a href="notifications.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            Inbox
        </a>
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
            </svg>
            Dashboard
        </a>
    </nav>

    <!-- ─── JAVASCRIPT ─── -->
    <script>
        // ─── CONFIG ───
        const BACKEND = 'https://skylineapp-backend-file.onrender.com';
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'login.html';
        }

        console.log('🔑 Token:', token ? '✅ Present' : '❌ Missing');

        // ─── STATE ───
        let allConversations = [];

        // ─── DOM REFS ───
        const contactList = document.getElementById('contactList');
        const searchInput = document.getElementById('searchInput');
        const statTotal = document.getElementById('statTotal');
        const statUnread = document.getElementById('statUnread');
        const statActive = document.getElementById('statActive');

        // ─── LOAD CONVERSATIONS ───
        async function loadConversations() {
            console.log('📡 [loadConversations] Fetching /api/conversations...');
            contactList.innerHTML = `<div class="loading-text">Loading conversations…</div>`;

            try {
                const res = await fetch(`${BACKEND}/api/conversations`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                console.log(`📡 [loadConversations] Status: ${res.status}`);

                if (!res.ok) {
                    const text = await res.text();
                    console.error('❌ Error response:', text);
                    throw new Error(`HTTP ${res.status} — ${text}`);
                }

                const data = await res.json();
                console.log(`✅ [loadConversations] Received ${data.length} conversations`);
                allConversations = data;
                renderConversations(data);
                updateStats(data);
                return data;
            } catch (err) {
                console.error('❌ [loadConversations] Error:', err);
                contactList.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">⚠️</span>
                        <h3>Failed to load</h3>
                        <p>${err.message}</p>
                        <button class="retry-btn" onclick="loadConversations()">Retry</button>
                    </div>
                `;
                return [];
            }
        }

        // ─── RENDER CONVERSATIONS ───
        function renderConversations(conversations) {
            if (!conversations || conversations.length === 0) {
                contactList.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📭</span>
                        <h3>No conversations yet</h3>
                        <p>Send your first email to start a conversation.</p>
                    </div>
                `;
                return;
            }

            // Sort: unread first, then by date
            const sorted = [...conversations].sort((a, b) => {
                if (a.unread && !b.unread) return -1;
                if (!a.unread && b.unread) return 1;
                return new Date(b.lastDate || 0) - new Date(a.lastDate || 0);
            });

            contactList.innerHTML = sorted.map(c => {
                const unread = c.unreadCount || 0;
                const isUnread = unread > 0;
                const initials = (c.name || '?').charAt(0).toUpperCase();
                const safeName = escapeHtml(c.name || 'Unknown');
                const safeEmail = escapeHtml(c.email || '');
                const safeCompany = escapeHtml(c.company || '');
                const safePreview = escapeHtml(c.lastMessage || 'No messages yet');
                const time = c.lastDate ? formatTime(c.lastDate) : '';

                return `
                    <div class="contact-item ${isUnread ? 'unread' : ''}">
                        <div class="contact-avatar">${initials}</div>
                        <div class="contact-body">
                            <div class="contact-row1">
                                <span class="contact-name">${safeName} ${isUnread ? '<span class="unread-dot"></span>' : ''}</span>
                                <span class="contact-time">${time}</span>
                            </div>
                            <div class="contact-row2">
                                <span class="contact-preview">${safePreview}</span>
                                <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
                                    ${safeCompany ? `<span class="company-tag">${safeCompany}</span>` : ''}
                                    ${isUnread ? `<span class="unread-badge">${unread > 99 ? '99+' : unread}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ─── UPDATE STATS ───
        function updateStats(conversations) {
            const total = conversations.length;
            const unread = conversations.filter(c => c.unreadCount > 0).length;
            const active = conversations.filter(c => c.status === 'Replied' || c.status === 'Contacted').length;

            statTotal.textContent = total;
            statUnread.textContent = unread;
            statActive.textContent = active;
        }

        // ─── SEARCH ───
        searchInput.addEventListener('input', function() {
            const q = this.value.toLowerCase().trim();
            if (!q) {
                renderConversations(allConversations);
                return;
            }
            const filtered = allConversations.filter(c =>
                (c.name || '').toLowerCase().includes(q) ||
                (c.email || '').toLowerCase().includes(q) ||
                (c.company || '').toLowerCase().includes(q)
            );
            renderConversations(filtered);
        });

        // ─── UTILITY FUNCTIONS ───
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatTime(dateStr) {
            if (!dateStr) return '';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return '';
                const now = new Date();
                const diff = now - d;
                if (diff < 60000) return 'Just now';
                if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
                if (diff < 86400000) return Math.floor(diff / 3600000) + 'h';
                if (diff < 604800000) return Math.floor(diff / 86400000) + 'd';
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            } catch {
                return '';
            }
        }

        // ─── INIT ───
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 [DOMContentLoaded] Initializing...');
            loadConversations();

            // Refresh every 30 seconds
            setInterval(() => {
                if (document.visibilityState === 'visible') {
                    loadConversations();
                }
            }, 30000);
        });
    </script>
</body>
  </html>
