<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Inbox | Skyline AA-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Clash+Display:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-void: #05060a;
      --bg-base: #090b10;
      --bg-surface: #0f1119;
      --bg-raised: #161925;
      --bg-hover: #1c2030;
      --border: rgba(255,255,255,0.05);
      --border-mid: rgba(255,255,255,0.09);
      --accent: #c8ff57;
      --accent-dim: rgba(200,255,87,0.12);
      --accent-go: #00d2ff;
      --accent-go-dim: rgba(0,210,255,0.12);
      --text-1: #eceef5;
      --text-2: #8c909e;
      --text-3: #434659;
      --red: #ff4d6d;
      --amber: #ffb347;
      --green: #2ecc71;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }

    body {
      background: var(--bg-void);
      color: var(--text-1);
      font-family: var(--font-display);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── TOP NAV (unchanged) ─── */
    .top-nav {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 56px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
      position: relative;
      z-index: 10;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-logo-mark {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .nav-logo-mark svg { width: 16px; height: 16px; }
    .nav-logo-text {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .nav-logo-text span { color: var(--accent); }

    .nav-divider {
      width: 1px;
      height: 22px;
      background: var(--border-mid);
      flex-shrink: 0;
    }

    .tab-group {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }
    .tab-pill {
      height: 30px;
      padding: 0 14px;
      background: none;
      border: none;
      border-radius: 7px;
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      position: relative;
    }
    .tab-pill.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
    }
    .tab-pill:hover:not(.active) {
      color: var(--text-2);
      background: var(--bg-raised);
    }

    .tab-badge {
      background: var(--red);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
    }
    .tab-pill.active .tab-badge {
      background: rgba(0,0,0,0.25);
      color: #000;
    }

    .nav-spacer { flex: 1; }
    .nav-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-3);
      flex-shrink: 0;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ─── MAIN CONTAINER (padding bottom for fixed bottom-nav) ─── */
    .main-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      padding-bottom: 60px;   /* ensures content does not hide behind fixed bottom bar */
    }

    /* ─── VIEW: LIST ─── */
    .view-list {
      position: absolute;
      inset: 0;
      background: var(--bg-void);
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      z-index: 10;
    }
    .view-list.hidden { transform: translateX(-100%); pointer-events: none; }

    /* ─── SEARCH BAR ─── */
    .search-section {
      padding: 12px 16px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-wrap {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      pointer-events: none;
    }
    .search-icon svg { width: 15px; height: 15px; stroke: var(--text-3); }
    .search-input {
      width: 100%;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px 9px 36px;
      color: var(--text-1);
      font-family: var(--font-display);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus {
      border-color: rgba(200,255,87,0.3);
      background: var(--bg-hover);
    }

    /* ─── STATS ROW ─── */
    .stats-row {
      display: flex;
      padding: 10px 16px;
      gap: 8px;
      background: var(--bg-void);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .stat-chip {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-chip-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stat-chip-val {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1;
    }
    .stat-chip-val.green { color: var(--green); }
    .stat-chip-val.amber { color: var(--amber); }
    .stat-chip-val.red   { color: var(--red); }
    .stat-chip-val.accent { color: var(--accent); }

    /* ─── CONTACT LIST ─── */
    .contact-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .contact-list::-webkit-scrollbar { display: none; }

    .contact-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }
    .contact-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: transparent;
      transition: background 0.2s;
      border-radius: 0 2px 2px 0;
    }
    .contact-item.unread::before { background: var(--accent); }
    .contact-item:hover { background: var(--bg-surface); }
    .contact-item:active { background: var(--bg-raised); }

    .contact-avatar {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--bg-raised);
      border: 1px solid var(--border-mid);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
    .contact-item.unread .contact-avatar {
      border-color: rgba(200,255,87,0.25);
      background: rgba(200,255,87,0.06);
    }

    .contact-body { flex: 1; min-width: 0; }
    .contact-row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .contact-name {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60%;
    }
    .contact-item.unread .contact-name { color: var(--text-1); }
    .contact-time {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-3);
      flex-shrink: 0;
    }
    .contact-item.unread .contact-time { color: var(--accent); }
    .contact-row2 {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: space-between;
    }
    .contact-preview {
      font-size: 12px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      line-height: 1.4;
    }
    .contact-item.unread .contact-preview { color: var(--text-2); }

    .contact-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .unread-badge {
      background: var(--accent);
      color: #000;
      font-size: 9px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      font-family: var(--font-mono);
    }
    .conf-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .conf-badge.high { background: rgba(46,204,113,0.12); color: var(--green); border: 1px solid rgba(46,204,113,0.25); }
    .conf-badge.med  { background: rgba(255,179,71,0.12); color: var(--amber); border: 1px solid rgba(255,179,71,0.25); }
    .conf-badge.low  { background: rgba(255,77,109,0.12); color: var(--red);   border: 1px solid rgba(255,77,109,0.25); }

    .company-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-3);
      background: var(--bg-raised);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── VIEW: CHAT ─── */
    .view-chat {
      position: absolute; inset: 0;
      background: var(--bg-void);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      z-index: 20;
    }
    .view-chat.active { transform: translateX(0); }

    .chat-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-base);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      min-height: 60px;
    }
    .back-btn {
      width: 36px; height: 36px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    }
    .back-btn:hover {
      border-color: rgba(200,255,87,0.35);
      background: var(--accent-dim);
    }
    .back-btn svg { width: 15px; height: 15px; stroke: var(--text-2); transition: stroke 0.2s; }
    .back-btn:hover svg { stroke: var(--accent); }

    .chat-avatar-wrap {
      position: relative; flex-shrink: 0;
    }
    .chat-avatar {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--bg-raised);
      border: 1px solid rgba(200,255,87,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--accent);
      text-transform: uppercase;
    }
    .chat-online-dot {
      position: absolute; bottom: -2px; right: -2px;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--green);
      border: 2px solid var(--bg-base);
    }

    .chat-info { flex: 1; min-width: 0; }
    .chat-info h3 {
      font-size: 14px; font-weight: 700; color: var(--text-1);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 8px; margin: 0;
    }
    .chat-info p {
      font-size: 10.5px; color: var(--text-3);
      font-family: var(--font-mono); margin: 2px 0 0;
    }

    .ai-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      cursor: pointer;
      transition: all 0.25s;
      flex-shrink: 0;
    }
    .ai-toggle:hover { border-color: var(--border-mid); background: var(--bg-raised); }
    .ai-toggle.active {
      background: var(--accent-go-dim);
      border-color: rgba(0,210,255,0.35);
      box-shadow: 0 0 16px rgba(0,210,255,0.12);
    }

    .ai-icon svg { width: 18px; height: 18px; }
    .ai-toggle-text {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .ai-toggle.active .ai-toggle-text { color: var(--accent-go); }
    .ai-toggle-indicator {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-3);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .ai-toggle.active .ai-toggle-indicator {
      background: var(--accent-go);
      box-shadow: 0 0 6px var(--accent-go);
    }

    .chat-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
    .icon-btn {
      width: 34px; height: 34px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
      color: var(--text-3);
      font-size: 13px;
    }
    .icon-btn:hover { border-color: var(--border-mid); color: var(--text-2); background: var(--bg-raised); }
    .icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; }

    .edit-details-btn {
      height: 34px;
      padding: 0 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-2);
      letter-spacing: 0.05em;
      transition: all 0.2s;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .edit-details-btn:hover { border-color: var(--accent); color: var(--accent); }
    .edit-details-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; }

    .messages-container {
      flex: 1; padding: 16px 16px 8px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
      scrollbar-width: none;
    }
    .messages-container::-webkit-scrollbar { display: none; }

    .msg-group { display: flex; flex-direction: column; gap: 4px; }
    .msg-group.from-lead { align-items: flex-start; }
    .msg-group.from-ai   { align-items: flex-end; }

    .msg-sender {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-3);
      margin-bottom: 3px;
      padding: 0 4px;
      letter-spacing: 0.05em;
    }

    .message-bubble {
      max-width: 76%;
      padding: 10px 14px;
      font-size: 13.5px;
      line-height: 1.55;
      word-wrap: break-word;
      border-radius: 14px;
      position: relative;
    }
    .message-bubble.lead {
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-bottom-left-radius: 3px;
      color: var(--text-1);
    }
    .message-bubble.ai {
      background: linear-gradient(135deg, rgba(200,255,87,0.10) 0%, rgba(200,255,87,0.06) 100%);
      border: 1px solid rgba(200,255,87,0.18);
      border-bottom-right-radius: 3px;
      color: var(--text-1);
    }
    .message-time {
      font-size: 9px;
      color: var(--text-3);
      margin-top: 4px;
      text-align: right;
      font-family: var(--font-mono);
    }
    .msg-group.from-lead .message-time { text-align: left; }

    .reply-input-area {
      padding: 10px 14px 14px;
      background: var(--bg-base);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .reply-input-area.hidden { display: none; }

    .reply-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .reply-toolbar-label {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex: 1;
    }

    .reply-wrap {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .reply-input-area textarea {
      flex: 1;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text-1);
      padding: 10px 14px;
      border-radius: 12px;
      resize: none;
      height: 42px;
      max-height: 120px;
      font-family: var(--font-display);
      font-size: 13.5px;
      line-height: 1.4;
      transition: border-color 0.2s;
      overflow-y: auto;
      outline: none;
    }
    .reply-input-area textarea:focus { border-color: rgba(200,255,87,0.28); }
    .reply-input-area textarea::placeholder { color: var(--text-3); }
    .send-btn {
      width: 42px; height: 42px;
      background: var(--accent);
      color: #000;
      border: none; border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s;
    }
    .send-btn:hover { background: #d4ff6a; transform: scale(1.05); }
    .send-btn:disabled { background: var(--bg-raised); cursor: not-allowed; transform: none; }
    .send-btn svg { width: 17px; height: 17px; stroke: #000; fill: none; }
    .send-btn:disabled svg { stroke: var(--text-3); }

    .view-admin {
      position: absolute; inset: 0;
      background: var(--bg-void);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .view-admin.active { display: flex; }

    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: var(--text-3);
      text-align: center; gap: 10px; padding: 40px 20px;
    }
    .empty-state h3 {
      font-size: 15px; font-weight: 700; color: var(--text-2); margin: 0;
    }
    .empty-state p  { font-size: 12px; margin: 0; line-height: 1.7; }
    .empty-icon {
      width: 52px; height: 52px;
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .empty-icon svg { width: 22px; height: 22px; stroke: var(--text-3); fill: none; }

    /* MODAL (unchanged) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
      z-index: 1000;
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-radius: 18px;
      padding: 24px;
      width: 92%;
      max-width: 480px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      animation: modal-in 0.2s ease;
    }
    @keyframes modal-in {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 20px;
    }
    .modal-header-left h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-1);
      margin: 0 0 3px;
    }
    .modal-header-left p {
      font-size: 11px;
      color: var(--text-3);
      font-family: var(--font-mono);
    }
    .modal-close {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-2);
      font-size: 18px; line-height: 1;
      transition: all 0.2s; flex-shrink: 0;
    }
    .modal-close:hover { border-color: var(--red); color: var(--red); }
    .modal-field label {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
