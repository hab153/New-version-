<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Skyline AA-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #060608;
      --bg-base: #0b0c0f;
      --bg-surface: #111318;
      --bg-raised: #181b22;
      --border: rgba(255,255,255,0.06);
      --accent: #c8ff57;
      --text-1: #e8eaf0;
      --text-2: #8c909e;
      --text-3: #52566a;
      --danger: #ff4d4d;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg-void);
      color: var(--text-1);
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Topbar */
    .topbar {
      width: 100%;
      height: 58px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-sizing: border-box;
    }

    .topbar-left {      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand {      
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand .dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    /* Upgrade Button Style */
    .upgrade-btn {
      background: var(--accent);
      color: #060608;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(200, 255, 87, 0.2);
    }

    .upgrade-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 15px rgba(200, 255, 87, 0.4);
      background: #d4ff70;
    }

    /* Notification Bell Wrapper */
    .notif-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;    }

    .notif-btn {
      background: none;
      border: none;
      color: var(--text-2);
      font-size: 22px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
      padding: 8px;
      border-radius: 50%;
    }

    .notif-btn:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-1);
    }

    .notif-btn.has-notifs {
      color: var(--danger);
      animation: pulse-red 2s infinite;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
    }

    .badge {
      position: absolute;
      top: 2px;
      right: 2px;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: bold;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg-base);
      display: none;
    }

    .notif-label {      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--danger);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: none;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 500px;
      padding: 32px 20px;
      flex: 1;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-3);
      margin-bottom: 16px;
      margin-top: 32px;
      padding-left: 4px;
    }

    .section-title:first-child { margin-top: 0; }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .menu-item {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-1);
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .menu-item:hover {
      background: var(--bg-raised);
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .menu-item span { font-size: 14px; }
    
    .arrow {
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .danger-zone .menu-item {
      border-color: rgba(255, 77, 77, 0.1);
    }
    
    .danger-zone .menu-item:hover {
      border-color: var(--danger);
      background: rgba(255, 77, 77, 0.05);
    }
    .danger-text { color: var(--danger); }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      color: var(--text-2);
      text-decoration: none;
      font-size: 13px;
      font-family: var(--font-mono);
    }
    .back-link:hover { color: var(--accent); }

  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="dot"></span>
        SKYLINE AA-1
      </div>
      <!-- Upgrade Button -->
      <button class="upgrade-btn" onclick="initiateUpgrade()">Upgrade to Pro</button>
    </div>
    
    <!-- Notification Area -->
    <div class="notif-wrapper">      <span id="notifLabel" class="notif-label">New</span>
      <button class="notif-btn" id="notifBtn" onclick="handleNotifClick()">
        🔔
        <span id="notifBadge" class="badge">0</span>
      </button>
    </div>
  </header>

  <div class="container">
    
    <!-- Section 1: Profile -->
    <div class="section-title">Profile</div>
    <div class="menu-grid">
      <a href="profile.html" class="menu-item">
        <span>Profile Details</span>
        <span class="arrow">›</span>
      </a>
      <a href="account.html" class="menu-item">
        <span>Account Settings</span>
        <span class="arrow">›</span>
      </a>
    </div>

    <!-- Section 2: Skyline Info -->
    <div class="section-title">Skyline System</div>
    <div class="menu-grid">
      <a href="Privacy.html" class="menu-item">
        <span>Privacy Policy</span>
        <span class="arrow">›</span>
      </a>
      <a href="age-verification.html" class="menu-item">
        <span>Age Verification</span>
        <span class="arrow">›</span>
      </a>
      <a href="email-settings.html" class="menu-item">
        <span>Email Preferences</span>
        <span class="arrow">›</span>
      </a>
      <a href="about.html" class="menu-item">
        <span>About Skyline AA-1</span>
        <span class="arrow">›</span>
      </a>
      <a href="report.html" class="menu-item">
        <span>Report an Issue</span>
        <span class="arrow">›</span>
      </a>
    </div>

    <!-- Section 3: Dangerous Zone -->
    <div class="section-title">Dangerous Zone</div>    <div class="menu-grid danger-zone">
      <a href="#" onclick="handleLogout()" class="menu-item">
        <span class="danger-text">Sign Out</span>
        <span class="arrow">›</span>
      </a>
      <a href="delete-account.html" class="menu-item">
        <span class="danger-text">Delete Account</span>
        <span class="arrow">›</span>
      </a>
    </div>

    <a href="page.html" class="back-link">← Return to Dream Architect</a>

  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = "login.html";

    // --- UPGRADE LOGIC ---
    async function initiateUpgrade() {
      try {
        const btn = document.querySelector('.upgrade-btn');
        const originalText = btn.innerText;
        btn.innerText = "Processing...";
        btn.disabled = true;

        // Call backend to create Flutterwave session
        const response = await fetch('https://skylineapp-backend-file.onrender.com/api/create-flutterwave-payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (data.link) {
          // Redirect user to Flutterwave Checkout Page
          window.location.href = data.link;
        } else {
          alert('Failed to initialize payment: ' + (data.message || 'Unknown error'));
          btn.innerText = originalText;
          btn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        alert('Network Error. Please try again.');
        const btn = document.querySelector('.upgrade-btn');        btn.innerText = "Upgrade to Pro";
        btn.disabled = false;
      }
    }

    // --- NOTIFICATION LOGIC ---
    function handleNotifClick() {
      localStorage.setItem('lastNotifViewTime', new Date().toISOString());
      window.location.href = 'notifications.html';
    }

    async function loadNotifCount() {
      try {
        const res = await fetch('https://skylineapp-backend-file.onrender.com/api/notifications/count', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if(res.ok) {
          const data = await res.json();
          const badge = document.getElementById('notifBadge');
          const btn = document.getElementById('notifBtn');
          const label = document.getElementById('notifLabel');

          const hasServerMessages = data.count > 0;
          const lastViewTime = localStorage.getItem('lastNotifViewTime');
          
          let shouldShowBadge = false;

          if (hasServerMessages) {
             if (!lastViewTime) {
                 shouldShowBadge = true;
             } else {
                 shouldShowBadge = false; 
             }
          }

          if (shouldShowBadge) {
            badge.style.display = 'flex';
            badge.textContent = data.count > 9 ? '9+' : data.count;
            btn.classList.add('has-notifs');
            label.style.display = 'block';
          } else {
            badge.style.display = 'none';
            btn.classList.remove('has-notifs');
            label.style.display = 'none';
          }
        }
      } catch(err) {
        console.error("Failed to load notifications");
      }    }

    function handleLogout() {
      if(confirm("Are you sure you want to sign out?")) {
        localStorage.removeItem('token');
        localStorage.removeItem('lastNotifViewTime');
        window.location.href = "login.html";
      }
    }

    loadNotifCount();
  </script>

</body>
</html>
