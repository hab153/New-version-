<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Dream Realization</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void:        #0a0a0a;
      --base:        #121212;
      --surface:     #1a1a1a;
      --raised:      #242424;
      --hover:       #2d2d2d;
      --border:      rgba(255,255,255,0.08);
      --border-md:   rgba(255,255,255,0.12);
      --border-hi:   rgba(255,255,255,0.18);
      --accent:      #ffffff;
      --accent-lt:   #f0f0f0;
      --accent-dim:  rgba(255,255,255,0.06);
      --accent-glow: rgba(255,255,255,0.1);
      --text-1:      #f5f5f5;
      --text-2:      #b0b0b0;
      --text-3:      #707070;
      --error:       #ff5555;
      --error-dim:   rgba(255,85,85,0.10);
      --success:     #66dd99;
      --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      --font-mono:    'Monaco', 'Menlo', monospace;
    }

    html, body {
      height: 100%;
      background: var(--void);
      color: var(--text-1);
      overflow: hidden;
      font-family: var(--font-display);
    }

    .page {
      display: flex;
      height: 100vh;
      width: 100vw;
      animation: pageIn 0.6s ease-out both;
    }

    @keyframes pageIn {      
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .panel-left {
      width: 45%;
      flex-shrink: 0;
      background: var(--base);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 56px;
      position: relative;
      overflow: hidden;
    }

    .panel-left::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;      
      z-index: 1;
      animation: fadeUp 0.6s 0.1s both;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon svg { 
      width: 18px; 
      height: 18px; 
      color: #fff;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-1);
    }

    .art-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }

    .art-svg {
      width: 400px;
      height: 400px;
      opacity: 0.08;
      animation: artSpin 80s linear infinite;
    }

    @keyframes artSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .panel-quote {
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s 0.2s both;
    }

    .quote-line {
      display: block;
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin-bottom: 20px;
      opacity: 0.4;
    }

    .quote-text {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-1);
      letter-spacing: -0.01em;
      max-width: 340px;
    }

    .quote-text em {
      font-weight: 600;
      color: var(--accent);
      font-style: normal;
    }

    .quote-attr {
      margin-top: 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .panel-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 64px;
      background: var(--void);
      position: relative;
    }

    .panel-right::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 300px; height: 300px;
      background: radial-gradient(circle at top right, rgba(255,255,255,0.02), transparent 70%);
      pointer-events: none;
    }

    .form-card {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    .form-header {
      margin-bottom: 40px;
      animation: fadeUp 0.6s 0.15s both;
    }

    .form-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-eyebrow::before {
      content: '';
      display: block;
      width: 20px;
      height: 1px;      
      background: var(--accent);
      opacity: 0.4;
    }

    .form-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text-1);
      letter-spacing: -0.02em;
    }

    .form-title strong {
      font-weight: 700;
      color: #fff;
    }

    .form-sub {
      margin-top: 12px;
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--text-3);
      line-height: 1.6;
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeUp 0.6s 0.25s both;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 500;
      text-transform: capitalize;
      color: var(--text-2);
      padding-left: 2px;
      transition: color 0.2s;
    }
    .field:focus-within .field-label { color: var(--accent); }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      pointer-events: none;
      color: var(--text-3);
      transition: color 0.2s;
      display: flex;
      align-items: center;
    }

    .field:focus-within .input-icon { color: var(--accent); }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--surface);
      border: 1px solid var(--border-md);
      border-radius: 8px;
      color: var(--text-1);
      font-family: var(--font-display);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      caret-color: var(--accent);
      letter-spacing: -0.01em;
    }

    input::placeholder { color: var(--text-3); }

    input:focus {
      border-color: rgba(255,255,255,0.25);
      background: var(--raised);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
    }

    input.error-field {
      border-color: rgba(255,85,85,0.35);
      background: var(--error-dim);
    }

    .pw-toggle {
      position: absolute;
      right: 13px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-3);
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
      outline: none;
    }

    .pw-toggle:hover { color: var(--text-1); }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0 8px;
      animation: fadeUp 0.6s 0.3s both;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--text-3);
      user-select: none;
      transition: color 0.2s;
    }

    .remember-label:hover { color: var(--text-2); }

    .remember-label input[type="checkbox"] {
      display: none;
    }

    .checkbox-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid rgba(255,255,255,0.2);      
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
      padding: 0;
      pointer-events: none;
    }

    .remember-label input:checked ~ .checkbox-box {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox-check {
      opacity: 0;
      transition: opacity 0.15s;
      font-size: 12px;
      font-weight: bold;
      color: #000;
    }

    .remember-label input:checked ~ .checkbox-box .checkbox-check {
      opacity: 1;
    }

    .forgot-link {
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--text-3);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s;
    }

    .forgot-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

    .submit-wrap {
      margin-top: 24px;
      animation: fadeUp 0.6s 0.35s both;
    }

    .submit-btn {
      width: 100%;
      padding: 13px 24px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #000;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;      
      letter-spacing: -0.01em;
      text-transform: capitalize;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--accent-lt);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(255,255,255,0.15);
    }

    .submit-btn:active:not(:disabled) { transform: translateY(0); }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 1.5px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .submit-btn.loading .spinner { display: block; }
    .submit-btn.loading .btn-text { opacity: 0.7; }

    .msg-box {
      display: none;
      align-items: flex-start;
      gap: 9px;
      padding: 12px 14px;
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 13px;
      line-height: 1.6;
      margin-top: 16px;
      animation: fadeUp 0.25s ease both;
    }

    .msg-box.error  { background: var(--error-dim); border: 1px solid rgba(255,85,85,0.2); color: var(--error); }
    .msg-box.success{ background: rgba(102, 221, 153, 0.08); border: 1px solid rgba(102, 221, 153, 0.2); color: var(--success); }

    .msg-box.visible { display: flex; }

    .attempt-bar-wrap {
      margin-top: 8px;
      display: none;
    }

    .attempt-bar-wrap.visible { display: block; }

    .attempt-label {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-3);
      margin-bottom: 5px;
    }

    .attempt-bar {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .attempt-fill {
      height: 100%;
      background: var(--error);      
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 20px;
      animation: fadeUp 0.6s 0.4s both;
    }

    .divider span {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--text-3);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .form-footer {
      text-align: center;
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--text-3);
      animation: fadeUp 0.6s 0.45s both;
    }

    .form-footer a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }

    .form-footer a:hover {
      color: var(--accent-lt);
      border-color: var(--accent-lt);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .panel-left { display: none; }
      .panel-right { padding: 32px 24px; }
      .form-card { max-width: 420px; }
    }
  </style>
</head>
<body>

<div class="page">

  <aside class="panel-left">

    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 16 16" fill="none">
          <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/>
          <path d="M6 6L10 10M10 6L6 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-name">Dream Realization</span>
    </div>

    <div class="art-wrap">
      <svg class="art-svg" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="200" cy="200" r="180" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
        <circle cx="200" cy="200" r="140" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
        <circle cx="200" cy="200" r="100" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
        <polygon points="200,30 360,280 40,280" stroke="currentColor" stroke-width="0.6" fill="none" opacity="0.2"/>
        <line x1="40" y1="200" x2="360" y2="200" stroke="currentColor" stroke-width="0.4" opacity="0.15"/>
        <line x1="200" y1="40" x2="200" y2="360" stroke="currentColor" stroke-width="0.4" opacity="0.15"/>
      </svg>
    </div>

    <div class="panel-quote">
      <span class="quote-line"></span>
      <p class="quote-text">
        Every <em>great dream</em> begins with a single step forward.
      </p>
      <p class="quote-attr">Dream Realization Platform</p>
    </div>

  </aside>

  <main class="panel-right">
    <div class="form-card">

      <div class="form-header">
        <p class="form-eyebrow">Secure Access</p>
        <h1 class="form-title">Welcome<br><strong>back</strong></h1>
        <p class="form-sub">Sign in to your account to continue.</p>
      </div>

      <form id="loginForm" novalidate autocomplete="off">

        <div class="fields">
          <div class="field">
            <label class="field-label" for="identifier">Email or Username</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                  <circle cx="7.5" cy="5" r="3" stroke="currentColor" stroke-width="1.2"/>
                  <path d="M1.5 13.5c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
              </span>
              <input type="text" id="identifier" placeholder="you@example.com" required autocomplete="username" spellcheck="false" />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                  <rect x="2.5" y="6.5" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
                  <path d="M5 6.5V4.5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                  <circle cx="7.5" cy="10" r="1" fill="currentColor"/>
                </svg>
              </span>
              <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
              <button type="button" class="pw-toggle" id="pwToggle" title="Show/hide password" tabindex="-1">
                <svg id="eyeIcon" width="15" height="15" viewBox="0 0 15 15" fill="none">
                  <path d="M1 7.5S3.5 3 7.5 3s6.5 4.5 6.5 4.5S13 12 7.5 12 1 7.5 1 7.5z" stroke="currentColor" stroke-width="1.2"/>
                  <circle cx="7.5" cy="7.5" r="2" stroke="currentColor" stroke-width="1.2"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="options-row">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" />
            <span class="checkbox-box">
              <span class="checkbox-check">✓</span>
            </span>
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <div class="submit-wrap">
          <button type="submit" class="submit-btn">
            <span class="btn-text">Sign In</span>
            <span class="spinner"></span>
          </button>
        </div>

        <div id="errorMessage" class="msg-box error">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" style="flex-shrink:0; margin-top: 2px;">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 6v4M10 13.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span id="errorText"></span>
        </div>

        <div id="successMessage" class="msg-box success">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" style="flex-shrink:0; margin-top: 2px;">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 10l3 3 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="successText"></span>
        </div>

        <div class="attempt-bar-wrap" id="attemptBar">
          <div class="attempt-label">
            <span>failed attempts</span>
            <span><span id="attemptCount">0</span>/5</span>
          </div>
          <div class="attempt-bar">
            <div class="attempt-fill" id="attemptFill"></div>
          </div>
        </div>
      </form>

      <div class="form-footer">
        Don't have an account? <a href="index.html">Sign up here</a>
      </div>

    </div>
  </main>

</div>

<script>
    const existingToken = localStorage.getItem('token');
    if (existingToken) {
        window.location.href = "page.html";
    }

    function showError(msg) {
        document.getElementById('errorText').textContent = msg;
        document.getElementById('errorMessage').classList.add('visible');
        document.getElementById('successMessage').classList.remove('visible');
    }

    function showSuccess(msg) {
        document.getElementById('successText').textContent = msg;
        document.getElementById('successMessage').classList.add('visible');
        document.getElementById('errorMessage').classList.remove('visible');
    }

    function hideMessages() {
        document.getElementById('errorMessage').classList.remove('visible');
        document.getElementById('successMessage').classList.remove('visible');
    }

    const pwToggle = document.getElementById('pwToggle');
    const pwInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    pwToggle.addEventListener('click', (e) => {
        e.preventDefault();
        if (pwInput.type === 'password') {
            pwInput.type = 'text';
            eyeIcon.innerHTML = '<path d="M7.5 3C3.5 3 1 7.5 1 7.5S3.5 12 7.5 12s6.5-4.5 6.5-4.5S11.5 3 7.5 3z" stroke="currentColor" stroke-width="1.2"/><circle cx="7.5" cy="7.5" r="1.5" stroke="currentColor" stroke-width="1.2"/>';
        } else {
            pwInput.type = 'password';
            eyeIcon.innerHTML = '<path d="M1 7.5S3.5 3 7.5 3s6.5 4.5 6.5 4.5S13 12 7.5 12 1 7.5 1 7.5z" stroke="currentColor" stroke-width="1.2"/><circle cx="7.5" cy="7.5" r="2" stroke="currentColor" stroke-width="1.2"/>';
        }
    });

    let loginAttempts = 0;

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const identifier = document.getElementById('identifier').value;
        const password = document.getElementById('password').value;
        const submitBtn = document.querySelector('button[type="submit"]');

        hideMessages();

        if (!identifier || !password) {
            showError("Please enter both email/username and password.");
            return;
        }

        if (loginAttempts >= 5) {
            showError("Too many failed attempts. Please try again later.");
            document.getElementById('attemptBar').classList.remove('visible');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.classList.add('loading');

        try {
            const response = await fetch('https://skylineapp-backend-file.onrender.com/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });
            const data = await response.json();

            if (response.ok) {
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    showSuccess("Login successful! Redirecting...");
                    setTimeout(() => {
                        window.location.href = "page.html";
                    }, 1000);
                    loginAttempts = 0;
                    document.getElementById('attemptBar').classList.remove('visible');
                } else {
                    showError("Login failed. Please try again.");
                    loginAttempts++;
                }
            } else {
                showError(data.message || "Invalid credentials. Please try again.");
                loginAttempts++;
                if (loginAttempts > 0) {
                    document.getElementById('attemptBar').classList.add('visible');
                    document.getElementById('attemptCount').textContent = loginAttempts;
                    document.getElementById('attemptFill').style.width = (loginAttempts / 5) * 100 + '%';
                }
            }
        } catch (err) {
            showError("Network error. Is the server running?");
            console.error(err);
        } finally {
            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
        }
    });
</script>

</body>
