<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Success | Skyline AA-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #060608;
      --bg-base: #0b0c0f;
      --bg-surface: #111318;
      --border: rgba(255,255,255,0.06);
      --accent: #c8ff57;
      --text-1: #e8eaf0;
      --text-2: #8c909e;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg-void);
      color: var(--text-1);
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .icon-circle {      width: 80px;
      height: 80px;
      background: rgba(200, 255, 87, 0.1);
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
      color: var(--accent);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-1);
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-2);
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #060608;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-family: var(--font-mono);
      font-size: 13px;
      transition: transform 0.2s, box-shadow 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px var(--accent);
    }

    .status-msg {
      font-family: var(--font-mono);
      font-size: 12px;      margin-top: 20px;
      color: var(--text-2);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="icon-circle">✓</div>
      
      <h1>You're Now Pro! 🚀</h1>
      <p>
        Thank you for supporting Skyline AA-1. Your payment was successful. 
        You now have unlimited access to Simon Squibb’s coaching and advanced features.
      </p>

      <!-- Button redirects to Dashboard -->
      <a href="dashboard.html" class="btn">Go to Dashboard</a>

      <div class="status-msg" id="debugInfo"></div>
    </div>
  </div>

  <script>
    // Optional: Check URL parameters for status (if Flutterwave sends them)
    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get('status');
    
    if (status && status !== 'successful') {
        document.querySelector('h1').innerText = "Payment Status: " + status;
        document.querySelector('h1').style.color = "#ff4d4d";
        document.querySelector('.icon-circle').style.borderColor = "#ff4d4d";
        document.querySelector('.icon-circle').style.color = "#ff4d4d";
        document.querySelector('p').innerText = "There was an issue with your payment. Please try again or contact support.";
    }
  </script>

</body>
</html>
