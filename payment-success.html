<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Success | Skyline AA-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #060608;
      --bg-base: #0b0c0f;
      --bg-surface: #111318;
      --border: rgba(255,255,255,0.06);
      --accent: #c8ff57;
      --text-1: #e8eaf0;
      --text-2: #8c909e;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg-void);
      color: var(--text-1);
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .icon-circle {
      width: 80px;
      height: 80px;
      background: rgba(200, 255, 87, 0.1);
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
      color: var(--accent);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-1);
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-2);
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #060608;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-family: var(--font-mono);
      font-size: 13px;
      transition: transform 0.2s, box-shadow 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px var(--accent);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status-msg {
      font-family: var(--font-mono);
      font-size: 12px;
      margin-top: 20px;
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--bg-void);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      color: #ff4d4d;
    }

    .success {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="icon-circle" id="iconCircle">&#10003;</div>
      
      <h1 id="title">Processing Your Upgrade...</h1>
      <p id="message">
        Please wait while we verify your payment and upgrade your account.
      </p>

      <button id="dashboardBtn" class="btn" style="display: none;">Go to Dashboard</button>
      <button id="retryBtn" class="btn" style="display: none; background: #ff4d4d;">Try Again</button>

      <div class="status-msg" id="debugInfo"></div>
    </div>
  </div>

  <script>
    // Get backend URL from environment or use default
    var BACKEND_URL = 'https://skylineapp-backend-file.onrender.com';
    
    // Get tx_ref and status from URL — these are user-controlled
    var urlParams = new URLSearchParams(window.location.search);
    var tx_ref = urlParams.get('tx_ref');
    var status = urlParams.get('status');
    
    var titleEl = document.getElementById('title');
    var messageEl = document.getElementById('message');
    var dashboardBtn = document.getElementById('dashboardBtn');
    var retryBtn = document.getElementById('retryBtn');
    var debugInfo = document.getElementById('debugInfo');
    var iconCircle = document.getElementById('iconCircle');

    // ✅ FIX #10: Use textContent instead of innerHTML for debug info.
    // tx_ref and status come from URL params (user-controlled).
    // textContent treats everything as plain text — no HTML interpretation.
    var debugLines = [];
    debugLines.push('tx_ref: ' + (tx_ref || 'Not found') + ' | status: ' + (status || 'Not provided'));
    debugInfo.textContent = debugLines.join('\n');
    
    // Helper: append a debug line safely using textContent
    function addDebugLine(line) {
      debugLines.push(line);
      debugInfo.textContent = debugLines.join('\n');
    }

    // Function to verify payment
    async function verifyPayment() {
        if (!tx_ref) {
            console.error('No tx_ref found in URL');
            titleEl.textContent = 'Missing Payment Reference';
            // ✅ FIX #10: Use textContent, not innerHTML
            messageEl.textContent = "We couldn't find your payment reference. Please contact support.";
            addDebugLine('ERROR: No tx_ref parameter in URL');
            dashboardBtn.style.display = 'inline-block';
            dashboardBtn.textContent = 'Return to Dashboard';
            return;
        }
        
        try {
            console.log('Verifying payment for tx_ref: ' + tx_ref);
            addDebugLine('Verifying with backend...');
            
            // ✅ Validate tx_ref format before using in URL — only allow alphanumeric, hyphens, underscores
            var safeTxRef = String(tx_ref).replace(/[^a-zA-Z0-9_-]/g, '');
            if (!safeTxRef || safeTxRef.length === 0) {
              throw new Error('Invalid payment reference format');
            }

            var response = await fetch(BACKEND_URL + '/api/verify-payment/' + encodeURIComponent(safeTxRef), {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                }
            });
            
            var data = await response.json();
            console.log('Verification response:', data);
            addDebugLine('Response received');
            
            if (data.success === true) {
                titleEl.textContent = "You're Now Pro!";
                // ✅ FIX #10: Use textContent, not innerHTML
                messageEl.textContent = 'Thank you for supporting Skyline AA-1. Your payment was successful. You now have unlimited access to advanced features.';
                messageEl.style.color = '';
                dashboardBtn.style.display = 'inline-block';
                dashboardBtn.textContent = 'Go to Dashboard';
                addDebugLine('Payment verified successfully!');
            } else {
                titleEl.textContent = 'Verification Pending';
                // ✅ FIX #10: Use textContent, not innerHTML
                messageEl.textContent = "We're still processing your payment. It may take a few minutes. You can try refreshing this page or contact support if the issue persists.";
                retryBtn.style.display = 'inline-block';
                dashboardBtn.style.display = 'inline-block';
                dashboardBtn.textContent = 'Go to Dashboard Anyway';
                // ✅ FIX #9: data.message could contain anything — use textContent via addDebugLine
                addDebugLine('Verification issue: ' + (data.message || 'Unknown error'));
            }
        } catch (error) {
            console.error('Verification error:', error);
            titleEl.textContent = 'Verification Error';
            // ✅ FIX #9: error.message is exception text — NEVER use innerHTML.
            // Use textContent so it's treated as plain text, not HTML.
            messageEl.textContent = "We couldn't verify your payment. Please contact support or try again.";
            retryBtn.style.display = 'inline-block';
            dashboardBtn.style.display = 'inline-block';
            dashboardBtn.textContent = 'Go to Dashboard Anyway';
            // ✅ FIX #9: error.message rendered via textContent (addDebugLine), not innerHTML
            addDebugLine('Network error: ' + (error.message || 'Unknown'));
        }
    }
    
    // Handle dashboard button click
    dashboardBtn.addEventListener('click', function() {
        window.location.href = 'dashboard.html';
    });
    
    // Handle retry button click
    retryBtn.addEventListener('click', function() {
        titleEl.textContent = 'Processing Your Upgrade...';
        // ✅ FIX #10: Use textContent, not innerHTML
        messageEl.textContent = 'Please wait while we verify your payment and upgrade your account.';
        dashboardBtn.style.display = 'none';
        retryBtn.style.display = 'none';
        debugLines = [];
        debugInfo.textContent = '';
        verifyPayment();
    });
    
    // Check if this is a direct Flutterwave redirect with status
    if (status === 'successful' || status === 'success') {
        addDebugLine('Flutterwave reports successful payment');
        verifyPayment();
    } else if (status && status !== 'successful') {
        // ✅ FIX #10: status is user-controlled from URL — use textContent only
        titleEl.textContent = 'Payment Status: ' + String(status).substring(0, 50);
        titleEl.style.color = '#ff4d4d';
        iconCircle.style.borderColor = '#ff4d4d';
        iconCircle.style.color = '#ff4d4d';
        // ✅ FIX #10: Use textContent, not innerHTML
        messageEl.textContent = 'There was an issue with your payment. Please try again or contact support.';
        dashboardBtn.style.display = 'inline-block';
        dashboardBtn.textContent = 'Return to Dashboard';
        retryBtn.style.display = 'inline-block';
        addDebugLine('Payment status: ' + String(status).substring(0, 100));
    } else if (tx_ref) {
        verifyPayment();
    } else {
        titleEl.textContent = 'Payment Success?';
        // ✅ FIX #10: Use textContent, not innerHTML
        messageEl.textContent = "You've reached this page but we don't have payment details. If you just completed a payment, please contact support.";
        dashboardBtn.style.display = 'inline-block';
        dashboardBtn.textContent = 'Go to Dashboard';
        addDebugLine('No payment reference found in URL');
    }
  </script>

</body>
</html>
