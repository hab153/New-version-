<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dream Realization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:           #080c14;
            --card:         #0d1220;
            --card-border:  rgba(99,179,237,0.12);
            --input-bg:     #111827;
            --input-border: rgba(255,255,255,0.08);
            --input-focus:  #3b82f6;
            --accent:       #3b82f6;
            --text:         #e2e8f0;
            --muted:        rgba(226,232,240,0.45);
            --error:        #fc8181;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 70% 50% at 50% -10%, rgba(59,130,246,0.15) 0%, transparent 65%),
                radial-gradient(ellipse 40% 40% at 90% 90%, rgba(99,102,241,0.08) 0%, transparent 60%);
            color: var(--text);
            font-family: 'Sora', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            background: var(--card);
            border: 1px solid var(--card-border);
            padding: 44px 40px 40px;
            border-radius: 16px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03),
                0 24px 60px rgba(0,0,0,0.6),
                0 0 80px rgba(59,130,246,0.06);
            width: 100%;
            max-width: 420px;
            animation: rise 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 8px;
            display: grid; place-items: center;
        }
        .logo-icon svg { width: 16px; height: 16px; }
        .logo-name {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: #fff;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        .sub {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 28px;
        }

        .field { margin-bottom: 14px; }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: rgba(226,232,240,0.6);
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }

        .field input[type="text"],
        .field input[type="email"],
        .field input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        .field input::placeholder { color: rgba(226,232,240,0.2); }
        .field input:focus {
            border-color: var(--input-focus);
            background: rgba(59,130,246,0.05);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .privacy-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
            color: var(--muted);
            margin: 18px 0 20px;
            line-height: 1.5;
        }
        .privacy-check input[type="checkbox"] {
            appearance: none;
            width: 17px; height: 17px;
            flex-shrink: 0;
            margin-top: 1px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            background: var(--input-bg);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            position: relative;
        }
        .privacy-check input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .privacy-check input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px; top: 1px;
            width: 5px; height: 9px;
            border: 1.5px solid #fff;
            border-top: none; border-left: none;
            transform: rotate(45deg);
        }
        .privacy-check a { color: var(--accent); text-decoration: none; }
        .privacy-check a:hover { text-decoration: underline; }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 18px rgba(59,130,246,0.35);
        }
        button[type="submit"]:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(59,130,246,0.45);
        }
        button[type="submit"]:active { transform: translateY(0); }
        button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .error {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(252,129,129,0.08);
            border: 1px solid rgba(252,129,129,0.25);
            border-radius: 7px;
            color: var(--error);
            font-size: 13px;
            padding: 10px 12px;
            margin-top: 14px;
            line-height: 1.4;
        }
        .error.show { display: flex; }

        .link {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }
        .link a { color: var(--accent); text-decoration: none; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-row">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
        </div>
        <span class="logo-name">Dream Realization</span>
    </div>

    <h2>Create Account</h2>
    <p class="sub">Start your journey today — it's free</p>

    <form id="signupForm">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="yourhandle" required>
        </div>
        <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password (Min 8 chars)" minlength="8" required>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        </div>

        <div class="privacy-check">
            <input type="checkbox" id="privacyPolicy" required>
            <label for="privacyPolicy">I agree to the <a href="Privacy.html" target="_blank">Privacy Policy</a></label>
        </div>

        <button type="submit">Sign Up</button>

        <div id="errorMessage" class="error">
            <svg width="15" height="15" viewBox="0 0 20 20" fill="none" style="flex-shrink:0">
                <circle cx="10" cy="10" r="8" stroke="#fc8181" stroke-width="1.5"/>
                <path d="M10 6v4M10 13.5v.5" stroke="#fc8181" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span id="errorText"></span>
        </div>
    </form>

    <div class="link">
        Already have an account? <a href="login.html">Login here</a>
    </div>
</div>

<script>
    // --- AUTO-REDIRECT LOGIC ---
    const existingToken = localStorage.getItem('token');
    if (existingToken) {
        window.location.href = "page.html";
    }
    // ---------------------------

    function showError(msg) {
        document.getElementById('errorText').textContent = msg;
        document.getElementById('errorMessage').classList.add('show');
    }
    function hideError() {
        document.getElementById('errorMessage').classList.remove('show');
    }

    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username        = document.getElementById('username').value;
        const email           = document.getElementById('email').value;
        const password        = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const submitBtn       = document.querySelector('button[type="submit"]');

        hideError();

        if (password !== confirmPassword) {
            showError("Passwords do not match.");
            return;
        }

        submitBtn.disabled    = true;
        submitBtn.textContent = "Creating Account...";

        try {
            const response = await fetch('https://skylineapp-backend-file.onrender.com/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const data = await response.json();

            if (response.ok) {
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    window.location.href = "page.html";
                } else {
                    alert("Account created successfully! Please login.");
                    window.location.href = "login.html";
                }
            } else {
                showError(data.message || "Signup failed.");
            }
        } catch (err) {
            showError("Network error. Is the server running?");
        } finally {
            submitBtn.disabled    = false;
            submitBtn.textContent = "Sign Up";
        }
    });
</script>

</body>
</html>
