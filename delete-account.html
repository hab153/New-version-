<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete Account | Skyline AA-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg-void: #060608; --bg-base: #0b0c0f; --bg-surface: #111318; --accent: #c8ff57; --danger: #ff4d4d; --text-1: #e8eaf0; --text-2: #8c909e; --font-mono: 'IBM Plex Mono', monospace; --font-sans: 'Syne', sans-serif; }
    body { background: var(--bg-void); color: var(--text-1); font-family: var(--font-sans); margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    
    .container { max-width: 450px; width: 100%; padding: 40px; background: var(--bg-surface); border-radius: 16px; border: 1px solid rgba(255,77,77,0.2); text-align: center; }
    
    h1 { color: var(--danger); font-size: 24px; margin-bottom: 10px; }
    p { color: var(--text-2); font-size: 14px; line-height: 1.6; margin-bottom: 30px; }
    
    .warning-box { background: rgba(255,77,77,0.05); border: 1px solid rgba(255,77,77,0.2); padding: 15px; border-radius: 8px; margin-bottom: 25px; text-align: left; }
    .warning-box li { font-size: 13px; color: var(--text-2); margin-bottom: 8px; list-style-position: inside; }

    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--text-2); margin-bottom: 8px; text-transform: uppercase; }
    input { width: 100%; background: var(--bg-void); border: 1px solid rgba(255,255,255,0.1); color: var(--text-1); padding: 12px; border-radius: 8px; box-sizing: border-box; }
    input:focus { outline: none; border-color: var(--danger); }

    .delete-btn { background: var(--danger); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; transition: opacity 0.2s; }
    .delete-btn:hover { opacity: 0.9; }
    
    .back-link { display: block; margin-top: 20px; color: var(--text-2); text-decoration: none; font-size: 13px; }
    .back-link:hover { color: var(--text-1); }
    
    .status-msg { margin-top: 15px; font-size: 13px; font-family: var(--font-mono); min-height: 20px; }
    .error { color: var(--danger); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Delete Account</h1>
    <p>This action is permanent and cannot be undone.</p>
    
    <div class="warning-box">
      <ul>
        <li>All your dreams and chat history will be erased.</li>
        <li>Your profile information will be removed.</li>
        <li>You will be logged out immediately.</li>
      </ul>
    </div>

    <form id="deleteForm">      <div class="form-group">
        <label>Enter Password to Confirm</label>
        <input type="password" id="password" placeholder="Your current password" required>
      </div>

      <button type="submit" class="delete-btn">Permanently Delete Account</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>

    <a href="dashboard.html" class="back-link">Cancel and go back</a>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = "login.html";

    document.getElementById('deleteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById('statusMsg');
      const password = document.getElementById('password').value;
      
      if(!confirm("Are you absolutely sure? This cannot be undone.")) return;

      statusMsg.textContent = "Processing...";
      statusMsg.className = "status-msg";

      try {
        const res = await fetch('https://skylineapp-backend-file.onrender.com/api/users/me', {
          method: 'DELETE',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ password })
        });

        const data = await res.json();

        if (res.ok) {
          statusMsg.textContent = "Account deleted. Redirecting...";
          localStorage.removeItem('token');
          setTimeout(() => {
            window.location.href = "login.html";
          }, 2000);
        } else {
          statusMsg.textContent = data.message;
          statusMsg.className = "status-msg error";
        }
      } catch (err) {
        statusMsg.textContent = "Network Error.";        statusMsg.className = "status-msg error";
      }
    });
  </script>
</body>
</html>
