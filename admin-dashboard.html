<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Skyline AA-1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #030305;
      --bg-base: #080a0d;
      --bg-surface: #0e1014;
      --bg-elevated: #13161c;
      --accent: #c8ff57;
      --accent-dim: rgba(200, 255, 87, 0.08);
      --accent-border: rgba(200, 255, 87, 0.2);
      --text-1: #dde1ed;
      --text-2: #6a6f82;
      --text-3: #3e4252;
      --danger: #ff4d4d;
      --danger-dim: rgba(255, 77, 77, 0.08);
      --border-lo: rgba(255,255,255,0.04);
      --border-mid: rgba(255,255,255,0.07);
      --border-hi: rgba(255,255,255,0.11);
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'Syne', sans-serif;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scrollbar-width: thin; scrollbar-color: var(--border-hi) transparent; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

    body {
      background: var(--bg-void);
      color: var(--text-1);
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(200,255,87,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 100% 80%, rgba(200,255,87,0.02) 0%, transparent 60%);
    }
    /* ── TOPBAR ─────────────────────────────────────── */
    .topbar {
      height: 56px;
      background: rgba(8, 10, 13, 0.85);
      border-bottom: 1px solid var(--border-mid);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .topbar-left { display: flex; align-items: center; gap: 16px; }

    .brand-badge {
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-sm);
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .brand {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .topbar-right { display: flex; align-items: center; gap: 12px; }

    .status-dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .menu-btn {
      background: none;
      border: 1px solid var(--border-mid);
      color: var(--text-2);
      font-size: 18px;
      cursor: pointer;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      line-height: 1;
    }
    .menu-btn:hover { border-color: var(--border-hi); color: var(--text-1); background: var(--border-lo); }

    /* ── DROPDOWN ────────────────────────────────────── */
    .dropdown {
      position: absolute;
      top: 64px;
      right: 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius-md);
      display: none;
      flex-direction: column;
      min-width: 160px;
      z-index: 100;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 0 1px var(--border-lo);
      overflow: hidden;
      animation: dropIn 0.15s ease;
    }
    .dropdown.open { display: flex; }

    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-divider { height: 1px; background: var(--border-lo); margin: 4px 0; }

    .dropdown a {
      padding: 11px 14px;
      color: var(--text-1);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;      gap: 10px;
      transition: background 0.1s ease;
    }
    .dropdown a:hover { background: var(--border-lo); }
    .dropdown a.danger { color: var(--danger); }
    .dropdown a .dd-icon { font-size: 14px; opacity: 0.7; }

    /* ── CONTAINER ───────────────────────────────────── */
    .container { max-width: 1060px; margin: 0 auto; padding: 36px 24px 60px; }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .page-title-block {}
    .page-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-3);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      color: var(--text-1);
      letter-spacing: -0.01em;
    }

    .user-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-2);
      background: var(--bg-elevated);
      border: 1px solid var(--border-mid);
      border-radius: 20px;
      padding: 4px 12px;
    }

    /* ── TABLE ──────────────────────────────────────── */
    .table-wrap {
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-lg);      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    thead tr {
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-mid);
    }

    th {
      padding: 13px 18px;
      text-align: left;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-3);
    }

    tbody tr {
      border-bottom: 1px solid var(--border-lo);
      transition: background 0.12s ease;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }

    td {
      padding: 15px 18px;
      font-size: 13.5px;
      color: var(--text-1);
      vertical-align: middle;
    }

    td.email { font-family: var(--font-mono); font-size: 12px; color: var(--text-2); }

    /* ── BADGES ──────────────────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }    .status-badge::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .active {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }
    .active::before { background: var(--accent); box-shadow: 0 0 4px var(--accent); }

    .suspended {
      background: var(--danger-dim);
      color: var(--danger);
      border: 1px solid rgba(255,77,77,0.2);
    }
    .suspended::before { background: var(--danger); }

    /* ── ACTION BUTTONS ──────────────────────────────── */
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border-hi);
      color: var(--text-2);
      padding: 5px 11px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.04em;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .action-btn:hover { border-color: var(--text-2); color: var(--text-1); background: var(--border-lo); }

    .btn-view { border-color: var(--accent-border); color: var(--accent); }
    .btn-view:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

    .btn-msg { border-color: rgba(100, 150, 255, 0.3); color: #6496ff; }
    .btn-msg:hover { background: rgba(100, 150, 255, 0.1); border-color: #6496ff; }

    .btn-suspend { border-color: rgba(255,170,0,0.25); color: #ffaa00; }
    .btn-suspend:hover { background: rgba(255,170,0,0.08); border-color: rgba(255,170,0,0.5); }

    .btn-unsuspend { border-color: rgba(0,210,120,0.25); color: #00d278; }    .btn-unsuspend:hover { background: rgba(0,210,120,0.08); border-color: rgba(0,210,120,0.5); }

    .btn-delete { border-color: rgba(255,77,77,0.25); color: var(--danger); }
    .btn-delete:hover { background: var(--danger-dim); border-color: var(--danger); }

    /* ── EMPTY / LOADING ─────────────────────────────── */
    .table-empty {
      text-align: center;
      padding: 48px 20px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-3);
    }

    /* ── MODALS ──────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; }

    .modal-content {
      background: var(--bg-surface);
      width: 92%;
      max-width: 820px;
      max-height: 82vh;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-hi);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.8);
      animation: modalIn 0.2s cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 18px 22px;      border-bottom: 1px solid var(--border-mid);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-base);
    }

    .modal-title { display: flex; align-items: center; gap: 10px; }
    .modal-title h2 { margin: 0; font-size: 16px; font-weight: 600; }

    .report-count-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-mid);
      border-radius: 20px;
      padding: 2px 8px;
      color: var(--text-2);
    }

    .close-modal {
      background: none;
      border: 1px solid var(--border-mid);
      color: var(--text-2);
      font-size: 16px;
      cursor: pointer;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
      line-height: 1;
    }
    .close-modal:hover { border-color: var(--border-hi); color: var(--text-1); background: var(--border-lo); }

    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

    /* ── REPORT ITEMS ────────────────────────────────── */
    .report-item {
      background: var(--bg-void);
      padding: 16px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      border: 1px solid var(--border-lo);
      border-left: 2px solid var(--accent);
      transition: border-color 0.15s ease;
    }
    .report-item:hover { border-color: var(--accent-border); border-left-color: var(--accent); }
    .report-item:last-child { margin-bottom: 0; }

    .report-header {      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 12px;
    }

    .report-subject { font-weight: 600; font-size: 13px; color: var(--text-1); }
    .report-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .report-user {
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-sm);
      padding: 2px 7px;
    }
    .report-date { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
    .report-msg { font-size: 13px; line-height: 1.6; color: var(--text-2); white-space: pre-wrap; }

    /* ── SEND MESSAGE MODAL STYLES ───────────────────── */
    .msg-input-area {
      width: 100%;
      background: var(--bg-void);
      border: 1px solid var(--border-mid);
      color: var(--text-1);
      padding: 12px;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 14px;
      resize: vertical;
      min-height: 100px;
      margin-bottom: 15px;
    }
    .msg-input-area:focus { outline: none; border-color: var(--accent); }
    
    .send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-weight: bold;
      cursor: pointer;
      font-family: var(--font-mono);
      text-transform: uppercase;
      font-size: 12px;
    }
    .send-btn:hover { opacity: 0.9; }
    /* ── RESPONSIVE ──────────────────────────────────── */
    @media (max-width: 640px) {
      .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      th:nth-child(2), td:nth-child(2) { display: none; }
      .action-btn { padding: 5px 8px; }
      .topbar { padding: 0 16px; }
      .container { padding: 24px 16px 48px; }
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-badge">AA-1</div>
      <div class="brand">Skyline Admin</div>
    </div>
    <div class="topbar-right">
      <div class="status-dot" title="System online"></div>
      <button class="menu-btn" onclick="toggleDropdown()" title="Menu">&#8942;</button>
      <div class="dropdown" id="dd">
        <a href="admin-settings.html"><span class="dd-icon">⚙</span> Settings</a>
        <a href="#" onclick="loadReports(); return false;"><span class="dd-icon">&#9873;</span> View Reports</a>
        <div class="dropdown-divider"></div>
        <a href="#" onclick="logout(); return false;" class="danger"><span class="dd-icon">&#8594;</span> Sign Out</a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <div class="container">
    <div class="page-header">
      <div class="page-title-block">
        <div class="page-eyebrow">Management Console</div>
        <h1>Users</h1>
      </div>
      <span class="user-count" id="userCount">— users</span>
    </div>

    <div class="table-wrap">
      <table id="userTable">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>        </thead>
        <tbody id="userList">
          <tr><td colspan="4" class="table-empty">Loading users…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- REPORTS MODAL -->
  <div class="modal-overlay" id="reportModal" onclick="handleModalClick(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">
          <h2>User Reports</h2>
          <span class="report-count-badge" id="reportCountBadge">—</span>
        </div>
        <button class="close-modal" onclick="closeModal('reportModal')" title="Close">&times;</button>
      </div>
      <div class="modal-body" id="reportList">
        <p style="text-align:center; color:var(--text-3); font-family:var(--font-mono); font-size:13px;">Loading…</p>
      </div>
    </div>
  </div>

  <!-- SEND MESSAGE MODAL -->
  <div class="modal-overlay" id="msgModal" onclick="handleModalClick(event)">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <div class="modal-title">
          <h2>Send Message</h2>
        </div>
        <button class="close-modal" onclick="closeModal('msgModal')" title="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-top:0; color:var(--text-2); font-size:13px;">Sending to: <strong id="msgTargetUser" style="color:var(--accent)">...</strong></p>
        <textarea id="msgContent" class="msg-input-area" placeholder="Type your warning, advice, or support message here..."></textarea>
        <div style="display:flex; justify-content:flex-end;">
          <button class="send-btn" onclick="submitMessage()">Send Message</button>
        </div>
        <div id="msgStatus" style="margin-top:10px; font-size:12px; font-family:var(--font-mono); text-align:right;"></div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    let currentMsgUserId = null;
    // ── Dropdown ─────────────────────────────────────
    function toggleDropdown() {
      document.getElementById('dd').classList.toggle('open');
    }
    document.addEventListener('click', e => {
      const dd = document.getElementById('dd');
      if (!dd.contains(e.target) && !e.target.closest('.menu-btn')) {
        dd.classList.remove('open');
      }
    });

    // ── Load Users ────────────────────────────────────
    async function loadUsers() {
      const tbody = document.getElementById('userList');
      tbody.innerHTML = `<tr><td colspan="4" class="table-empty">Loading users…</td></tr>`;
      try {
        const res = await fetch('https://skylineapp-backend-file.onrender.com/api/admin/users', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Unauthorized or server error');
        const users = await res.json();
        tbody.innerHTML = '';

        document.getElementById('userCount').textContent = `${users.length} user${users.length !== 1 ? 's' : ''}`;

        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="table-empty">No users found.</td></tr>`;
          return;
        }

        users.forEach(user => {
          const row = document.createElement('tr');
          const isActive = !user.isSuspended;
          const suspendLabel = user.isSuspended ? 'Unsuspend' : 'Suspend';
          const suspendClass = user.isSuspended ? 'btn-unsuspend' : 'btn-suspend';
          row.innerHTML = `
            <td><strong>${escHtml(user.username)}</strong></td>
            <td class="email">${escHtml(user.email)}</td>
            <td>
              <span class="status-badge ${isActive ? 'active' : 'suspended'}">
                ${isActive ? 'Active' : 'Suspended'}
              </span>
            </td>
            <td>
              <div class="actions">
                <button class="action-btn btn-view" onclick="openGodMode('${user._id}')">View Chat</button>
                <button class="action-btn btn-msg" onclick="openMsgModal('${user._id}', '${escHtml(user.username)}')">Message</button>
                <button class="action-btn ${suspendClass}" onclick="toggleSuspend('${user._id}', ${user.isSuspended})">${suspendLabel}</button>
                <button class="action-btn btn-delete" onclick="deleteUser('${user._id}')">Delete</button>
              </div>            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="table-empty" style="color:var(--danger)">Error: ${escHtml(err.message)}</td></tr>`;
      }
    }

    function openGodMode(userId) {
      window.open(`admin-view-chat.html?uid=${userId}`, '_blank');
    }

    // ── Send Message Logic ────────────────────────────
    function openMsgModal(userId, username) {
      currentMsgUserId = userId;
      document.getElementById('msgTargetUser').textContent = username;
      document.getElementById('msgContent').value = '';
      document.getElementById('msgStatus').textContent = '';
      document.getElementById('msgModal').classList.add('open');
    }

    async function submitMessage() {
      const content = document.getElementById('msgContent').value.trim();
      const statusDiv = document.getElementById('msgStatus');
      
      if (!content) {
        statusDiv.textContent = "Message cannot be empty.";
        statusDiv.style.color = "var(--danger)";
        return;
      }

      statusDiv.textContent = "Sending...";
      statusDiv.style.color = "var(--text-2)";

      try {
        const res = await fetch(`https://skylineapp-backend-file.onrender.com/api/admin/users/${currentMsgUserId}/message`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ messageContent: content })
        });

        if (res.ok) {
          statusDiv.textContent = "Sent successfully!";
          statusDiv.style.color = "var(--accent)";
          setTimeout(() => closeModal('msgModal'), 1000);
        } else {          throw new Error("Failed");
        }
      } catch (err) {
        statusDiv.textContent = "Error sending message.";
        statusDiv.style.color = "var(--danger)";
      }
    }

    // ── Suspend/Delete Logic ──────────────────────────
    async function toggleSuspend(id, isSuspended) {
      if (!confirm(`${isSuspended ? 'Unsuspend' : 'Suspend'} this user?`)) return;
      try {
        const res = await fetch(`https://skylineapp-backend-file.onrender.com/api/admin/users/${id}/suspend`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Request failed');
        loadUsers();
      } catch { alert('Failed to update user status.'); }
    }

    async function deleteUser(id) {
      if (!confirm('Permanently delete this user? This cannot be undone.')) return;
      try {
        const res = await fetch(`https://skylineapp-backend-file.onrender.com/api/admin/users/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Request failed');
        loadUsers();
      } catch { alert('Failed to delete user.'); }
    }

    // ── Reports Modal ─────────────────────────────────
    async function loadReports() {
      document.getElementById('dd').classList.remove('open');
      const modal = document.getElementById('reportModal');
      const list = document.getElementById('reportList');
      const badge = document.getElementById('reportCountBadge');
      modal.classList.add('open');
      list.innerHTML = `<p style="text-align:center; color:var(--text-3); font-family:var(--font-mono); font-size:13px; padding:32px 0;">Loading…</p>`;
      badge.textContent = '—';

      try {
        const res = await fetch('https://skylineapp-backend-file.onrender.com/api/admin/reports', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Failed to load');
        const reports = await res.json();
        badge.textContent = `${reports.length}`;
        if (reports.length === 0) {
          list.innerHTML = `<p style="text-align:center; color:var(--text-3); font-family:var(--font-mono); font-size:13px; padding:32px 0;">No reports found.</p>`;
          return;
        }

        list.innerHTML = '';
        reports.forEach(r => {
          const date = new Date(r.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          const div = document.createElement('div');
          div.className = 'report-item';
          div.innerHTML = `
            <div class="report-header">
              <span class="report-subject">${escHtml(r.subject)}</span>
              <div class="report-meta">
                <span class="report-user">${escHtml(r.username)}</span>
                <span class="report-date">${date}</span>
              </div>
            </div>
            <div class="report-msg">${escHtml(r.message)}</div>
          `;
          list.appendChild(div);
        });
      } catch {
        list.innerHTML = `<p style="text-align:center; color:var(--danger); font-family:var(--font-mono); font-size:13px; padding:32px 0;">Failed to load reports.</p>`;
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('open');
    }

    function handleModalClick(e) {
      if (e.target === e.currentTarget) {
        e.target.classList.remove('open');
      }
    }

    // ── Utilities ─────────────────────────────────────
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'login.html';    }

    // ── Init ─────────────────────────────────────────
    loadUsers();
  </script>
</body>
</html>
