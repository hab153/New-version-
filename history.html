<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Skyline AA-1 · Session Archive</title>
  
  <!-- Fonts: Inter for UI, JetBrains Mono for Data -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ──────────────────────────────────
       DESIGN TOKENS (MATCHING PAGE.HTML)
    ────────────────────────────────── */
    :root {
      --bg-deep: #050505;
      --bg-surface: #0a0a0a;
      --bg-glass: rgba(20, 20, 20, 0.6);
      --bg-glass-hover: rgba(30, 30, 30, 0.7);
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(255, 255, 255, 0.15);
      
      --accent-primary: #ffffff;
      --accent-secondary: #a1a1aa;
      
      --font-ui: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      
      --nav-height: 60px;
      --header-height: 50px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    body {
      background-color: var(--bg-deep);
      color: var(--accent-primary);
      font-family: var(--font-ui);
      font-size: 14px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;      overflow: hidden;
    }

    /* Ambient Background Glow */
    body::before {
      content: '';
      position: absolute;
      top: -20%; left: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ──────────────────────────────────
       HEADER (IDENTICAL TO PAGE.HTML)
    ────────────────────────────────── */
    .app-header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 20;
      flex-shrink: 0;
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-logo svg { width: 18px; height: 18px; color: var(--accent-primary); }

    /* ──────────────────────────────────
       MAIN CONTENT AREA
    ────────────────────────────────── */
    .archive-stage {
      flex: 1;
      overflow-y: auto;
      padding: 32px 16px 100px;
      position: relative;      z-index: 1;
    }
    .archive-stage::-webkit-scrollbar { width: 4px; }
    .archive-stage::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 2px; }

    .archive-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .section-header {
      margin-bottom: 32px;
    }
    .section-title {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .section-sub {
      color: var(--accent-secondary);
      font-size: 14px;
    }

    /* Command Search Bar */
    .search-shell {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 4px;
      display: flex;
      align-items: center;
      margin-bottom: 32px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-shell:focus-within {
      border-color: var(--border-active);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.02);
    }
    .search-icon {
      padding: 0 12px;
      color: var(--accent-secondary);
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--accent-primary);
      padding: 12px 0;
      font-family: var(--font-ui);      font-size: 14px;
      outline: none;
    }
    .search-input::placeholder { color: var(--accent-secondary); opacity: 0.5; }

    /* Session Grid */
    .session-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .session-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .session-card:hover {
      background: var(--bg-glass-hover);
      border-color: var(--border-active);
      transform: translateY(-2px);
    }
    
    .card-content { flex: 1; min-width: 0; }
    .card-title {
      font-weight: 500;
      font-size: 15px;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-secondary);
      display: flex;
      gap: 12px;
    }
    
    .card-arrow {      color: var(--accent-secondary);
      transition: transform 0.2s;
    }
    .session-card:hover .card-arrow {
      color: var(--accent-primary);
      transform: translateX(4px);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--accent-secondary);
    }
    .empty-icon {
      width: 48px; height: 48px;
      margin: 0 auto 16px;
      border: 1px solid var(--border-subtle);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    /* ──────────────────────────────────
       BOTTOM NAV (IDENTICAL TO PAGE.HTML)
    ────────────────────────────────── */
    .bottom-nav {
      height: var(--nav-height);
      background: var(--bg-deep);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
      z-index: 20;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    .nav-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--accent-secondary);
      text-decoration: none;
      transition: color 0.2s;
      position: relative;    }
    .nav-item.active { color: var(--accent-primary); }
    .nav-item.active::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 40px; height: 2px;
      background: var(--accent-primary);
      box-shadow: 0 0 10px var(--accent-primary);
    }
    .nav-item svg { width: 20px; height: 20px; }

    @media (min-width: 768px) {
      .archive-stage { padding: 48px 24px 120px; }
      .session-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-group">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Skyline
      </div>
    </div>
  </header>

  <!-- Main Stage -->
  <div class="archive-stage">
    <div class="archive-container">
      
      <div class="section-header">
        <h1 class="section-title">Session Archive</h1>
        <p class="section-sub">Access your historical prospecting data and outreach logs.</p>
      </div>

      <!-- Search Command -->
      <div class="search-shell">
        <div class="search-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="Search by company or title..." autocomplete="off">
      </div>

      <!-- Session List -->
      <div class="session-grid" id="sessionGrid">
        <div class="empty-state">          <div class="empty-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <p>Loading archive...</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="page.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="history.html" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </a>
    <a href="notifications.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </a>
    <a href="dashboard.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    </a>
  </nav>

  <script>
    const BACKEND = 'https://skylineapp-backend-file.onrender.com';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    let allSessions = [];

    document.addEventListener('DOMContentLoaded', loadSessions);

    async function loadSessions() {
      try {
        const res = await fetch(`${BACKEND}/api/sessions`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error('Failed to load sessions');

        allSessions = await res.json();
        renderSessions(allSessions);

        // Search Logic
        document.getElementById('searchInput').addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase();
          const filtered = allSessions.filter(s =>             s.title.toLowerCase().includes(query) || 
            (s.company && s.company.toLowerCase().includes(query))
          );
          renderSessions(filtered);
        });

      } catch (err) {
        console.error(err);
        document.getElementById('sessionGrid').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon" style="border-color: var(--status-error)">!</div>
            <p>Failed to connect to archive.</p>
          </div>`;
      }
    }

    function renderSessions(sessions) {
      const grid = document.getElementById('sessionGrid');
      grid.innerHTML = '';

      if (sessions.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <p>No sessions found.</p>
          </div>`;
        return;
      }

      sessions.forEach(session => {
        const date = new Date(session.lastUpdated).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const card = document.createElement('a');
        card.className = 'session-card';
        card.href = `page.html?session=${session._id}`;
        card.innerHTML = `
          <div class="card-content">
            <div class="card-title">${escapeHTML(session.title)}</div>
            <div class="card-meta">
              <span>${date}</span>
              <span>•</span>
              <span>${session.messageCount || 0} messages</span>
            </div>
          </div>
          <div class="card-arrow">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        `;
        grid.appendChild(card);      });
    }

    function escapeHTML(str) {
      return String(str).replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
    }
  </script>
</body>
  </html>
