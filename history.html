<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>History | Skyline AA-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ── Reset & Base ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #060608;
            color: #e8eaf0;
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* ── Container ── */
        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 16px;
            width: 100%;
            flex: 1;
        }
        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .back-link {
            color: #8c909e;
            text-decoration: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #c8ff57; }
        h1 { font-size: 28px; font-weight: 600; margin-bottom: 4px; }
        .sub { color: #8c909e; font-size: 14px; margin-bottom: 24px; }
        /* ── Search ── */
        .search-wrap { margin-bottom: 20px; }
        .search-shell {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #111318;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 0 14px;
            transition: border-color 0.2s;
        }
        .search-shell:focus-within { border-color: rgba(255,255,255,0.2); }
        .search-shell input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e8eaf0;
            padding: 12px 0;
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            outline: none;
        }
        .search-shell input::placeholder { color: #52566a; }
        .search-shell .count {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: #52566a;
            white-space: nowrap;
        }
        /* ── Session List ── */
        .session-list { display: flex; flex-direction: column; gap: 8px; }
        .session-item {
            background: #111318;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .session-item:hover { border-color: rgba(255,255,255,0.12); }
        .session-item.pinned { border-color: rgba(200,255,87,0.2); }
        /* ── Session Header ── */
        .session-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            gap: 12px;
        }
        .session-name {
            font-weight: 500;
            font-size: 15px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .session-name .pin-icon {
            color: #c8ff57;
            margin-right: 6px;
        }
        .session-meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: #8c909e;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .session-meta .count {
            background: rgba(255,255,255,0.05);
            padding: 2px 10px;
            border-radius: 12px;
        }
        .session-arrow {
            color: #52566a;
            transition: transform 0.25s ease;
            font-size: 14px;
            flex-shrink: 0;
        }
        .session-item.expanded .session-arrow { transform: rotate(180deg); }
        /* ── Session Messages ── */
        .session-messages {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .session-item.expanded .session-messages { max-height: 3000px; }
        .session-messages-inner {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* ── Message Bubbles ── */
        .msg-bubble {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 88%;
            word-break: break-word;
        }
        .msg-bubble.user {
            background: #242424;
            border: 1px solid rgba(255,255,255,0.06);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg-bubble.ai {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.04);
            border-left: 2px solid rgba(200,255,87,0.3);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #ccc7bb;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
        }
        .msg-bubble .msg-role {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 2px;
        }
        .msg-bubble .msg-content { white-space: pre-wrap; }
        .msg-bubble .msg-time {
            font-size: 10px;
            color: #52566a;
            margin-top: 4px;
            font-family: 'IBM Plex Mono', monospace;
        }
        /* ── Empty States ── */
        .empty-state {
            text-align: center;
            color: #52566a;
            padding: 60px 20px;
            font-size: 14px;
            line-height: 1.8;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; display: block; }
        .loading-spinner {
            text-align: center;
            color: #52566a;
            padding: 40px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
        }
        .no-messages {
            color: #52566a;
            font-size: 13px;
            text-align: center;
            padding: 12px 0;
            font-family: 'IBM Plex Mono', monospace;
        }
        .error-msg {
            color: #ff4d4d;
            font-size: 13px;
            text-align: center;
            padding: 12px 0;
            font-family: 'IBM Plex Mono', monospace;
        }
        /* ── Context Menu ── */
        #contextMenu {
            display: none;
            position: fixed;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 6px 0;
            z-index: 1000;
            min-width: 160px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        #contextMenu .ctx-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 18px;
            background: transparent;
            border: none;
            color: #b0b0b0;
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            text-align: left;
        }
        #contextMenu .ctx-btn:hover {
            background: rgba(255,255,255,0.05);
            color: #f5f5f5;
        }
        #contextMenu .ctx-btn.danger { color: #ff5555; }
        #contextMenu .ctx-btn.danger:hover { background: rgba(255,85,85,0.1); }
        #contextMenu .ctx-divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 4px 12px;
        }
        /* ── Rename Modal ── */
        #renameModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        #renameModal.active { display: flex; }
        .modal-box {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 28px;
            max-width: 400px;
            width: 90%;
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box h3 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .modal-box .modal-sub {
            color: #8c909e;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .modal-box input {
            width: 100%;
            background: #242424;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 11px 14px;
            color: #f5f5f5;
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }
        .modal-box input:focus { border-color: rgba(255,255,255,0.2); }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 8px 20px;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .modal-actions .btn-cancel {
            background: #242424;
            color: #b0b0b0;
        }
        .modal-actions .btn-cancel:hover { background: #2d2d2d; color: #f5f5f5; }
        .modal-actions .btn-save {
            background: #c8ff57;
            color: #060608;
        }
        .modal-actions .btn-save:hover { background: #d4ff70; }
        /* ── Responsive ── */
        @media (max-width: 600px) {
            .container { padding: 12px; }
            .session-header { padding: 12px 16px; flex-wrap: wrap; gap: 6px; }
            .session-name { font-size: 14px; }
            .session-meta { font-size: 10px; gap: 8px; }
            .msg-bubble { max-width: 94%; font-size: 13px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <a href="page.html" class="back-link">← Back</a>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#52566a;">v2</span>
    </div>
    <h1>📋 Session History</h1>
    <p class="sub">Your saved conversations and lead searches</p>

    <!-- Search -->
    <div class="search-wrap">
        <div class="search-shell">
            <input type="text" id="searchInput" placeholder="Search sessions…" />
            <span class="count" id="countBadge">—</span>
        </div>
    </div>

    <!-- Session List -->
    <div id="sessionList" class="session-list">
        <div class="loading-spinner">Loading sessions…</div>
    </div>
</div>

<!-- Context Menu -->
<div id="contextMenu">
    <button class="ctx-btn" data-action="rename">✏️ Rename</button>
    <button class="ctx-btn" data-action="pin" id="pinBtn">📌 Pin</button>
    <div class="ctx-divider"></div>
    <button class="ctx-btn danger" data-action="delete">🗑️ Delete</button>
</div>

<!-- Rename Modal -->
<div id="renameModal">
    <div class="modal-box">
        <h3>Rename Session</h3>
        <p class="modal-sub">Give this session a custom name.</p>
        <input type="text" id="renameInput" placeholder="New session name…" />
        <div class="modal-actions">
            <button class="btn-cancel" id="renameCancel">Cancel</button>
            <button class="btn-save" id="renameConfirm">Save</button>
        </div>
    </div>
</div>

<script>
    // ──────────────────────────────────────────────────────────────
    //  CONFIG
    // ──────────────────────────────────────────────────────────────

    const BACKEND = 'https://skylineapp-backend-file.onrender.com';
    const token = localStorage.getItem('token');

    if (!token) {
        window.location.href = 'login.html';
    }

    // ──────────────────────────────────────────────────────────────
    //  STATE
    // ──────────────────────────────────────────────────────────────

    let allSessions = [];
    let contextTargetId = null;
    let currentRenameId = null;
    let expandedSessions = new Set();

    // ──────────────────────────────────────────────────────────────
    //  DOM REFS
    // ──────────────────────────────────────────────────────────────

    const sessionList = document.getElementById('sessionList');
    const searchInput = document.getElementById('searchInput');
    const countBadge = document.getElementById('countBadge');
    const contextMenu = document.getElementById('contextMenu');
    const renameModal = document.getElementById('renameModal');
    const renameInput = document.getElementById('renameInput');

    // ──────────────────────────────────────────────────────────────
    //  UTILITY FUNCTIONS
    // ──────────────────────────────────────────────────────────────

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            const now = new Date();
            const diff = now - d;

            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
            if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        } catch { return ''; }
    }

    function formatTime(dateStr) {
        if (!dateStr) return '';
        try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } catch { return ''; }
    }

    function formatAI(text) {
        if (!text) return '';
        let s = escapeHtml(text);
        s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/^[-•]\s+(.+)$/gm, '<li>$1</li>');
        s = s.replace(/(<li>[\s\S]*?<\/li>(\n)?)+/g, function(m) {
            return '<ul style="margin:4px 0;padding-left:20px;list-style:none;">' + m + '</ul>';
        });
        s = s.replace(/\n/g, '<br>');
        return s;
    }

    function getTypeLabel(type) {
        if (type === 'assistant') return 'ASSISTANT';
        if (type === 'lead') return 'LEAD';
        return 'CHAT';
    }

    function getTypeClass(type) {
        if (type === 'assistant') return 'assistant';
        if (type === 'lead') return 'lead';
        return 'chat';
    }

    // ──────────────────────────────────────────────────────────────
    //  LOAD SESSIONS (NEW ENDPOINT)
    // ──────────────────────────────────────────────────────────────

    async function loadSessions() {
        try {
            const res = await fetch(`${BACKEND}/api/history/sessions`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            allSessions = await res.json();
            renderSessions(allSessions);

        } catch (err) {
            console.error('Error loading sessions:', err);
            sessionList.innerHTML = `
                <div class="empty-state">
                    <span class="icon">⚠️</span>
                    Failed to load sessions.<br>
                    <span style="font-size:12px;color:#707070;">${err.message}</span>
                </div>
            `;
            countBadge.textContent = '0';
        }
    }

    // ──────────────────────────────────────────────────────────────
    //  RENDER SESSIONS
    // ──────────────────────────────────────────────────────────────

    function renderSessions(sessions) {
        sessionList.innerHTML = '';
        countBadge.textContent = sessions.length;

        if (sessions.length === 0) {
            sessionList.innerHTML = `
                <div class="empty-state">
                    <span class="icon">📭</span>
                    No conversations yet.<br>
                    <span style="font-size:13px;color:#707070;">Start a new search in the Dream Architect.</span>
                </div>
            `;
            return;
        }

        for (const session of sessions) {
            const item = createSessionElement(session);
            sessionList.appendChild(item);
        }
    }

    // ──────────────────────────────────────────────────────────────
    //  CREATE SESSION ELEMENT
    // ──────────────────────────────────────────────────────────────

    function createSessionElement(session) {
        const sessionId = session.sessionId;
        const name = session.name || 'Untitled';
        const type = session.type || 'chat';
        const msgCount = session.messageCount || 0;
        const isPinned = session.pinned || false;
        const isExpanded = expandedSessions.has(sessionId);
        const date = formatDate(session.lastUpdated || session.createdAt);
        const typeLabel = getTypeLabel(type);
        const typeClass = getTypeClass(type);

        const div = document.createElement('div');
        div.className = `session-item${isPinned ? ' pinned' : ''}${isExpanded ? ' expanded' : ''}`;
        div.dataset.sessionId = sessionId;

        // ── Header ──
        const header = document.createElement('div');
        header.className = 'session-header';
        header.dataset.sessionId = sessionId;

        const nameSpan = document.createElement('span');
        nameSpan.className = 'session-name';
        nameSpan.innerHTML = `${isPinned ? '<span class="pin-icon">📌</span>' : ''}${escapeHtml(name)}`;
        header.appendChild(nameSpan);

        const meta = document.createElement('div');
        meta.className = 'session-meta';
        meta.innerHTML = `
            <span class="count">${msgCount}</span>
            <span>${date}</span>
            <span class="type-badge" style="font-size:8px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,0.05);color:#8c909e;">${typeLabel}</span>
            <span class="session-arrow">▼</span>
        `;
        header.appendChild(meta);

        // ── Messages Container ──
        const messagesDiv = document.createElement('div');
        messagesDiv.className = 'session-messages';

        const inner = document.createElement('div');
        inner.className = 'session-messages-inner';
        inner.innerHTML = `<div class="loading-spinner" style="padding:12px;font-size:11px;">Loading messages…</div>`;
        messagesDiv.appendChild(inner);

        div.appendChild(header);
        div.appendChild(messagesDiv);

        // ── Click to Expand ──
        header.onclick = function(e) {
            e.stopPropagation();
            const sid = this.dataset.sessionId;
            toggleSession(sid, div, messagesDiv);
        };

        // ── Context Menu (Right Click) ──
        header.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            const sid = this.dataset.sessionId;
            showContextMenu(e.clientX, e.clientY, sid);
        });

        // ── Long Press for Mobile ──
        let timer;
        header.addEventListener('touchstart', function(e) {
            timer = setTimeout(() => {
                e.preventDefault();
                const touch = e.touches[0];
                const sid = this.dataset.sessionId;
                showContextMenu(touch.clientX, touch.clientY, sid);
            }, 600);
        });
        header.addEventListener('touchend', () => clearTimeout(timer));
        header.addEventListener('touchmove', () => clearTimeout(timer));

        return div;
    }

    // ──────────────────────────────────────────────────────────────
    //  TOGGLE SESSION
    // ──────────────────────────────────────────────────────────────

    function toggleSession(sessionId, element, messagesDiv) {
        const isExpanded = expandedSessions.has(sessionId);

        if (isExpanded) {
            expandedSessions.delete(sessionId);
            element.classList.remove('expanded');
        } else {
            expandedSessions.add(sessionId);
            element.classList.add('expanded');
            loadMessages(sessionId, messagesDiv);
        }
    }

    // ──────────────────────────────────────────────────────────────
    //  LOAD MESSAGES (NEW ENDPOINT)
    // ──────────────────────────────────────────────────────────────

    async function loadMessages(sessionId, container) {
        const inner = container.querySelector('.session-messages-inner');
        if (!inner) return;

        // Check if already loaded
        if (inner.dataset.loaded === 'true') return;

        try {
            const res = await fetch(`${BACKEND}/api/history/messages/${sessionId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const messages = await res.json();

            inner.innerHTML = '';

            if (!messages || messages.length === 0) {
                inner.innerHTML = `<div class="no-messages">No messages in this session.</div>`;
            } else {
                for (const msg of messages) {
                    const bubble = createMessageBubble(msg);
                    inner.appendChild(bubble);
                }
            }

            inner.dataset.loaded = 'true';

        } catch (err) {
            console.error('Error loading messages:', err);
            inner.innerHTML = `<div class="error-msg">⚠️ Failed to load messages: ${err.message}</div>`;
        }
    }

    // ──────────────────────────────────────────────────────────────
    //  CREATE MESSAGE BUBBLE
    // ──────────────────────────────────────────────────────────────

    function createMessageBubble(msg) {
        const div = document.createElement('div');
        const role = msg.role || 'user';
        div.className = `msg-bubble ${role}`;

        const roleLabel = role === 'ai' ? '🤖 AI' : '👤 You';

        let content = msg.content || '';
        let displayContent = content;

        // ── Format AI content ──
        if (role === 'ai') {
            // Check if it's JSON (leads data)
            if ((content.startsWith('[') || content.startsWith('{')) && content.length > 2) {
                try {
                    const parsed = JSON.parse(content);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        let leadText = `📊 ${parsed.length} lead${parsed.length > 1 ? 's' : ''} found\n\n`;
                        const maxShow = Math.min(parsed.length, 5);
                        for (let i = 0; i < maxShow; i++) {
                            const l = parsed[i];
                            const name = l.name || l.company || 'Unknown';
                            const company = l.company || '';
                            const email = l.email || '';
                            leadText += `${i+1}. ${name}${company ? ' - ' + company : ''}${email ? ' (' + email + ')' : ''}\n`;
                        }
                        if (parsed.length > 5) {
                            leadText += `\n... and ${parsed.length - 5} more`;
                        }
                        displayContent = leadText;
                    } else {
                        displayContent = JSON.stringify(parsed, null, 2);
                    }
                } catch (e) {
                    displayContent = content;
                }
            } else {
                displayContent = formatAI(content);
            }
        } else {
            displayContent = escapeHtml(content);
        }

        const time = msg.time || formatTime(msg.createdAt);

        div.innerHTML = `
            <div class="msg-role">${roleLabel}</div>
            <div class="msg-content">${displayContent}</div>
            ${time ? `<div class="msg-time">${time}</div>` : ''}
        `;

        return div;
    }

    // ──────────────────────────────────────────────────────────────
    //  CONTEXT MENU
    // ──────────────────────────────────────────────────────────────

    function showContextMenu(x, y, sessionId) {
        contextTargetId = sessionId;
        const session = allSessions.find(s => s.sessionId === sessionId);
        const isPinned = session?.pinned || false;

        const pinBtn = document.getElementById('pinBtn');
        pinBtn.innerHTML = isPinned ? '📌 Unpin' : '📌 Pin';

        const menuWidth = 160;
        const menuHeight = 140;
        const left = Math.min(x, window.innerWidth - menuWidth - 10);
        const top = Math.min(y, window.innerHeight - menuHeight - 10);
        contextMenu.style.left = Math.max(10, left) + 'px';
        contextMenu.style.top = Math.max(10, top) + 'px';
        contextMenu.style.display = 'block';
    }

    function hideContextMenu() {
        contextMenu.style.display = 'none';
        contextTargetId = null;
    }

    document.addEventListener('click', function(e) {
        if (!contextMenu.contains(e.target)) hideContextMenu();
    });

    document.querySelectorAll('#contextMenu .ctx-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const action = this.dataset.action;
            const sid = contextTargetId;
            hideContextMenu();

            if (action === 'rename') openRenameModal(sid);
            else if (action === 'pin') togglePin(sid);
            else if (action === 'delete') deleteSession(sid);
        });
    });

    // ──────────────────────────────────────────────────────────────
    //  RENAME SESSION
    // ──────────────────────────────────────────────────────────────

    function openRenameModal(sessionId) {
        currentRenameId = sessionId;
        const session = allSessions.find(s => s.sessionId === sessionId);
        renameInput.value = session?.name || '';
        renameModal.classList.add('active');
        renameInput.focus();
        renameInput.select();
    }

    document.getElementById('renameCancel').onclick = function() {
        renameModal.classList.remove('active');
        currentRenameId = null;
    };

    document.getElementById('renameConfirm').onclick = async function() {
        const name = renameInput.value.trim();
        if (!name) return;

        try {
            const res = await fetch(`${BACKEND}/api/history/rename/${currentRenameId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ name })
            });

            if (res.ok) {
                renameModal.classList.remove('active');
                currentRenameId = null;
                loadSessions();
            } else {
                alert('Failed to rename session');
            }
        } catch (err) {
            alert('Connection error');
        }
    };

    renameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('renameConfirm').click();
        if (e.key === 'Escape') document.getElementById('renameCancel').click();
    });

    // ──────────────────────────────────────────────────────────────
    //  PIN / UNPIN
    // ──────────────────────────────────────────────────────────────

    async function togglePin(sessionId) {
        const session = allSessions.find(s => s.sessionId === sessionId);
        if (!session) return;

        const newPinned = !session.pinned;

        try {
            const res = await fetch(`${BACKEND}/api/history/pin/${sessionId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ pinned: newPinned })
            });

            if (res.ok) {
                loadSessions();
            } else {
                alert('Failed to update pin');
            }
        } catch (err) {
            alert('Connection error');
        }
    }

    // ──────────────────────────────────────────────────────────────
    //  DELETE SESSION
    // ──────────────────────────────────────────────────────────────

    async function deleteSession(sessionId) {
        if (!confirm('Delete this session and all its messages?')) return;

        try {
            const res = await fetch(`${BACKEND}/api/history/delete/${sessionId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                expandedSessions.delete(sessionId);
                loadSessions();
            } else {
                alert('Failed to delete session');
            }
        } catch (err) {
            alert('Connection error');
        }
    }

    // ──────────────────────────────────────────────────────────────
    //  SEARCH
    // ──────────────────────────────────────────────────────────────

    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        if (!query) {
            renderSessions(allSessions);
            return;
        }
        const filtered = allSessions.filter(s =>
            (s.name || '').toLowerCase().includes(query)
        );
        renderSessions(filtered);
    });

    // ──────────────────────────────────────────────────────────────
    //  INIT
    // ──────────────────────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', function() {
        loadSessions();

        // Click outside to close context menu
        document.addEventListener('click', function(e) {
            if (!contextMenu.contains(e.target)) hideContextMenu();
        });
    });
</script>
</body>
  </html>
